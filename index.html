    if(i) ctx.lineTo(x,y); else ctx.moveTo(x,y);
  }
  ctx.closePath();
}

function drawShrinkRay(){
  if(!rayFx) return;
  const a=Math.max(0,rayFx.life/0.22);
  const x0=rayFx.x-cam.x, y0=rayFx.y-cam.y, x1=x0+rayFx.dir*640;
  ctx.save();
  ctx.globalAlpha=a;
  ctx.strokeStyle='rgba(125,252,255,0.35)'; ctx.lineWidth=16;
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y0); ctx.stroke();
  ctx.strokeStyle='#7dfcff'; ctx.lineWidth=5;
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y0); ctx.stroke();
  ctx.fillStyle='#eaffff';
  ctx.beginPath(); ctx.arc(x0,y0,7*a,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawCoin(p){
  if(p.t<=0) return;                                  // still queued behind its siblings
  const cx=p.x+7-cam.x, cy=p.y+7-cam.y;
  // Spin read as a squashing ellipse rather than a rotation, so it reads as a
  // coin edge-on at any size
  const sq=Math.abs(Math.cos(p.spin));
  ctx.save();
  ctx.globalAlpha=0.35;
  ctx.fillStyle='#ffd700';
  ctx.beginPath(); ctx.ellipse(cx,cy,10,10,0,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;
  ctx.fillStyle='#c8930a';
  ctx.beginPath(); ctx.ellipse(cx,cy,Math.max(1.2,7*sq),7,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ffd700';
  ctx.beginPath(); ctx.ellipse(cx,cy,Math.max(0.8,5.6*sq),5.6,0,0,Math.PI*2); ctx.fill();
  if(sq>0.45){
    ctx.fillStyle='#fff3b0';
    ctx.beginPath(); ctx.ellipse(cx-1.5*sq,cy-1.5,1.8*sq,2.4,0,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawPickups(){
  for(const p of pickups){
    if(p.dead) continue;
    if(p.type==='coin'){ drawCoin(p); continue; }
    const px=p.x-cam.x, py=p.y-cam.y+Math.sin(p.bob)*3;
    const cx=px+9, cy=py+9;
    const def=POWERUPS[p.type]||POWERUPS.health;
    ctx.save();

    // Pulsing glow so a power-up reads as a power-up from a screen away
    const pulse=0.55+Math.sin(p.bob*1.5)*0.25;
    ctx.globalAlpha=pulse*0.5;
    ctx.fillStyle=def.color;
    ctx.beginPath(); ctx.arc(cx,cy,13,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;

    if(p.type==='health'){
      ctx.fillStyle='#aa2233'; ctx.fillRect(px+2,py+2,14,14);
      ctx.fillStyle='#ff6677'; ctx.fillRect(px+3,py+3,12,12);
      ctx.fillStyle='#ffeeee'; ctx.fillRect(px+8,py+5,3,9); ctx.fillRect(px+5,py+8,9,3);
    } else if(p.type==='star'){
      starPath(cx,cy,10,4.2,p.bob*0.7);
      ctx.fillStyle=def.color; ctx.fill();
      ctx.strokeStyle='#fff6c0'; ctx.lineWidth=1.5; ctx.stroke();
      starPath(cx,cy,4.5,1.9,p.bob*0.7);
      ctx.fillStyle='#fffbe6'; ctx.fill();
    } else if(p.type==='speed'){
      // Lightning bolt
      ctx.fillStyle=def.color;
      ctx.beginPath();
      ctx.moveTo(cx+3,cy-10); ctx.lineTo(cx-6,cy+1); ctx.lineTo(cx-1,cy+1);
      ctx.lineTo(cx-3,cy+10); ctx.lineTo(cx+6,cy-2); ctx.lineTo(cx+1,cy-2);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle='#eafaff'; ctx.lineWidth=1.2; ctx.stroke();
    } else {
      ctx.fillStyle=def.color;
      ctx.beginPath(); ctx.arc(cx,cy,9,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#fdf3ff'; ctx.font='bold 12px monospace';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('×2',cx,cy+1);
      ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    }
    ctx.restore();
  }
}

// ── SCREEN OVERLAYS ──
// ══════════════════════════════════════════════════════
//  SECRET PICKER  (odlaw cheat)
// ══════════════════════════════════════════════════════
// All six are selectable whether or not their key has been found — that is the
// whole point of the cheat. Built with tap support from the start, since the
// mobile code (▲ ⚔ ▲ ⚔) means phone players are the ones most likely to use it.
let pickSel=0, pickKeyHeld=false;
const pickWorlds = ()=>Object.keys(SECRET_LEVEL).map(Number).sort((a,b)=>a-b);
const pickRows = ()=>pickWorlds().length+1;          // + a BACK row
function pickBox(i){ return { x:W/2-210, y:150+i*44, w:420, h:36 }; }

function openSecretPicker(){
  initAC();
  pickSel=0; pickKeyHeld=true;      // the key that opened this is still down
  G.screen='SECRET_PICK';
  SFX.clear();
}
function closeSecretPicker(){
  pickKeyHeld=true;
  G.screen='PLAYING';
  SFX.pickup();
}
function pickActivate(){
  const ws=pickWorlds();
  if(pickSel>=ws.length){ closeSecretPicker(); return; }
  startSecretLevel(ws[pickSel],{cheat:true});
}

function handleSecretPickInput(){
  const up=keys['ArrowUp']||keys['KeyW'], down=keys['ArrowDown']||keys['KeyS'];
  const go=keys['Enter']||keys['Space'], back=keys['Escape'];
  const n=pickRows();
  if(up||down||go||back){
    if(!pickKeyHeld){
      pickKeyHeld=true;
      if(back) closeSecretPicker();
      else if(go) pickActivate();
      else if(down){ pickSel=(pickSel+1)%n; SFX.pickup(); }
      else if(up){ pickSel=(pickSel+n-1)%n; SFX.pickup(); }
    }
  } else pickKeyHeld=false;

  if(tapPoint){
    // Nearest row, same as the title — a 36px row is ~25 CSS px on a phone
    const first=pickBox(0), last=pickBox(n-1);
    if(tapPoint.x>first.x-24&&tapPoint.x<first.x+first.w+24&&
       tapPoint.y>first.y-12&&tapPoint.y<last.y+last.h+12){
      let best=0, bestD=Infinity;
      for(let i=0;i<n;i++){
        const b=pickBox(i), d=Math.abs(tapPoint.y-(b.y+b.h/2));
        if(d<bestD){ bestD=d; best=i; }
      }
      pickSel=best; tapPoint=null; pickActivate(); return;
    }
    tapPoint=null;
  }
}

function drawSecretPicker(){
  ctx.fillStyle='rgba(4,6,12,0.88)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.save();
  ctx.shadowColor='#ffd54a'; ctx.shadowBlur=14;
  ctx.fillStyle='#ffe89a'; ctx.font='bold 26px monospace';
  ctx.fillText('★  SECRET LEVEL SELECT  ★',W/2,96);
  ctx.restore();
  ctx.fillStyle='#8a8256'; ctx.font='11px monospace';
  ctx.fillText('odlaw',W/2,118);

  const ws=pickWorlds();
  for(let i=0;i<pickRows();i++){
    const b=pickBox(i), sel=(i===pickSel);
    const isBack=(i>=ws.length);
    ctx.fillStyle=sel?'rgba(120,90,20,0.55)':'rgba(0,0,0,0.35)';
    ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.strokeStyle=sel?'#ffd54a':'#4a4636'; ctx.lineWidth=2;
    ctx.strokeRect(b.x,b.y,b.w,b.h);

    if(isBack){
      ctx.fillStyle=sel?'#ffffff':'#9a9276'; ctx.font='bold 15px monospace';
      ctx.fillText('BACK TO THE LEVEL',W/2,b.y+24);
    } else {
      const w=ws[i], meta=SECRET_META[SECRET_THEME[w]];
      ctx.textAlign='left';
      ctx.fillStyle=sel?'#ffffff':'#c8bf94'; ctx.font='bold 15px monospace';
      ctx.fillText(`WORLD ${w}  ·  ${WORLDS[w].name}`,b.x+14,b.y+16);
      ctx.fillStyle=sel?'#ffe89a':'#8a8256'; ctx.font='11px monospace';
      ctx.fillText(meta.name+' — '+meta.blurb,b.x+14,b.y+30);
      ctx.textAlign='right';
      ctx.fillStyle=secretsFound.has(w)?'#7fd06a':'#6a6450'; ctx.font='bold 11px monospace';
      ctx.fillText(secretsFound.has(w)?'FOUND':'NOT FOUND',b.x+b.w-14,b.y+22);
      ctx.textAlign='center';
    }
    if(sel&&Math.sin(frameN*.12)>0){
      ctx.fillStyle='#ffd54a'; ctx.font='bold 15px monospace';
      ctx.fillText('>',b.x-14,b.y+24); ctx.fillText('<',b.x+b.w+14,b.y+24);
    }
  }
  ctx.fillStyle='#6a6450'; ctx.font='11px monospace';
  ctx.fillText('Cheating in a secret does not count towards Golden Phil',W/2,H-40);
  ctx.fillStyle='#445544';
  ctx.fillText(isTouchDevice?'Tap a row':'Arrows/WASD: Select   Enter: Play   Esc: Back',W/2,H-22);
  ctx.textAlign='left';
}

// ══════════════════════════════════════════════════════
//  MUSEUM
// ══════════════════════════════════════════════════════
// Every enemy and boss, drawn with the game's own art rather than a portrait —
// the point of a museum is the artwork, so the boss panels call drawBoss() on a
// real object from spawnBoss with the globals temporarily pointed at it. That
// makes spawnBoss the single source of truth for what a boss looks like, here
// and in a fight.
const MUSEUM = [
  { id:'soldier', kind:'enemy',
    blurb:'Standard infantry. Patrols its platform until it spots Phil, then commits.' },
  { id:'archer', kind:'enemy',
    blurb:'Hangs back and shoots. Its arrows are the only thing a plain shield stops.' },
  { id:'heavy', kind:'enemy',
    blurb:'Four hits and a raised guard. The hammer is the one weapon that ignores it.' },
  { id:'bomber', kind:'enemy',
    blurb:'Lobs arcing bombs and retreats. The bombs can be knocked out of the air.' },
  { id:'glider', kind:'enemy',
    blurb:'Dives from above. A swing from the ground misses — meet it in the air.' },
  { id:'giant', kind:'boss', blurb:'The commander who came after him first. Swings a club and stamps.' },
  { id:'anaconda', kind:'boss', blurb:'The forest\'s own guardian. Coils, lunges, and comes apart in segments.' },
  { id:'lizard', kind:'boss', blurb:'Desert machine built to hunt. Charges in a straight line and breathes fire.' },
  { id:'frostwarden', kind:'boss', blurb:'Sentinel of the glacier. Throws ice and freezes the ground under Phil.' },
  { id:'yeti', kind:'boss', blurb:'Big, loud and slow. Two out of three is not enough to stop him.' },
  { id:'foreman', kind:'boss', blurb:'Runs the assembly line that built Phil. Still calls him Unit 47.' },
  { id:'revenant', kind:'boss', blurb:'A prototype that will not stay down. Splits in two when it is hurt.' },
  { id:'tunnelfiend', kind:'boss', blurb:'Ambusher from the depths. You hear it before you ever see it.' },
  { id:'mole', kind:'boss', blurb:'Burrows out of the floor wherever Phil is standing.' },
  { id:'captain', kind:'boss', blurb:'Riot shield, no patience. Pursues behind an iron wall.' },
  { id:'agent', kind:'boss', blurb:'Berlin\'s raid chief. The last thing between Phil and the border.' },
  { id:'mech', kind:'boss', blurb:'The Stickman Army\'s supreme weapon. Fists, lasers, and then the shrink ray.' },
];

const MUSEUM_KEY='pe_museum';
function loadMuseum(){
  try{
    const m=JSON.parse(localStorage.getItem(MUSEUM_KEY));
    if(m&&typeof m==='object'){
      const ids=new Set(MUSEUM.map(e=>e.id));
      const kills={};
      for(const [k,v] of Object.entries(m.kills||{})) if(ids.has(k)&&v>0) kills[k]=v|0;
      return { seen:new Set((m.seen||[]).filter(id=>ids.has(id))), kills };
    }
  }catch(e){}
  return { seen:new Set(), kills:{} };
}
let museum = loadMuseum();
let museumDirty = false;
function saveMuseum(){
  try{ localStorage.setItem(MUSEUM_KEY,JSON.stringify({
    seen:[...museum.seen], kills:museum.kills })); }catch(e){}
  museumDirty=false;
}
// Called from spawn paths that run every level start, so the writes are batched
// to the end of the frame rather than hitting localStorage per enemy.
function museumSee(id){
  if(!id||museum.seen.has(id)) return;
  museum.seen.add(id); museumDirty=true;
}
function museumKill(id){
  if(!id) return;
  museum.kills[id]=(museum.kills[id]||0)+1; museumDirty=true;
}
function museumName(e){
  return e.kind==='enemy'
    ? ({soldier:'Stickman Soldier',archer:'Stickman Archer',heavy:'Heavy Soldier',
        bomber:'Bomb Thrower',glider:'Stickman Glider'})[e.id]
    : (getBossMeta(e.id).name||e.id);
}

let musSel=0, musKeyHeld=false, musFake=null, musPhase=0;
function musRow(i){ return { x:28, y:88+i*24, w:258, h:22 }; }
function musPanel(){ return { x:302, y:88, w:630, h:408 }; }

function openMuseum(){
  initAC();
  // The boss draw functions read the live globals. Opening the museum straight
  // off the title means there is no level and no Phil yet, so give them one.
  if(!levelData) levelData=genTutorialLevel();
  if(!phil) initPhil(60,GROUND_Y-PHIL_H-1);
  musSel=0; musKeyHeld=true; musFake=null; musPhase=0;
  G.screen='MUSEUM';
  SFX.pickup();
}

function musEntry(){ return MUSEUM[musSel]; }
function musUnlocked(e){ return museum.seen.has(e.id); }

function handleMuseumInput(){
  const up=keys['ArrowUp']||keys['KeyW'], down=keys['ArrowDown']||keys['KeyS'];
  const back=keys['Escape']||keys['Enter'];
  const n=MUSEUM.length;
  if(up||down||back){
    if(!musKeyHeld){
      musKeyHeld=true;
      if(back){ titleKeyHeld=true; G.screen='TITLE'; SFX.pickup(); if(museumDirty) saveMuseum(); }
      else if(down){ musSel=(musSel+1)%n; musFake=null; SFX.pickup(); }
      else if(up){ musSel=(musSel+n-1)%n; musFake=null; SFX.pickup(); }
    }
  } else musKeyHeld=false;

  if(tapPoint){
    const first=musRow(0), last=musRow(n-1);
    if(tapPoint.x>first.x-16&&tapPoint.x<first.x+first.w+16&&
       tapPoint.y>first.y-10&&tapPoint.y<last.y+last.h+10){
      let best=0, bestD=Infinity;
      for(let i=0;i<n;i++){
        const b=musRow(i), d=Math.abs(tapPoint.y-(b.y+b.h/2));
        if(d<bestD){ bestD=d; best=i; }
      }
      if(best!==musSel){ musSel=best; musFake=null; SFX.pickup(); }
      tapPoint=null; return;
    }
    // Anywhere else leaves, which is the only exit a phone has
    tapPoint=null; titleKeyHeld=true; G.screen='TITLE'; SFX.pickup();
    if(museumDirty) saveMuseum();
  }
}

// The exhibit itself. Enemies go through drawStickman like they do in a level;
// bosses borrow the globals for the length of one call and hand them straight
// back, so nothing outside this function can observe the swap.
function drawMuseumExhibit(e, cx, cy){
  if(e.kind==='enemy'){
    const cfg=ENEMY_CFG[e.id];
    const sc=e.id==='glider'?2.4:2.2;
    drawStickman(cx+cam.x-cfg.w/2, cy+cam.y-cfg.h, cfg.w, cfg.h, {
      facingR:true, walkCycle:musPhase, attacking:false, atkTimer:0, atkDur:0.8,
      shielding:e.id==='heavy', color:cfg.color,
      swordColor:e.id==='heavy'?'#bba56a':'#888', shieldColor:cfg.shieldColor,
      invTimer:0, dead:false, isPlayer:false, scale:sc,
      isArcher:e.id==='archer', health:cfg.maxHealth, maxHealth:0, type:e.id,
    });
    return;
  }
  if(!musFake){
    musFake=spawnBoss(e.id,1400);
    musFake.invTimer=0; musFake.dead=false; musFake.deathTimer=0;
    if(musFake.aiState==='INTRO') musFake.aiState='WALK';
  }
  musFake.walkCycle=musPhase;
  musFake.facingR=true;
  const savedBoss=boss, sx=cam.x, sy=cam.y;
  boss=musFake;
  // Frame the boss in the panel by moving the camera, not the boss: its draw
  // code is written against world coordinates and some of it is absolute
  cam.x=(musFake.x+musFake.w/2)-cx;
  cam.y=(musFake.y+musFake.h)-cy;
  try{ drawBoss(); }catch(err){ /* never let one exhibit take the screen down */ }
  boss=savedBoss; cam.x=sx; cam.y=sy;
}

function drawMuseum(dt){
  musPhase+=dt*2.2;
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#141018'); g.addColorStop(1,'#20182a');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  ctx.textAlign='center';
  ctx.save();
  ctx.shadowColor='#c9a8ff'; ctx.shadowBlur=14;
  ctx.fillStyle='#e6d6ff'; ctx.font='bold 26px monospace';
  ctx.fillText('MUSEUM',W/2,52);
  ctx.restore();
  const found=MUSEUM.filter(musUnlocked).length;
  ctx.fillStyle='#8a7fa0'; ctx.font='11px monospace';
  ctx.fillText(`${found} of ${MUSEUM.length} discovered — meet one in the game to unlock its page`,W/2,72);
  ctx.textAlign='left';

  // Index
  for(let i=0;i<MUSEUM.length;i++){
    const e=MUSEUM[i], b=musRow(i), sel=i===musSel, on=musUnlocked(e);
    const hue=e.kind==='enemy'?'#7fd06a':'#ffbb55';
    ctx.fillStyle=sel?'rgba(160,130,220,0.4)':'rgba(0,0,0,0.28)';
    ctx.fillRect(b.x,b.y,b.w,b.h);
    if(sel){ ctx.strokeStyle='#c9a8ff'; ctx.lineWidth=2; ctx.strokeRect(b.x,b.y,b.w,b.h); }
    ctx.fillStyle=on?(sel?'#ffffff':hue):(sel?'#9a90b4':'#4e4760');
    ctx.font='bold 12px monospace';
    ctx.fillText(on?museumName(e):'? ? ?',b.x+10,b.y+15);
    const k=museum.kills[e.id]||0;
    if(on&&k>0){
      ctx.textAlign='right';
      ctx.fillStyle=sel?'#e6d6ff':'#6f6786'; ctx.font='11px monospace';
      ctx.fillText(String(k),b.x+b.w-10,b.y+15);
      ctx.textAlign='left';
    }
  }

  // Exhibit
  const p=musPanel(), e=musEntry(), on=musUnlocked(e);
  ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.strokeStyle='#4a4060'; ctx.lineWidth=2; ctx.strokeRect(p.x,p.y,p.w,p.h);
  // Plinth
  ctx.fillStyle='rgba(200,170,255,0.10)';
  ctx.fillRect(p.x+40,p.y+250,p.w-80,10);

  if(on){
    ctx.save();
    ctx.beginPath(); ctx.rect(p.x+2,p.y+2,p.w-4,262); ctx.clip();
    drawMuseumExhibit(e,p.x+p.w/2,p.y+250);
    ctx.restore();
  } else {
    ctx.textAlign='center';
    ctx.fillStyle='#3d3552'; ctx.font='bold 90px monospace';
    ctx.fillText('?',p.x+p.w/2,p.y+180);
    ctx.fillStyle='#6f6786'; ctx.font='13px monospace';
    ctx.fillText('Not met yet',p.x+p.w/2,p.y+220);
    ctx.textAlign='left';
  }

  ctx.textAlign='center';
  ctx.fillStyle=on?'#ffffff':'#5e5675'; ctx.font='bold 20px monospace';
  ctx.fillText(on?museumName(e):'? ? ?',p.x+p.w/2,p.y+292);
  // A locked boss must not leak its own tagline — that is half the reveal
  ctx.fillStyle=on?(e.kind==='enemy'?'#7fd06a':'#ffbb55'):'#5e5675';
  ctx.font='11px monospace';
  ctx.fillText(!on ? (e.kind==='enemy'?'ENEMY':'BOSS')
                   : (e.kind==='enemy'?'ENEMY':(getBossMeta(e.id).intro||'BOSS')),
    p.x+p.w/2,p.y+312);

  if(on){
    ctx.fillStyle='#b9aecd'; ctx.font='13px monospace';
    wrapLine(e.blurb,p.w-80,'13px monospace').forEach((l,i)=>
      ctx.fillText(l,p.x+p.w/2,p.y+342+i*19));
    const k=museum.kills[e.id]||0;
    ctx.fillStyle='#8a7fa0'; ctx.font='bold 13px monospace';
    ctx.fillText(k>0?('DEFEATED  '+k):'Not beaten yet',p.x+p.w/2,p.y+392);
  }

  ctx.fillStyle='#544c68'; ctx.font='11px monospace';
  ctx.fillText(isTouchDevice?'Tap a name  •  tap anywhere else to leave'
    :'Arrows/WASD: Browse   Esc: Back',W/2,H-18);
  ctx.textAlign='left';
}

// ══════════════════════════════════════════════════════
//  PRACTICE — the tutorial and the four drills
// ══════════════════════════════════════════════════════
// One title row for everything you do to get better, because the title menu was
// already at eight rows and out of vertical space. It also groups them honestly:
// the tutorial teaches, the drills score.
let pracSel=0, pracKeyHeld=false;
const pracRows = ()=>1+TRAIN_ORDER.length+1;          // tutorial + drills + BACK
function pracBox(i){ return { x:W/2-260, y:132+i*54, w:520, h:46 }; }

function openPractice(fromDrill){
  initAC();
  pracKeyHeld=true;
  if(!fromDrill) pracSel=0;
  G.screen='PRACTICE';
  if(!fromDrill) SFX.pickup();
}

function pracActivate(){
  if(pracSel===0){ startTutorial('PRACTICE'); return; }
  const id=TRAIN_ORDER[pracSel-1];
  if(id){ startTraining(id); return; }
  titleKeyHeld=true; G.screen='TITLE'; SFX.pickup();     // BACK
}

function handlePracticeInput(){
  const up=keys['ArrowUp']||keys['KeyW'], down=keys['ArrowDown']||keys['KeyS'];
  const go=keys['Enter']||keys['Space'], back=keys['Escape'];
  const n=pracRows();
  if(up||down||go||back){
    if(!pracKeyHeld){
      pracKeyHeld=true;
      if(back){ titleKeyHeld=true; G.screen='TITLE'; SFX.pickup(); }
      else if(go) pracActivate();
      else if(down){ pracSel=(pracSel+1)%n; SFX.pickup(); }
      else if(up){ pracSel=(pracSel+n-1)%n; SFX.pickup(); }
    }
  } else pracKeyHeld=false;

  if(tapPoint){
    const first=pracBox(0), last=pracBox(n-1);
    if(tapPoint.x>first.x-24&&tapPoint.x<first.x+first.w+24&&
       tapPoint.y>first.y-14&&tapPoint.y<last.y+last.h+14){
      let best=0, bestD=Infinity;
      for(let i=0;i<n;i++){
        const b=pracBox(i), d=Math.abs(tapPoint.y-(b.y+b.h/2));
        if(d<bestD){ bestD=d; best=i; }
      }
      pracSel=best; tapPoint=null; pracActivate(); return;
    }
    tapPoint=null;
  }
}

function drawPractice(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0c1420'); g.addColorStop(1,'#16202e');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.save();
  ctx.shadowColor='#ffd54a'; ctx.shadowBlur=14;
  ctx.fillStyle='#ffe89a'; ctx.font='bold 30px monospace';
  ctx.fillText('PRACTICE',W/2,74);
  ctx.restore();
  const done=TRAIN_ORDER.filter(id=>trainRec.cleared.has(id)).length;
  ctx.fillStyle='#6f7a86'; ctx.font='11px monospace';
  ctx.fillText(`Learn the game, then drill it — ${done} of ${TRAIN_ORDER.length} drills passed`,W/2,98);

  for(let i=0;i<pracRows();i++){
    const b=pracBox(i), sel=(i===pracSel);
    const isTut=(i===0), isBack=(i===pracRows()-1);
    const id=(!isTut&&!isBack)?TRAIN_ORDER[i-1]:null;
    const d=id?TRAINING[id]:null;
    const cleared=id?trainRec.cleared.has(id):false;

    ctx.fillStyle=sel?'rgba(120,90,20,0.5)':'rgba(0,0,0,0.32)';
    ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.strokeStyle=sel?'#ffd54a':(cleared?'#5a7a55':'#33404e'); ctx.lineWidth=2;
    ctx.strokeRect(b.x,b.y,b.w,b.h);

    if(isBack){
      ctx.fillStyle=sel?'#ffffff':'#9a9276'; ctx.font='bold 15px monospace';
      ctx.fillText('BACK TO THE TITLE',W/2,b.y+29);
    } else if(isTut){
      ctx.textAlign='left';
      ctx.fillStyle=sel?'#ffffff':'#c8bf94'; ctx.font='bold 15px monospace';
      ctx.fillText('HOW TO PLAY',b.x+16,b.y+20);
      ctx.fillStyle=sel?'#ffe89a':'#7f8a96'; ctx.font='11px monospace';
      ctx.fillText('The tutorial — every control, one at a time',b.x+16,b.y+36);
      ctx.textAlign='right';
      ctx.fillStyle=tutorialDone?'#7fd06a':'#6a6450'; ctx.font='bold 11px monospace';
      ctx.fillText(tutorialDone?'DONE':'NOT DONE YET',b.x+b.w-16,b.y+28);
      ctx.textAlign='center';
    } else {
      ctx.textAlign='left';
      ctx.fillStyle=sel?'#ffffff':'#c8bf94'; ctx.font='bold 15px monospace';
      ctx.fillText(d.name,b.x+16,b.y+20);
      ctx.fillStyle=sel?'#ffe89a':'#7f8a96'; ctx.font='11px monospace';
      ctx.fillText(d.blurb,b.x+16,b.y+36);
      ctx.textAlign='right';
      const best=trainRec.best[id];
      ctx.fillStyle=cleared?'#7fd06a':'#6a6450'; ctx.font='bold 11px monospace';
      ctx.fillText(cleared?'PASSED':'TO PASS '+fmtTrain(id,d.target),b.x+b.w-16,b.y+20);
      ctx.fillStyle=best!=null?'#c8cf9a':'#4e5866'; ctx.font='11px monospace';
      ctx.fillText('BEST '+fmtTrain(id,best),b.x+b.w-16,b.y+36);
      ctx.textAlign='center';
    }
    if(sel&&Math.sin(frameN*.12)>0){
      ctx.fillStyle='#ffd54a'; ctx.font='bold 15px monospace';
      ctx.fillText('>',b.x-14,b.y+30); ctx.fillText('<',b.x+b.w+14,b.y+30);
    }
  }

  ctx.fillStyle='#445544'; ctx.font='11px monospace';
  ctx.fillText(isTouchDevice?'Tap a row'
    :'Arrows/WASD: Select   Enter: Start   Esc: Back',W/2,H-22);
  ctx.textAlign='left';
}

// ══════════════════════════════════════════════════════
//  WEAPON SHOP
// ══════════════════════════════════════════════════════
// Reachable from the title and from the pause menu, and it remembers which, so
// shopping mid-level drops you back into the level rather than the menu. The
// level underneath stays exactly as it was — nothing here touches the run.
let shopSel=0, shopKeyHeld=false, shopReturn='TITLE', shopMsg='', shopMsgT=0;
// Two tabs in one shop rather than a second shop screen: it is the one place the
// player already goes to spend coins, and cloaks and weapons compete for the same
// purse. Navigation is three bands — tabs, cards, back — so a tap and the
// keyboard reach exactly the same things.
let shopTab='weapons';                       // 'weapons' | 'cloaks' | 'shields'
let shopBand=1;                              // 0 tabs, 1 cards, 2 back

const SHOP_TABS = ['weapons','cloaks','shields'];
const shopIds = ()=> shopTab==='weapons' ? WEAPON_ORDER
                   : shopTab==='cloaks'  ? CLOAK_ORDER : SHIELD_ORDER;
const shopDefs = ()=> shopTab==='weapons' ? WEAPONS
                    : shopTab==='cloaks'  ? CLOAKS : SHIELDS;
const shopOwnedSet = ()=> shopTab==='weapons' ? shop.owned
                        : shopTab==='cloaks'  ? shop.cloaks : shop.shields;
const shopWornId = ()=> shopTab==='weapons' ? shop.equipped
                      : shopTab==='cloaks'  ? shop.cloak : shop.shield;
function shopTabBox(i){ return { x:W/2-309+i*206, y:104, w:200, h:32 }; }
function shopCard(i){
  // Six cloaks will not fit at the weapons' width, so each tab sets its own
  if(shopTab==='cloaks') return { x:22+i*153, y:150, w:143, h:240 };
  return { x:30+i*232, y:150, w:212, h:240 };      // weapons and shields: 4 wide
}
function shopBackBox(){ return { x:W/2-160, y:H-58, w:320, h:32 }; }

function openShop(from){
  initAC();
  shopReturn=from;
  shopTab='weapons'; shopBand=1;
  shopSel=Math.max(0,WEAPON_ORDER.indexOf(shop.equipped));
  shopKeyHeld=true;                       // the key that opened this is still down
  shopMsg=''; shopMsgT=0;
  G.screen='SHOP';
  SFX.pickup();
}
function closeShop(){
  const back=shopReturn;
  shopKeyHeld=true;
  // The Escape that closed this is still down on the next frame, and whatever
  // screen we land on reads it as its own press — PLAYING would pause instantly
  if(back==='PLAYING'){ pauseKeyHeld=true; G.screen='PLAYING'; }
  else { titleKeyHeld=true; G.screen='TITLE'; }
  SFX.pickup();
}
function shopSay(msg){ shopMsg=msg; shopMsgT=2.2; }

function setShopTab(tab){
  if(shopTab===tab) return;
  shopTab=tab;
  shopSel=Math.max(0,shopIds().indexOf(shopWornId()));
  SFX.pickup();
}

function buyWeapon(id){
  const wep=WEAPONS[id];
  if(shop.owned.has(id)){
    if(shop.equipped===id){ shopSay(wep.name+' is already in your hands'); SFX.pickup(); return; }
    equipWeapon(id); SFX.power();
    shopSay(martialActive() ? wep.name+' equipped — take the gi off to use it'
                            : wep.name+' equipped!');
    return;
  }
  if(shop.coins<wep.price){ SFX.broke(); shopSay('You need '+(wep.price-shop.coins)+' more coins'); return; }
  shop.coins-=wep.price; shop.owned.add(id); shop.equipped=id;
  // Buying the bazooka hands over a full load, so it is usable the moment you
  // walk out — a fresh purchase that fires nothing would just look broken.
  if(wep.ammoMax&&phil) phil.ammo=wep.ammoMax;
  saveShop(); SFX.buy(); shopSay(wep.name+' bought and equipped!');
}

function buyCloak(id){
  const cl=CLOAKS[id];
  if(shop.cloaks.has(id)){
    if(shop.cloak===id){ shopSay(cl.name+' is already on'); SFX.pickup(); return; }
    equipCloak(id); SFX.power();
    shopSay(cl.martial ? 'GI ON — kicks and punches, no weapons'
                       : cl.name+' on!');
    return;
  }
  if(shop.coins<cl.price){ SFX.broke(); shopSay('You need '+(cl.price-shop.coins)+' more coins'); return; }
  shop.coins-=cl.price; shop.cloaks.add(id); shop.cloak=id;
  saveShop(); SFX.buy(); shopSay(cl.name+' bought and on!');
}

function buyShield(id){
  const sd=SHIELDS[id];
  if(shop.shields.has(id)){
    if(shop.shield===id){ shopSay(sd.name+' is already on his arm'); SFX.pickup(); return; }
    equipShield(id); SFX.power(); shopSay(sd.name+' equipped!');
    return;
  }
  if(shop.coins<sd.price){ SFX.broke(); shopSay('You need '+(sd.price-shop.coins)+' more coins'); return; }
  shop.coins-=sd.price; shop.shields.add(id); shop.shield=id;
  if(phil) phil.shieldCharges=sd.charges||0;
  saveShop(); SFX.buy(); shopSay(sd.name+' bought and equipped!');
}

function shopActivate(){
  if(shopBand===2){ closeShop(); return; }
  if(shopBand===0){ setShopTab(SHOP_TABS[shopSel]||'weapons'); shopBand=1; shopSel=0; return; }
  const id=shopIds()[shopSel];
  if(!id) return;
  if(shopTab==='weapons') buyWeapon(id);
  else if(shopTab==='cloaks') buyCloak(id);
  else buyShield(id);
}

function handleShopInput(dt){
  if(shopMsgT>0) shopMsgT-=dt;
  const left=keys['ArrowLeft']||keys['KeyA'], right=keys['ArrowRight']||keys['KeyD'];
  const up=keys['ArrowUp']||keys['KeyW'], down=keys['ArrowDown']||keys['KeyS'];
  const go=keys['Enter']||keys['Space'], back=keys['Escape'];
  if(left||right||up||down||go||back){
    if(!shopKeyHeld){
      shopKeyHeld=true;
      if(back) closeShop();
      else if(go) shopActivate();
      else if(down){ shopBand=(shopBand+1)%3; shopSel=shopBandSel(); SFX.pickup(); }
      else if(up){ shopBand=(shopBand+2)%3; shopSel=shopBandSel(); SFX.pickup(); }
      else if(right||left){
        const step=right?1:-1;
        if(shopBand===0){
          const i=(SHOP_TABS.indexOf(shopTab)+step+SHOP_TABS.length)%SHOP_TABS.length;
          setShopTab(SHOP_TABS[i]); shopSel=i;
        }
        else if(shopBand===1){ const n=shopIds().length; shopSel=(shopSel+step+n)%n; SFX.pickup(); }
      }
    }
  } else shopKeyHeld=false;

  if(tapPoint){
    for(let i=0;i<SHOP_TABS.length;i++){
      const b=shopTabBox(i);
      if(tapPoint.x>=b.x&&tapPoint.x<=b.x+b.w&&tapPoint.y>=b.y-8&&tapPoint.y<=b.y+b.h+8){
        setShopTab(SHOP_TABS[i]); shopBand=1; shopSel=0; tapPoint=null; return;
      }
    }
    const ids=shopIds();
    for(let i=0;i<ids.length;i++){
      const b=shopCard(i);
      if(tapPoint.x>=b.x-6&&tapPoint.x<=b.x+b.w+6&&tapPoint.y>=b.y-8&&tapPoint.y<=b.y+b.h+8){
        shopBand=1; shopSel=i; tapPoint=null; shopActivate(); return;
      }
    }
    const bb=shopBackBox();
    if(tapPoint.x>=bb.x-8&&tapPoint.x<=bb.x+bb.w+8&&tapPoint.y>=bb.y-10&&tapPoint.y<=bb.y+bb.h+10){
      tapPoint=null; closeShop(); return;
    }
    tapPoint=null;
  }
}

// Moving between bands should land somewhere sensible, not on index 0 every time
function shopBandSel(){
  if(shopBand===0) return Math.max(0,SHOP_TABS.indexOf(shopTab));
  if(shopBand===2) return 0;
  return Math.max(0,shopIds().indexOf(shopWornId()));
}

function shopWrap(text,maxChars){
  const out=[]; let line='';
  for(const word of text.split(' ')){
    if(line&&(line+' '+word).length>maxChars){ out.push(line); line=word; }
    else line=line?line+' '+word:word;
  }
  if(line) out.push(line);
  return out;
}

function drawShop(){
  ctx.fillStyle='rgba(6,8,14,0.97)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.save();
  ctx.shadowColor='#ffb300'; ctx.shadowBlur=16;
  ctx.fillStyle='#ffd54a'; ctx.font='bold 28px monospace';
  ctx.fillText('SHOP',W/2,52);
  ctx.restore();

  // Purse
  ctx.fillStyle='#ffd700';
  ctx.beginPath(); ctx.ellipse(W/2-52,74,7,8,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#c8930a'; ctx.beginPath(); ctx.ellipse(W/2-52,74,3,5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ffd700'; ctx.font='bold 19px monospace'; ctx.textAlign='left';
  ctx.fillText(shop.coins+' COINS',W/2-38,81);
  ctx.textAlign='center';

  // Tabs
  ['WEAPONS','CLOAKS','SHIELDS'].forEach((label,i)=>{
    const b=shopTabBox(i), on=shopTab===SHOP_TABS[i];
    const sel=shopBand===0&&shopSel===i;
    ctx.fillStyle=on?'rgba(120,90,20,0.55)':'rgba(0,0,0,0.35)';
    ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.strokeStyle=sel?'#ffffff':(on?'#ffd54a':'#3a3f48'); ctx.lineWidth=sel?3:2;
    ctx.strokeRect(b.x,b.y,b.w,b.h);
    ctx.fillStyle=on?'#ffe89a':'#79808a'; ctx.font='bold 14px monospace';
    ctx.fillText(label,b.x+b.w/2,b.y+21);
  });

  const ids=shopIds(), defs=shopDefs();
  const weapons=shopTab==='weapons', shields=shopTab==='shields';
  const ownedSet=shopOwnedSet(), wornId=shopWornId();
  for(let i=0;i<ids.length;i++){
    const id=ids[i], def=defs[id], b=shopCard(i);
    const owned = ownedSet.has(id);
    const worn  = wornId===id;
    const afford= shop.coins>=def.price;
    const sel   = shopBand===1&&shopSel===i;
    const narrow= shopTab==='cloaks';

    ctx.fillStyle=sel?'rgba(60,52,20,0.85)':'rgba(0,0,0,0.45)';
    ctx.fillRect(b.x,b.y,b.w,b.h);
    // Not def.color for the worn border: the ninja and tuxedo are near-black,
    // and a black outline on a black card is no outline at all
    ctx.strokeStyle=sel?'#ffd54a':(worn?'#7fd06a':(owned?'#5a6a55':'#3a3f48'));
    ctx.lineWidth=sel?3:2;
    ctx.strokeRect(b.x,b.y,b.w,b.h);

    ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(b.x+1,b.y+1,b.w-2,narrow?74:62);
    ctx.save();
    if(!owned&&!afford) ctx.globalAlpha=0.45;
    if(weapons) drawWeaponIcon(id,b.x+b.w/2,b.y+32,2.1);
    else if(shields) drawShieldIcon(id,b.x+b.w/2,b.y+31);
    else drawCloakIcon(id,b.x+b.w/2,b.y+40);
    ctx.restore();

    // Same reason: the icon carries the garment's colour, the name stays legible
    ctx.fillStyle=owned?((weapons||shields)?def.color:'#e8e2d0'):(afford?'#e8e2d0':'#79808a');
    ctx.font='bold '+(narrow?13:17)+'px monospace';
    ctx.fillText(def.name,b.x+b.w/2,b.y+(narrow?96:84));

    ctx.fillStyle='#9aa4b0'; ctx.font=(narrow?'10px':'11px')+' monospace';
    shopWrap(def.blurb,narrow?19:26).forEach((l,li)=>
      ctx.fillText(l,b.x+b.w/2,b.y+(narrow?114:104)+li*13));

    if(weapons||shields){
      ctx.textAlign='left';
      def.stats.forEach((st,si)=>{
        ctx.fillStyle='#7f8a96'; ctx.font='10px monospace';
        ctx.fillText('\u2022',b.x+14,b.y+146+si*16);
        ctx.fillStyle='#c2cad4';
        ctx.fillText(st,b.x+26,b.y+146+si*16);
      });
      ctx.textAlign='center';
    } else if(def.note){
      ctx.fillStyle='#8a8256'; ctx.font='9px monospace';
      shopWrap(def.note,21).forEach((l,li)=>ctx.fillText(l,b.x+b.w/2,b.y+158+li*12));
    }

    const sy=b.y+b.h-36;
    const strip=(fill,stroke,text,col)=>{
      ctx.fillStyle=fill; ctx.fillRect(b.x+8,sy,b.w-16,26);
      ctx.strokeStyle=stroke; ctx.lineWidth=1.5; ctx.strokeRect(b.x+8,sy,b.w-16,26);
      ctx.fillStyle=col; ctx.font='bold '+(narrow?11:13)+'px monospace';
      ctx.fillText(text,b.x+b.w/2,sy+18);
    };
    if(worn) strip('rgba(60,140,70,0.5)','#7fd06a',narrow?'\u2713 WEARING':'\u2713 EQUIPPED','#c8ffb8');
    else if(owned) strip('rgba(40,60,90,0.5)','#6a8fbf',narrow?'WEAR IT':'OWNED \u2014 EQUIP','#bcd8ff');
    else strip(afford?'rgba(120,90,20,0.55)':'rgba(50,25,25,0.55)',
               afford?'#ffd54a':'#7a4a4a',
               def.price+(narrow?'':' COINS'), afford?'#ffe89a':'#c98d8d');

    if(sel&&Math.sin(frameN*.12)>0){
      ctx.fillStyle='#ffd54a'; ctx.font='bold 16px monospace';
      ctx.fillText('\u25bc',b.x+b.w/2,b.y-6);
    }
  }

  const bb=shopBackBox(), bsel=shopBand===2;
  ctx.fillStyle=bsel?'rgba(120,90,20,0.55)':'rgba(0,0,0,0.4)';
  ctx.fillRect(bb.x,bb.y,bb.w,bb.h);
  ctx.strokeStyle=bsel?'#ffd54a':'#4a4636'; ctx.lineWidth=2;
  ctx.strokeRect(bb.x,bb.y,bb.w,bb.h);
  ctx.fillStyle=bsel?'#ffffff':'#9a9276'; ctx.font='bold 14px monospace';
  ctx.fillText(shopReturn==='PLAYING'?'BACK TO THE LEVEL':'BACK TO THE TITLE',W/2,bb.y+21);

  if(shopMsgT>0){
    ctx.globalAlpha=Math.min(1,shopMsgT*2);
    ctx.fillStyle='#ffe89a'; ctx.font='bold 14px monospace';
    ctx.fillText(shopMsg,W/2,bb.y-12);
    ctx.globalAlpha=1;
  } else {
    ctx.fillStyle='#445544'; ctx.font='11px monospace';
    ctx.fillText(isTouchDevice?'Tap a tab, then tap what you want'
      :'\u2191\u2193 tabs / cards / back   \u2190\u2192 choose   Enter: Buy or wear   Esc: Back',W/2,bb.y-12);
  }
  ctx.textAlign='left';
}

// Shield icons show the shape, since that is the whole difference between them.
function drawShieldIcon(id,cx,cy){
  const def=SHIELDS[id], tall=def.tall;
  const w=tall?30:26, h=tall?42:34;
  ctx.save(); ctx.translate(cx,cy);
  ctx.fillStyle=def.color; ctx.fillRect(-w/2,-h/2,w,h);
  ctx.strokeStyle=def.rim; ctx.lineWidth=2.5; ctx.strokeRect(-w/2,-h/2,w,h);
  if(def.spikes){
    ctx.fillStyle='#d8d3c4';
    for(let i=0;i<4;i++){
      const y=-h/2+5+i*8;
      ctx.beginPath(); ctx.moveTo(w/2,y); ctx.lineTo(w/2+7,y+3.5); ctx.lineTo(w/2,y+7);
      ctx.closePath(); ctx.fill();
    }
  } else if(def.charges){
    ctx.strokeStyle='#e0d0ff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,7,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,-h/2+4); ctx.lineTo(0,h/2-4); ctx.stroke();
  } else {
    ctx.strokeStyle='#99aaff'; ctx.lineWidth=1.8;
    ctx.beginPath(); ctx.moveTo(0,-h/2+4); ctx.lineTo(0,h/2-4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-w/2+4,0); ctx.lineTo(w/2-4,0); ctx.stroke();
  }
  ctx.restore();
}

// Cloak icons are a torso on a hanger rather than a tiny Phil — at 40px a whole
// stickman reads as a smudge, and the garment is the thing being sold.
function drawCloakIcon(id,cx,cy){
  const def=CLOAKS[id];
  ctx.save(); ctx.translate(cx,cy);
  if(id==='none'){
    ctx.strokeStyle='#5a6470'; ctx.lineWidth=2; ctx.setLineDash([4,3]);
    ctx.strokeRect(-13,-18,26,34); ctx.setLineDash([]);
    ctx.fillStyle='#5a6470'; ctx.font='bold 11px monospace';
    ctx.textAlign='center'; ctx.fillText('\u2014',0,4);
    ctx.restore(); return;
  }
  if(def.glow){
    ctx.globalAlpha=0.3+Math.sin(frameN*0.09)*0.1;
    ctx.fillStyle=def.color;
    ctx.beginPath(); ctx.ellipse(0,0,20,26,0,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.strokeStyle='#8a94a2'; ctx.lineWidth=1.5;    // hanger
  ctx.beginPath(); ctx.moveTo(0,-22); ctx.lineTo(0,-17);
  ctx.moveTo(-11,-17); ctx.lineTo(11,-17); ctx.stroke();
  ctx.fillStyle=def.color;                          // garment
  ctx.beginPath();
  ctx.moveTo(-12,-17); ctx.lineTo(12,-17); ctx.lineTo(15,-4);
  ctx.lineTo(10,-4); ctx.lineTo(10,17); ctx.lineTo(-10,17); ctx.lineTo(-10,-4);
  ctx.lineTo(-15,-4); ctx.closePath(); ctx.fill();
  if(id==='tux'){
    ctx.fillStyle='#f2f2f2';
    ctx.beginPath(); ctx.moveTo(0,-17); ctx.lineTo(5,0); ctx.lineTo(-5,0); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#c1121f'; ctx.fillRect(-4,-15,8,4);
  } else if(id==='kungfu'){
    ctx.strokeStyle='#c9c2ab'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(-9,-16); ctx.lineTo(0,-2); ctx.lineTo(9,-16); ctx.stroke();
    ctx.fillStyle='#1f2430'; ctx.fillRect(-11,2,22,5);
  } else if(id==='army'){
    ctx.fillStyle='#6b7d3a'; ctx.fillRect(-10,1,20,4);
  } else if(id==='ninja'){
    ctx.strokeStyle=def.color; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-9,-12);
    ctx.quadraticCurveTo(-19,-8+Math.sin(frameN*0.13)*2,-22,2); ctx.stroke();
  }
  ctx.restore();
}

// ══════════════════════════════════════════════════════
//  WORLD MAP
// ══════════════════════════════════════════════════════
// One world on screen at a time rather than all 60 nodes at once — at this canvas
// size a full overworld leaves ~16px per node with nowhere to put a label, and
// per-world paging is what lets more worlds be added later without a redesign.
let mapW=1, mapL=1, mapKeyHeld=false;
let mapPhil={ x:0, y:0, walk:0, dir:1 };

function mapNodePos(i,total){
  const span=W-190;
  return { x:95+(total<2?0:i*span/(total-1)), y:284+Math.sin(i*0.86+0.4)*62 };
}
function mapNodeAt(w,l){ return mapNodePos(l-1,levelsInWorld(w)); }
function isBossNode(w,l){ return l===5||l===10||l===11; }

function mapLevelName(w,l){
  if(l===11) return 'THE FINAL MECH';
  const bt=WORLD_BOSS_MAP[w]&&WORLD_BOSS_MAP[w][l];
  return bt ? getBossMeta(bt).name.toUpperCase() : 'LEVEL '+l;
}

function openMap(){
  initAC();
  mapW=progress.w; mapL=Math.min(progress.l,levelsInWorld(mapW));
  // The map drives the live campaign run, so pick up the saved score and lives
  // rather than starting whichever level is chosen from nothing.
  G.mode='CAMPAIGN';
  if(saveState){ G.score=saveState.score; G.lives=saveState.lives; G.seenCuts=saveState.seenCuts; }
  else { G.score=0; G.lives=3; G.seenCuts={}; }
  const n=mapNodeAt(mapW,mapL); mapPhil.x=n.x; mapPhil.y=n.y; mapPhil.walk=0;
  // The key that opened the map is still down this frame. Without this the map
  // reads it as its own press and launches whatever level is selected instantly.
  mapKeyHeld=true;
  G.screen='MAP';
}

function mapPlay(){
  if(!levelUnlocked(mapW,mapL)){ SFX.block(); return; }
  initAC();
  G.mode='CAMPAIGN'; G.world=mapW; G.level=mapL;
  if(mapL>10) startFinalBossLevel(); else startLevel();
}

function mapStep(d){
  let l=mapL+d;
  if(l<1){ if(mapW>1){ mapW--; l=levelsInWorld(mapW); } else return; }
  else if(l>levelsInWorld(mapW)){ if(mapW<TOTAL_WORLDS){ mapW++; l=1; } else return; }
  mapL=l; SFX.pickup();
}
function mapWorldStep(d){
  const w=Math.max(1,Math.min(TOTAL_WORLDS,mapW+d));
  if(w===mapW) return;
  mapW=w; mapL=Math.min(mapL,levelsInWorld(w)); SFX.pickup();
}

function updateMap(dt){
  const t=mapNodeAt(mapW,mapL);
  const dx=t.x-mapPhil.x, dy=t.y-mapPhil.y;
  const dist=Math.hypot(dx,dy);
  if(dist>1){
    const step=Math.min(dist,420*dt);
    mapPhil.x+=dx/dist*step; mapPhil.y+=dy/dist*step;
    mapPhil.walk+=dt*11;
    if(Math.abs(dx)>1) mapPhil.dir=dx>0?1:-1;
  }
}

function handleMapInput(){
  const up=keys['ArrowUp']||keys['KeyW'], down=keys['ArrowDown']||keys['KeyS'];
  const left=keys['ArrowLeft']||keys['KeyA'], right=keys['ArrowRight']||keys['KeyD'];
  const go=keys['Enter']||keys['Space'], back=keys['Escape'];
  if(up||down||left||right||go||back){
    if(!mapKeyHeld){
      mapKeyHeld=true;
      if(back){ G.screen='TITLE'; titleKeyHeld=true; SFX.pickup(); }   // same guard going back
      else if(go) mapPlay();
      else if(left) mapStep(-1);
      else if(right) mapStep(1);
      else if(up) mapWorldStep(-1);
      else if(down) mapWorldStep(1);
    }
  } else mapKeyHeld=false;

  if(tapPoint){
    // Nearest node within a generous radius, not the first one inside a tight
    // one: a 26px canvas radius is about 18 CSS px on a phone, well under the
    // ~44px a fingertip needs.
    const total=levelsInWorld(mapW);
    let best=-1, bestD=44;
    for(let i=0;i<total;i++){
      const p=mapNodePos(i,total);
      const d=Math.hypot(tapPoint.x-p.x,tapPoint.y-p.y);
      if(d<bestD){ bestD=d; best=i; }
    }
    if(best>=0){
      const l=best+1;
      // First tap selects, a second tap on the same node plays it
      if(mapL===l){ tapPoint=null; mapPlay(); return; }
      mapL=l; SFX.pickup(); tapPoint=null; return;
    }
    // Tap the world arrows
    if(tapPoint.y<70){
      if(tapPoint.x<W*0.25) mapWorldStep(-1);
      else if(tapPoint.x>W*0.75) mapWorldStep(1);
    }
    tapPoint=null;
  }
}

function drawMapNode(w,l,p,sel){
  const wd=WORLDS[w];
  const unlocked=levelUnlocked(w,l), cleared=levelCleared(w,l), boss=isBossNode(w,l);
  const r=l===11?21:(boss?17:12);

  if(sel){
    ctx.strokeStyle='#ffffff'; ctx.lineWidth=2;
    ctx.globalAlpha=0.5+Math.sin(frameN*0.11)*0.3;
    ctx.beginPath(); ctx.arc(p.x,p.y,r+9,0,Math.PI*2); ctx.stroke();
    ctx.globalAlpha=1;
  }

  ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2);
  ctx.fillStyle=!unlocked?'#23252c':(cleared?wd.platTop:wd.platFill);
  ctx.fill();
  ctx.lineWidth=2.5;
  ctx.strokeStyle=!unlocked?'#3d4049':(l===11?'#ffc832':(boss?'#ff6a5a':'#ffffff'));
  ctx.stroke();

  if(!unlocked){
    // Padlock
    ctx.strokeStyle='#6b7078'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(p.x,p.y-2,4,Math.PI,0); ctx.stroke();
    ctx.fillStyle='#6b7078'; ctx.fillRect(p.x-5,p.y-2,10,8);
  } else if(boss){
    // Skull: two sockets and a jaw
    ctx.fillStyle=cleared?'#2b1d1d':'#ffffff';
    ctx.beginPath(); ctx.arc(p.x-4.5,p.y-2,2.6,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(p.x+4.5,p.y-2,2.6,0,Math.PI*2); ctx.fill();
    ctx.fillRect(p.x-4,p.y+3,8,4);
  } else if(cleared){
    starPath(p.x,p.y,7,3,0);
    ctx.fillStyle='#ffe14d'; ctx.fill();
  } else {
    ctx.fillStyle='#ffffff'; ctx.font='bold 11px monospace';
    ctx.textAlign='center'; ctx.fillText(String(l),p.x,p.y+4);
  }

  // Secrets are only revealed once found — the map must not spoil the hunt.
  // Sits below the node: Phil stands on top of the selected one and would hide it.
  if(SECRET_LEVEL[w]===l&&secretsFound.has(w)){
    ctx.fillStyle='#ffd54a'; ctx.font='bold 13px monospace'; ctx.textAlign='center';
    ctx.fillText('⚷',p.x,p.y+r+14);
  }
  ctx.textAlign='left';
}

function drawMapPanel(){
  const unlocked=levelUnlocked(mapW,mapL), cleared=levelCleared(mapW,mapL);
  const best=bestFor(mapW,mapL);
  const px=60, py=H-104, pw=W-120, ph=74;
  ctx.fillStyle='rgba(6,10,16,0.82)'; ctx.fillRect(px,py,pw,ph);
  ctx.strokeStyle=unlocked?'#7f9c62':'#454a54'; ctx.lineWidth=2; ctx.strokeRect(px,py,pw,ph);

  ctx.textAlign='left';
  ctx.fillStyle=unlocked?'#ffffff':'#7a8089'; ctx.font='bold 17px monospace';
  ctx.fillText(mapLevelName(mapW,mapL),px+16,py+26);

  ctx.font='12px monospace';
  if(!unlocked){
    ctx.fillStyle='#8a9099';
    ctx.fillText('LOCKED — reach it by playing through the campaign',px+16,py+48);
  } else {
    ctx.fillStyle='#9fd07a';
    ctx.fillText(cleared?'CLEARED':'NOT CLEARED YET',px+16,py+48);
    ctx.fillStyle='#c8cf9a';
    ctx.fillText(best?('BEST: '+best+' pts'):'BEST: —',px+150,py+48);
    if(SECRET_LEVEL[mapW]===mapL&&secretsFound.has(mapW)){
      ctx.fillStyle='#ffd54a';
      ctx.fillText('⚷ SECRET FOUND HERE',px+300,py+48);
    }
  }
  ctx.textAlign='right';
  ctx.fillStyle=unlocked?'#ffcc22':'#5c626b'; ctx.font='bold 13px monospace';
  ctx.fillText(isTouchDevice?(unlocked?'TAP AGAIN TO PLAY':'LOCKED'):(unlocked?'ENTER: PLAY':'LOCKED'),px+pw-16,py+26);
  ctx.fillStyle='#7f8892'; ctx.font='11px monospace';
  ctx.fillText(isTouchDevice?'Tap a level  •  Tap the top corners to change world'
                            :'←/→ level   ↑/↓ world   ESC back',px+pw-16,py+48);
  ctx.textAlign='left';
}

function drawMap(){
  const wd=WORLDS[mapW];
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,wd.skyT); g.addColorStop(1,wd.skyB);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fillRect(0,0,W,H);

  // Header
  ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(0,0,W,64);
  ctx.fillStyle='#ffffff'; ctx.font='bold 24px monospace';
  ctx.fillText(`WORLD ${mapW} — ${wd.name}`,W/2,32);
  ctx.fillStyle='#b9c2ad'; ctx.font='11px monospace';
  ctx.fillText(`${clearedCount()} of ${totalLevels()} levels cleared`,W/2,52);
  if(mapW>1){ ctx.fillStyle='#ffcc22'; ctx.font='bold 18px monospace'; ctx.fillText('▲ '+WORLDS[mapW-1].name,W*0.16,34); }
  if(mapW<TOTAL_WORLDS){ ctx.fillStyle='#ffcc22'; ctx.font='bold 18px monospace'; ctx.fillText('▼ '+WORLDS[mapW+1].name,W*0.84,34); }
  ctx.textAlign='left';

  // Path
  const total=levelsInWorld(mapW);
  ctx.strokeStyle='rgba(255,255,255,0.32)'; ctx.lineWidth=4;
  ctx.setLineDash([2,11]); ctx.lineCap='round';
  ctx.beginPath();
  for(let i=0;i<total;i++){ const p=mapNodePos(i,total); i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y); }
  ctx.stroke();
  ctx.setLineDash([]); ctx.lineCap='butt';

  for(let i=0;i<total;i++) drawMapNode(mapW,i+1,mapNodePos(i,total),i+1===mapL);

  // Phil walks the path as you move along it
  drawStickman(mapPhil.x-11,mapPhil.y-56,22,44,{
    facingR:mapPhil.dir>0, walkCycle:mapPhil.walk, attacking:false, atkTimer:0, atkDur:1,
    shielding:false, color:skinDef().color, swordColor:skinDef().sword,
    invTimer:0, dead:false, isPlayer:true, scale:0.85, skin:currentSkin,
  });

  drawMapPanel();
}

// ── TITLE MENU ──
// Built fresh each frame: CONTINUE only exists when there's a save, and NEW GAME
// asks for a second confirmation before it wipes one.
let titleSelect=0, titleKeyHeld=false, titleConfirm=false;

function saveLabel(s){
  return s.level>10 ? 'FINAL BOSS' : `${WORLDS[s.world].name} L${s.level}`;
}
function titleItems(){
  const items=[];
  if(saveState) items.push({ id:'continue', label:()=>'CONTINUE: '+saveLabel(saveState) });
  items.push({ id:'map', label:()=>'WORLD MAP' });
  items.push({ id:'campaign', label:()=> !saveState ? 'START GAME'
                                       : titleConfirm ? 'ERASE SAVE AND RESTART?' : 'NEW GAME' });
  items.push({ id:'rush', label:()=>'BOSS RUSH' });
  items.push({ id:'practice', label:()=>'PRACTICE' });
  items.push({ id:'museum', label:()=>'MUSEUM' });
  items.push({ id:'shop', label:()=>'SHOP  ('+shop.coins+' coins)' });
  items.push({ id:'skin', label:()=>'SKIN: '+skinDef().name });
  items.push({ id:'music', label:()=>'MUSIC: '+(musicOn?'ON':'OFF') });
  return items;
}
function titleBox(i,count){
  const n=count||titleItems().length;
  // Tightens up as rows are added, so the footer never runs off the canvas. At 7+
  // the worlds subtitle is dropped too (see drawTitle) to buy back the space.
  const gap=n>=9?23:(n>=7?24:(n>=6?27:(n>=5?28:32)));
  const h  =n>=9?21:(n>=7?22:(n>=6?25:(n>=5?26:28)));
  const top=n>=9?308:(n>=8?316:(n>=7?330:(n>=6?342:(n>=5?344:(n>=4?356:372)))));
  return { x:W/2-160, y:top+i*gap, w:320, h };
}

function cycleSkin(dir){
  const un=SKIN_ORDER.filter(s=>unlockedSkins.has(s));
  let i=un.indexOf(currentSkin); if(i<0) i=0;
  currentSkin=un[(i+dir+un.length)%un.length];
  saveSkins(); SFX.pickup();
}

function startNewCampaign(){
  clearSave();
  G.mode='CAMPAIGN'; G.world=1;G.level=1;G.score=0;G.lives=3; G.seenCuts={};
  // First time anyone starts a game, they get taught the controls before the
  // story starts. It's skippable, and skipping counts — nobody is asked twice.
  if(!tutorialDone){ startTutorial('CAMPAIGN'); return; }
  playCutscene('intro',startLevel);
}

function titleActivate(){
  initAC();
  const items=titleItems();
  const id=items[titleSelect].id;
  if(id==='continue'){
    const s=saveState;
    G.mode='CAMPAIGN';
    G.world=s.world; G.level=s.level; G.score=s.score; G.lives=s.lives; G.seenCuts=s.seenCuts;
    if(s.level>10) startFinalBossLevel(); else startLevel();
  } else if(id==='campaign'){
    // Wiping an existing save takes two presses
    if(saveState&&!titleConfirm){ titleConfirm=true; SFX.pickup(); return; }
    titleConfirm=false;
    startNewCampaign();
  } else if(id==='map'){
    openMap();
  } else if(id==='rush'){
    startRushRun();
  } else if(id==='practice'){
    openPractice();
  } else if(id==='museum'){
    openMuseum();
  } else if(id==='shop'){
    openShop('TITLE');
  } else if(id==='music'){
    toggleMusic();
  } else {
    cycleSkin(1);
  }
}

function handleTitleInput(){
  const items=titleItems();
  if(titleSelect>=items.length) titleSelect=items.length-1;
  const up=keys['ArrowUp']||keys['KeyW'], down=keys['ArrowDown']||keys['KeyS'];
  const left=keys['ArrowLeft']||keys['KeyA'], right=keys['ArrowRight']||keys['KeyD'];
  const go=keys['Enter']||keys['Space'];
  if(up||down||left||right||go){
    if(!titleKeyHeld){
      titleKeyHeld=true;
      if(down)       { titleSelect=(titleSelect+1)%items.length; titleConfirm=false; }
      else if(up)    { titleSelect=(titleSelect+items.length-1)%items.length; titleConfirm=false; }
      else if(left||right){
        const id=items[titleSelect].id;
        if(id==='skin') cycleSkin(right?1:-1);
        else if(id==='music') toggleMusic();
      }
      else titleActivate();
    }
  } else titleKeyHeld=false;
  // Tap / click a menu row directly (this is how touch devices drive the menu)
  if(tapPoint){
    // Nearest row rather than a strict box test. At phone scale a row is only
    // ~18 CSS px tall, and the rows sit 2px apart — padding the boxes to finger
    // size would make them overlap, so a tap in the seam would pick the wrong
    // one. Snapping to the nearest centre covers the gaps without ambiguity.
    const first=titleBox(0,items.length), last=titleBox(items.length-1,items.length);
    const inCol = tapPoint.x>first.x-24 && tapPoint.x<first.x+first.w+24;
    const inRows = tapPoint.y>first.y-10 && tapPoint.y<last.y+last.h+10;
    if(inCol&&inRows){
      let best=0, bestD=Infinity;
      for(let i=0;i<items.length;i++){
        const b=titleBox(i,items.length);
        const d=Math.abs(tapPoint.y-(b.y+b.h/2));
        if(d<bestD){ bestD=d; best=i; }
      }
      if(titleSelect!==best){ titleSelect=best; titleConfirm=false; }
      tapPoint=null; titleActivate(); return;
    }
    tapPoint=null; titleConfirm=false;
  }
}

function drawTitle(){
  // Gradient bg
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0d1a0d'); g.addColorStop(1,'#1a3a10');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // Trees
  [80,200,350,500,650,800,900].forEach((tx,i)=>drawPineTree(tx,H-40,(0.6+i*.04),'#1a4a0a'));
  [40,160,290,430,570,720,850].forEach((tx,i)=>drawPineTree(tx,H-30,(0.4+i*.06),'#2a6a14'));

  ctx.textAlign='center';
  ctx.fillStyle='#88cc44'; ctx.font='bold 72px monospace'; ctx.shadowColor='#44aa00'; ctx.shadowBlur=20;
  ctx.fillText("PHIL'S",W/2,160);
  ctx.fillStyle='#ffcc22'; ctx.shadowColor='#ff8800';
  ctx.fillText('ESCAPE',W/2,250); ctx.shadowBlur=0;

  ctx.fillStyle='#aaccaa'; ctx.font='16px monospace';
  ctx.fillText('A Stickman Warrior fights for freedom',W/2,300);
  // Menu
  const items=titleItems();
  ctx.fillStyle='#667766'; ctx.font='12px monospace';
  // Decoration goes before menu rows do. The worlds line is the next to go after
  // the tagline, and the world map lists them properly anyway.
  if(items.length<7)
    ctx.fillText('Forest  •  Desert  •  Snow Peaks  •  Factory 999  •  Mines  •  Berlin',W/2,326);
  if(items.length<5) ctx.fillText('13 boss fights, then the final Stickman Mech showdown',W/2,344);
  for(let i=0;i<items.length;i++){
    const b=titleBox(i,items.length), sel=(i===titleSelect);
    const warn=sel&&titleConfirm&&items[i].id==='campaign';
    ctx.fillStyle=warn?'rgba(140,40,20,0.6)':sel?'rgba(60,110,30,0.55)':'rgba(0,0,0,0.3)';
    ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.strokeStyle=warn?'#ff8844':sel?'#aaff66':'#3a5a30'; ctx.lineWidth=2;
    ctx.strokeRect(b.x,b.y,b.w,b.h);
    // Type scales with the row height so a seventh row doesn't spill its box
    const fs=b.h>=25?16:14, base=b.y+Math.round(b.h/2)+Math.round(fs*0.36);
    ctx.fillStyle=warn?'#ffddcc':sel?'#ffffff':'#8faa80'; ctx.font='bold '+fs+'px monospace';
    ctx.fillText(items[i].label(),W/2,base);
    if(sel&&Math.sin(frameN*.12)>0){
      ctx.fillStyle=warn?'#ff8844':'#ffcc22'; ctx.font='bold '+fs+'px monospace';
      ctx.fillText('>',b.x-16,base); ctx.fillText('<',b.x+b.w+16,base);
    }
  }
  const bottom=titleBox(items.length-1,items.length).y+28;
  const hint=isTouchDevice?'Tap a menu option'
                          :'Arrows/WASD: Select   Enter: Choose   M: Music';
  // At eight rows there is only room for one footer line, so the stats and the
  // controls share it and the locked-skin detail drops (Boss Rush reports it)
  const oneLine=items.length>=8;
  const locked=SKIN_ORDER.filter(s=>!unlockedSkins.has(s));
  const stats='HIGH SCORE: '+G.highScore+(rush.best?'   RUSH: '+rush.best:'')+
    '   SECRETS: '+secretsFound.size+'/'+SECRET_TOTAL;

  if(titleConfirm){
    ctx.fillStyle='#ff9966'; ctx.font='12px monospace';
    ctx.fillText('Press again to wipe your saved progress, or pick something else',W/2,bottom+16);
    if(!oneLine){
      ctx.fillStyle='#445544'; ctx.font='11px monospace';
      ctx.fillText(hint,W/2,bottom+32);
    }
  } else if(oneLine){
    ctx.fillStyle='#556644'; ctx.font='11px monospace';
    ctx.fillText(stats+'      '+hint,W/2,bottom+16);
  } else {
    ctx.fillStyle='#556644'; ctx.font='11px monospace';
    ctx.fillText(stats+(locked.length?'   LOCKED SKINS: '+locked.map(s=>SKINS[s].name).join(', ')
                                     :'   ★ ALL SKINS UNLOCKED ★'),W/2,bottom+16);
    ctx.fillStyle='#445544'; ctx.font='11px monospace';
    ctx.fillText(hint,W/2,bottom+32);
  }
  ctx.textAlign='left';
}

function drawBossIntro(){
  ctx.fillStyle=`rgba(0,0,0,${Math.min(.85,(3-bossIntroTimer)*.4)})`; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';

//  PAUSE MENU
// ══════════════════════════════════════════════════════
// Built fresh so the music row shows its current state
// Keyed by id rather than position: the actions used to be a chain of index
// comparisons, so inserting a row silently rewired every one below it.
const pauseItems = ()=> train ? [
  { id:'resume',    label:'RESUME' },
  { id:'trainretry',label:'START THE DRILL OVER' },
  { id:'music',     label:'MUSIC: '+(musicOn?'ON':'OFF') },
  { id:'trainquit', label:'GIVE UP AND GO BACK' },
] : tut ? [
  // The campaign items would all misfire here — RESTART LEVEL builds a generated
  // level, and the map and shop have nothing to do with a drill
  { id:'resume',   label:'RESUME' },
  { id:'tutstart', label:'START THE TUTORIAL OVER' },
  { id:'music',    label:'MUSIC: '+(musicOn?'ON':'OFF') },
  { id:'tutskip',  label:'SKIP THE TUTORIAL' },
] : [
  { id:'resume',  label:'RESUME' },
  { id:'restart', label:'RESTART LEVEL' },
  { id:'shop',    label:'SHOP  ('+shop.coins+')' },
  { id:'music',   label:'MUSIC: '+(musicOn?'ON':'OFF') },
  { id:'map',     label:'WORLD MAP' },
  { id:'quit',    label:'QUIT TO TITLE' },
];
// Six rows at the old 52px pitch ran off the bottom of the canvas. Shared by the
// draw and the tap test so a row can never be drawn somewhere it can't be hit.
// The rows are centred (x 330-630), which is why the touch pad's buttons — all
// hard against the left and right edges — never cover one.
const PAUSE_GAP=44, PAUSE_TOP=H/2-88;
function pauseBox(i){ return { x:W/2-150, y:PAUSE_TOP+i*PAUSE_GAP-22, w:300, h:34 }; }

function drawPauseMenu(){
  ctx.fillStyle='rgba(0,0,0,0.65)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#ccaaff'; ctx.font='bold 36px monospace'; ctx.shadowColor='#8844cc'; ctx.shadowBlur=14;
  ctx.fillText('PAUSED',W/2,H/2-150); ctx.shadowBlur=0;
  const items=pauseItems();
  items.forEach((item,i)=>{
    const b=pauseBox(i), sel=i===pauseSelect;
    ctx.fillStyle=sel?'#ffffff':'#887799';
    ctx.font=(sel?'bold ':'')+'19px monospace';
    if(sel){ ctx.fillStyle='rgba(100,60,160,0.5)'; ctx.fillRect(b.x,b.y,b.w,b.h); ctx.fillStyle='#ffffff'; }
    ctx.fillText((sel?'▶ ':'')+item.label,W/2,PAUSE_TOP+i*PAUSE_GAP);
  });
  ctx.fillStyle='#6a5f7a'; ctx.font='11px monospace';
  ctx.fillText(isTouchDevice?'Tap a row  •  ❚❚ to close'
                            :'Arrows/WASD: Select   Enter: Choose   Esc: Close',
    W/2,pauseBox(items.length-1).y+56);
  ctx.textAlign='left';
}

// One place decides what a pause row does, so the keyboard and a tap can never
// drift apart.
function pauseActivate(){
  const id=pauseItems()[pauseSelect].id;
  if(id==='resume'){ paused=false; }
  else if(id==='trainretry'){ paused=false; startTraining(train.id); }
  else if(id==='trainquit'){ paused=false; exitTraining(); }
  else if(id==='tutstart'){ paused=false; startTutorial(tutReturn); }
  else if(id==='tutskip'){ skipTutorial(); }
  else if(id==='restart'){ paused=false; G.lives=3; startLevel(); }
  else if(id==='shop'){ paused=false; openShop('PLAYING'); }
  else if(id==='music'){ toggleMusic(); }             // stay paused
  else if(id==='map'){ paused=false; openMap(); }
  else if(id==='quit'){ paused=false; G.screen='TITLE'; }
}

function handlePauseTap(){
  if(!tapPoint) return;
  const items=pauseItems();
  const first=pauseBox(0), last=pauseBox(items.length-1);
  // Nearest row rather than a strict box test, same as the title menu — at phone
  // scale a 34px row is ~24 CSS px and the rows sit 10px apart
  if(tapPoint.x>first.x-30&&tapPoint.x<first.x+first.w+30&&
     tapPoint.y>first.y-14&&tapPoint.y<last.y+last.h+14){
    let best=0, bestD=Infinity;
    for(let i=0;i<items.length;i++){
      const b=pauseBox(i), d=Math.abs(tapPoint.y-(b.y+b.h/2));
      if(d<bestD){ bestD=d; best=i; }
    }
    pauseSelect=best; tapPoint=null;
    SFX.pickup();
    pauseActivate();
    return;
  }
  tapPoint=null;
}

// ══════════════════════════════════════════════════════
//  DIALOGUE — characters speaking over the live level
// ══════════════════════════════════════════════════════
// Deliberately not a cutscene. The comic panels already own the big story beats
// (the intro, each world boss, the ending) and they take the whole screen to do
// it. Dialogue is the opposite: the level stays where it is behind the box, so a
// character can say one thing without the game leaving the place you are in.
//
// It fills the two moments the panels never covered — arriving somewhere new,
// and winning — plus the level-5 mini bosses, which had no story at all.
const DLG_WORLD = {
  2:[['phil','Sand. Sand and more sand.'],
     ['phil','Keep walking, Phil. They are still behind you.']],
  3:[['phil','I cannot feel my hands.'],
     ['phil','Cold I can live with. Caught, I cannot.']],
  4:[['phil','Factory 999. This is where they MAKE the soldiers.'],
     ['phil','I came off a line just like that one.']],
  5:[['phil','No sky down here. No sky at all.'],
     ['phil','Whatever they are digging for, it is not coal.']],
  6:[['phil','Berlin. The last checkpoint before the border.'],
     ['phil','One more city. One more city and I am free.']],
};

// Only the level-5 mini bosses: the world bosses get a full comic scene before
// their arena, and stacking a taunt on top of that is one beat too many.
const DLG_TAUNT = {
  giant:       [['giant','DESERTER! Get back in line!'],
                ['phil','I am done standing in lines.']],
  frostwarden: [['frostwarden','The glacier keeps everything it catches.'],
                ['phil','Then it has to catch me first.']],
  foreman:     [['foreman','Unit 47. Return to the assembly line.'],
                ['phil','That has not been my name for a long time.']],
  tunnelfiend: [['phil','...something is down here with me.'],
                ['tunnelfiend','YOU are.']],
  captain:     [['captain','HALT! By order of the Stickman Army!'],
                ['phil','You will have to make me.']],
};

const DLG_WIN = {
  giant:       'That is one commander who will not be missed.',
  anaconda:    'The forest can keep its guardian. I am going.',
  lizard:      'Even the machines out here are trying to eat me.',
  frostwarden: 'Told you. The glacier keeps nothing today.',
  yeti:        'Big. Loud. Slow. Two out of three is not enough.',
  foreman:     'The line is shut down, Foreman. Permanently.',
  revenant:    'Whatever they built you from — rest now.',
  tunnelfiend: 'Nothing down here is going to stop me either.',
  mole:        'Dig all you like. I am going up.',
  captain:     'I made you. Sorry about the shield.',
  agent:       'Berlin is behind me. So are you.',
  _:           'One less thing between me and the border.',
};

const DLG_CPS = 44;                 // characters revealed per second
const DLG_BOX = { x:44, y:H-152, w:W-88, h:128 };
let dlg = null;                     // { lines, i, chars, after } while running
let dlgHeld = false;                // edge-trigger guard for the advance key

function dlgLine(){ return dlg ? dlg.lines[dlg.i] : null; }
// Always PHIL, whatever skin is equipped — a skin is a costume, and naming the
// speaker MINION mid-escape reads as a different character rather than a hat.
function dlgSpeaker(id){
  return id==='phil' ? 'PHIL' : (getBossMeta(id).name||'???').toUpperCase();
}

// `after` runs whether the dialogue was read or skipped, so nothing downstream
// has to care which happened.
function startDialogue(lines, after){
  if(!lines||!lines.length){ after&&after(); return; }
  dlg={ lines, i:0, chars:0, after:after||null };
  dlgHeld=true; tapPoint=null;
}

function endDialogue(){
  const after=dlg.after;
  dlg=null; tapPoint=null; dlgHeld=true;
  keys['Enter']=false; keys['Space']=false; keys['KeyZ']=false; touches.start=false;
  if(after) after();
}

function dlgAdvance(){
  const full=dlgLine()[1].length;
  if(dlg.chars<full){ dlg.chars=full; return; }     // first press finishes the line
  dlg.i++;
  if(dlg.i>=dlg.lines.length){ endDialogue(); return; }
  dlg.chars=0; SFX.pickup();
}

function updateDialogue(dt){
  const full=dlgLine()[1].length;
  if(dlg.chars<full) dlg.chars=Math.min(full,dlg.chars+dt*DLG_CPS);

  const skip=keys['Escape'];
  const adv=keys['Space']||keys['Enter']||keys['KeyZ']||keys['ArrowRight'];
  const tapAdv=!!tapPoint;
  tapPoint=null;

  if(skip){ keys['Escape']=false; endDialogue(); return; }
  if(tapAdv) dlgAdvance();                          // taps are already one-shot
  else if(adv&&!dlgHeld){ dlgHeld=true; dlgAdvance(); }
  if(!dlg) return;
  if(!adv) dlgHeld=false;
}

// Head and shoulders in a 64px frame. Small enough that each character needs one
// silhouette cue rather than a likeness — a helmet, a visor, a pair of horns.
function drawPortrait(id, cx, cy, s){
  const col = id==='phil' ? skinDef().color
            : ({giant:'#3a5a10', frostwarden:'#8fd8ee', foreman:'#9aa7b2',
                tunnelfiend:'#6b4a7a', captain:'#4a5a6a'})[id] || '#7a6a5a';
  ctx.save();
  ctx.translate(cx,cy); ctx.scale(s,s);
  ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=2.4; ctx.lineCap='round';

  // Shoulders, clipped by the frame so it reads as a bust
  ctx.beginPath(); ctx.arc(0,26,17,Math.PI,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(0,-4,11,0,Math.PI*2); ctx.stroke();

  // Headgear first, face second. Drawn the other way round the Giant's helmet
  // and the Captain's visor simply covered the eyes and left a blank head.
  let eyes='x';                                       // 'x' angry, 'dot' Phil, null none
  if(id==='giant'){                                   // army helmet, sat high
    ctx.fillStyle='#25400b';
    ctx.beginPath(); ctx.arc(0,-8,12.5,Math.PI,Math.PI*2); ctx.fill();
    ctx.fillRect(-15,-9,30,3);
  } else if(id==='frostwarden'){                      // ice crown
    ctx.fillStyle='#dff4ff';
    [[-9,-10],[0,-14],[9,-10]].forEach(p=>{
      ctx.beginPath(); ctx.moveTo(p[0]-3.5,p[1]); ctx.lineTo(p[0],p[1]-9); ctx.lineTo(p[0]+3.5,p[1]);
      ctx.closePath(); ctx.fill();
    });
  } else if(id==='foreman'){                          // welder's visor IS the face
    ctx.fillStyle='#2f3944'; ctx.fillRect(-12,-9,24,7);
    ctx.fillStyle='#ffb648'; ctx.fillRect(-9,-7.5,18,2.4);
    eyes=null;
  } else if(id==='tunnelfiend'){                      // two coals in the dark
    ctx.fillStyle='#ff8a4a';
    ctx.beginPath(); ctx.arc(-4.5,-5.5,2.6,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(4.5,-5.5,2.6,0,Math.PI*2); ctx.fill();
    eyes=null;
  } else if(id==='captain'){                          // riot helmet, eyes behind glass
    ctx.fillStyle='#39434f';
    ctx.beginPath(); ctx.arc(0,-9,13,Math.PI,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(180,220,255,0.45)'; ctx.fillRect(-12,-9,24,9);
  } else if(id==='phil'){
    eyes='dot';
  }

  if(eyes==='dot'){
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(4,-4,3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(5,-4,1.5,0,Math.PI*2); ctx.fill();
  } else if(eyes==='x'){
    ctx.strokeStyle=id==='captain'?'#0f1720':col;
    ctx.lineWidth=2;
    [-4.5,3.5].forEach(ox=>{
      ctx.beginPath(); ctx.moveTo(ox-2.5,-7); ctx.lineTo(ox+2.5,-2);
      ctx.moveTo(ox+2.5,-7); ctx.lineTo(ox-2.5,-2); ctx.stroke();
    });
  }
  ctx.restore();
}

function drawDialogue(){
  if(!dlg) return;
  const [who,text]=dlgLine();
  const b=DLG_BOX;

  ctx.save();
  ctx.fillStyle='rgba(6,10,18,0.92)'; ctx.fillRect(b.x,b.y,b.w,b.h);
  ctx.strokeStyle='#8fb8e0'; ctx.lineWidth=2; ctx.strokeRect(b.x+1,b.y+1,b.w-2,b.h-2);

  // Portrait frame on the left, clipped so the bust sits inside it
  const pf={ x:b.x+14, y:b.y+16, w:84, h:84 };
  ctx.fillStyle='rgba(140,190,235,0.10)'; ctx.fillRect(pf.x,pf.y,pf.w,pf.h);
  ctx.save();
  ctx.beginPath(); ctx.rect(pf.x,pf.y,pf.w,pf.h); ctx.clip();
  drawPortrait(who, pf.x+pf.w/2, pf.y+pf.h/2-4, 1.9);
  ctx.restore();
  ctx.strokeStyle='rgba(143,184,224,0.55)'; ctx.lineWidth=1.5;
  ctx.strokeRect(pf.x+.5,pf.y+.5,pf.w-1,pf.h-1);

  const tx=pf.x+pf.w+18, tw=b.x+b.w-tx-18;
  ctx.textAlign='left';
  ctx.fillStyle='#8fb8e0'; ctx.font='bold 13px monospace';
  ctx.fillText(dlgSpeaker(who),tx,b.y+30);

  // Typed out a character at a time, wrapped to the space beside the portrait
  ctx.fillStyle='#eef4fb'; ctx.font='15px monospace';
  const shown=text.slice(0,Math.floor(dlg.chars));
  wrapLine(shown,tw,'15px monospace').forEach((l,i)=>ctx.fillText(l,tx,b.y+56+i*21));

  ctx.fillStyle='#5b6f85'; ctx.font='10px monospace';
  ctx.fillText(`${dlg.i+1}/${dlg.lines.length}`,tx,b.y+b.h-12);
  ctx.textAlign='right';
  const done=dlg.chars>=text.length;
  if(done&&Math.sin(frameN*.12)>0){
    ctx.fillStyle='#eef4fb'; ctx.font='bold 13px monospace';
    ctx.fillText(isTouchDevice?'TAP ▸':'▸',b.x+b.w-18,b.y+b.h-12);
  }
  ctx.fillStyle='#4a5a6b'; ctx.font='10px monospace';
  ctx.fillText(isTouchDevice?'tap to go on':'space / enter  ·  esc skips',b.x+b.w-18,b.y+18);
  ctx.textAlign='left';
  ctx.restore();
}

// ── WHERE DIALOGUE FIRES ──
// Never in Boss Rush (back-to-back fights by design) or the tutorial (it has its
// own voice already). `G.seenCuts` is the existing per-run record and rides along
// in the save, so a line plays once a run and returns on a new game.
function dlgAllowed(){ return G.mode==='CAMPAIGN' && !tut; }

function playWorldArrival(){
  if(!dlgAllowed()||G.level!==1) return false;
  const lines=DLG_WORLD[G.world];
  const key='dlgW'+G.world;
  if(!lines||G.seenCuts[key]) return false;
  G.seenCuts[key]=true;
  startDialogue(lines);
  return true;
}

function playBossTaunt(type){
  if(!dlgAllowed()) return false;
  const lines=DLG_TAUNT[type];
  const key='dlgT'+type;
  if(!lines||G.seenCuts[key]) return false;
  G.seenCuts[key]=true;
  startDialogue(lines);
  return true;
}

function playBossVictory(type, after){
  // This fires on a timer after the death animation. Quitting to the title in
  // that window used to still throw up the level-clear screen three seconds
  // later — if we have left the level, neither the line nor the clear happens.
  if(G.screen!=='PLAYING') return;
  if(!dlgAllowed()){ after(); return; }
  startDialogue([['phil', DLG_WIN[type]||DLG_WIN._]], after);
}

//  CUTSCENES — canvas-drawn comic panels
// ══════════════════════════════════════════════════════
const CUT_R = { x:96, y:64, w:768, h:376 };
const CUT_CPS = 48;                                   // characters revealed per second
const CUT_SKIP = { x:W-116, y:14, w:100, h:28 };
const PHIL_COL='#4ac8ff', PHIL_SWORD='#c8eeff', ARMY_COL='#3a5a10';

let cutscene = null;        // { panels, i, chars, t, after }
let cutHeld = false;        // edge-trigger guard for advance input
let tapPoint = null;        // canvas-space click/tap, consumed by the active screen

function cutPoint(clientX, clientY){
  const r=canvas.getBoundingClientRect();
  return { x:(clientX-r.left)*(W/r.width), y:(clientY-r.top)*(H/r.height) };
}
function cutInBox(p,b){ return p && p.x>=b.x && p.x<=b.x+b.w && p.y>=b.y && p.y<=b.y+b.h; }

// ─── SHAPE HELPERS ───
function cutRR(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function cutSpeedLines(cx,cy,n,r0,r1,col,lw){
  ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=lw||2;
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2+0.13, j=0.7+((i*37)%11)/22;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*r0, cy+Math.sin(a)*r0);
    ctx.lineTo(cx+Math.cos(a)*r1*j, cy+Math.sin(a)*r1*j);
    ctx.stroke();
  }
  ctx.restore();
}
// Elliptical burst — a radial star around a wide text box gets enormous.
function cutStar(cx,cy,rxO,ryO,rxI,ryI,points,rot){
  ctx.beginPath();
  for(let i=0;i<points*2;i++){
    const odd=i%2, rx=odd?rxI:rxO, ry=odd?ryI:ryO;
    const a=(i/(points*2))*Math.PI*2+(rot||0);
    const px=cx+Math.cos(a)*rx, py=cy+Math.sin(a)*ry;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  }
  ctx.closePath();
}

// ─── COMIC FIGURES ───
// Arm/leg entries are [x,y] offsets from the shoulder/hip; x is mirrored by dir.
const CUT_POSES = {
  stand:  { arms:[[-4,14],[4,14]],     legs:[[-8,20],[8,20]] },
  walk:   { arms:[[8,10],[-7,13]],     legs:[[9,20],[-8,20]] },
  run:    { arms:[[13,2],[-12,10]],    legs:[[14,20],[-11,19]], lean:0.12 },
  point:  { arms:[[19,-4],[-5,15]],    legs:[[-6,20],[7,20]] },
  salute: { arms:[[5,-10],[-6,15]],    legs:[[-4,20],[4,20]] },
  raise:  { arms:[[9,-18],[-8,13]],    legs:[[-7,20],[8,20]] },
  cheer:  { arms:[[14,-14],[-14,-14]], legs:[[-8,20],[8,20]] },
  reach:  { arms:[[18,3],[-6,14]],     legs:[[-6,20],[7,20]] },
  guard:  { arms:[[12,6],[-9,4]],      legs:[[-9,20],[9,20]] },
  slump:  { arms:[[-7,16],[7,16]],     legs:[[-8,20],[7,20]], lean:0.14, drop:2 },
  kneel:  { arms:[[11,7],[-7,12]],     legs:[[13,19],[-4,13]], drop:8 },
};

function cutFigure(x, by, sc, o){
  o=o||{};
  const pose=CUT_POSES[o.pose]||CUT_POSES.stand;
  const dir=o.dir||1, col=o.color||'#14140f';
  const HEAD=-47*sc, SH=-37*sc, HIP=-19*sc, R=7*sc;
  ctx.save();
  ctx.translate(x, by-(pose.drop||0)*sc);
  if(pose.lean) ctx.rotate(pose.lean*dir);
  if(o.alpha!=null) ctx.globalAlpha=o.alpha;
  ctx.strokeStyle=col; ctx.fillStyle=col;
  ctx.lineWidth=Math.max(1.6,2.6*sc); ctx.lineCap='round'; ctx.lineJoin='round';

  ctx.beginPath(); ctx.arc(0,HEAD,R,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,HEAD+R); ctx.lineTo(0,HIP); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0,HIP); ctx.lineTo(pose.legs[0][0]*sc*dir, HIP+pose.legs[0][1]*sc);
  ctx.moveTo(0,HIP); ctx.lineTo(pose.legs[1][0]*sc*dir, HIP+pose.legs[1][1]*sc);
  ctx.stroke();

  const ba=pose.arms[1], bx=ba[0]*sc*dir, byy=SH+ba[1]*sc;
  ctx.beginPath(); ctx.moveTo(0,SH); ctx.lineTo(bx,byy); ctx.stroke();

  const fa=pose.arms[0], fx=fa[0]*sc*dir, fy=SH+fa[1]*sc;
  ctx.beginPath(); ctx.moveTo(0,SH); ctx.lineTo(fx,fy); ctx.stroke();

  if(o.sword){
    const dx=fx, dy=fy-SH, len=Math.hypot(dx,dy)||1, ux=dx/len, uy=dy/len;
    ctx.strokeStyle=o.swordColor||'#d8d8e0'; ctx.lineWidth=Math.max(1.5,2.3*sc);
    ctx.beginPath(); ctx.moveTo(fx,fy); ctx.lineTo(fx+ux*20*sc,fy+uy*20*sc); ctx.stroke();
    ctx.lineWidth=Math.max(1.2,1.8*sc);   // crossguard
    ctx.beginPath();
    ctx.moveTo(fx+ux*4*sc-uy*4*sc, fy+uy*4*sc+ux*4*sc);
    ctx.lineTo(fx+ux*4*sc+uy*4*sc, fy+uy*4*sc-ux*4*sc); ctx.stroke();
    ctx.strokeStyle=col; ctx.lineWidth=Math.max(1.6,2.6*sc);
  }
  if(o.shield){
    // Pushed away from the spine so it reads as a shield, not a torso blob.
    const sx=bx-dir*5*sc;
    ctx.fillStyle=o.shieldColor||'#cfe4f6';
    ctx.beginPath(); ctx.ellipse(sx,byy-3*sc,5.5*sc,9.5*sc,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#1b3d5c'; ctx.lineWidth=Math.max(1.2,1.8*sc); ctx.stroke();
    ctx.strokeStyle=col; ctx.lineWidth=Math.max(1.6,2.6*sc);
  }
  if(o.helmet){
    ctx.fillStyle=o.helmetColor||'#25400b';
    ctx.beginPath(); ctx.arc(0,HEAD,R+1.5*sc,Math.PI,Math.PI*2); ctx.fill();
    ctx.fillRect(-R-2*sc,HEAD-1*sc,(R+2*sc)*2,2*sc);
  }
  if(o.face){
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(dir*2.6*sc,HEAD-0.5*sc,2*sc,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#111';
    ctx.beginPath(); ctx.arc(dir*3.4*sc,HEAD-0.5*sc,1*sc,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

// ─── BOSS SILHOUETTES ───
function cutBoss(type, cx, by, sc){
  ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
  if(type==='anaconda'){
    ctx.strokeStyle='#2c7a27'; ctx.lineWidth=20*sc;
    ctx.beginPath();
    ctx.moveTo(cx-78*sc,by);
    ctx.bezierCurveTo(cx-104*sc,by-46*sc,cx-6*sc,by-34*sc,cx-20*sc,by-80*sc);
    ctx.bezierCurveTo(cx-32*sc,by-118*sc,cx+44*sc,by-116*sc,cx+30*sc,by-76*sc);
    ctx.stroke();
    ctx.fillStyle='#3d9a35';
    ctx.beginPath(); ctx.ellipse(cx+32*sc,by-68*sc,19*sc,12*sc,-0.25,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ffe24a';
    ctx.beginPath(); ctx.arc(cx+38*sc,by-73*sc,3.4*sc,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#d02b2b'; ctx.lineWidth=2.2*sc;
    ctx.beginPath(); ctx.moveTo(cx+48*sc,by-66*sc);
    ctx.lineTo(cx+68*sc,by-62*sc); ctx.moveTo(cx+68*sc,by-62*sc);
    ctx.lineTo(cx+76*sc,by-67*sc); ctx.moveTo(cx+68*sc,by-62*sc);
    ctx.lineTo(cx+76*sc,by-57*sc); ctx.stroke();
  } else if(type==='lizard'){
    ctx.fillStyle='#7d6a4a';
    ctx.fillRect(cx-52*sc,by-62*sc,104*sc,38*sc);
    ctx.fillStyle='#5d5040';
    [-40,-14,14,40].forEach(ox=>ctx.fillRect(cx+ox*sc-5*sc,by-26*sc,10*sc,26*sc));
    ctx.strokeStyle='#7d6a4a'; ctx.lineWidth=9*sc;
    ctx.beginPath(); ctx.moveTo(cx-52*sc,by-50*sc);
    ctx.quadraticCurveTo(cx-104*sc,by-46*sc,cx-116*sc,by-14*sc); ctx.stroke();
    ctx.fillStyle='#8a7550';
    ctx.fillRect(cx+44*sc,by-80*sc,44*sc,30*sc);
    ctx.fillStyle='#ff3a1e';
    ctx.fillRect(cx+70*sc,by-72*sc,12*sc,5*sc);
    ctx.fillStyle='#c9ad72';
    for(let i=0;i<5;i++) ctx.fillRect(cx-44*sc+i*22*sc,by-70*sc,7*sc,9*sc);
  } else if(type==='yeti'){
    ctx.fillStyle='#e6f0f7';
    ctx.beginPath(); ctx.ellipse(cx,by-56*sc,50*sc,56*sc,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx,by-122*sc,26*sc,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#e6f0f7'; ctx.lineWidth=22*sc;
    ctx.beginPath();
    ctx.moveTo(cx-42*sc,by-96*sc); ctx.lineTo(cx-74*sc,by-40*sc);
    ctx.moveTo(cx+42*sc,by-96*sc); ctx.lineTo(cx+74*sc,by-40*sc); ctx.stroke();
    ctx.fillStyle='#b9cfdd';
    for(let i=0;i<9;i++){
      const a=Math.PI+ (i/8)*Math.PI;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*48*sc,by-56*sc+Math.sin(a)*54*sc);
      ctx.lineTo(cx+Math.cos(a)*62*sc,by-56*sc+Math.sin(a)*66*sc);
      ctx.lineTo(cx+Math.cos(a+0.22)*48*sc,by-56*sc+Math.sin(a+0.22)*54*sc);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle='#1d2b36';
    ctx.beginPath(); ctx.arc(cx-10*sc,by-128*sc,4.5*sc,0,Math.PI*2);
    ctx.arc(cx+10*sc,by-128*sc,4.5*sc,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#5c2020';
    ctx.beginPath(); ctx.ellipse(cx,by-110*sc,15*sc,9*sc,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff';
    for(let i=0;i<4;i++){
      ctx.beginPath();
      ctx.moveTo(cx-12*sc+i*8*sc,by-118*sc);
      ctx.lineTo(cx-8*sc+i*8*sc,by-106*sc);
      ctx.lineTo(cx-4*sc+i*8*sc,by-118*sc); ctx.closePath(); ctx.fill();
    }
  } else if(type==='revenant'){
    ctx.strokeStyle='#d8d2c0'; ctx.lineWidth=7*sc;
    ctx.beginPath(); ctx.moveTo(cx,by-124*sc); ctx.lineTo(cx,by-52*sc); ctx.stroke();
    ctx.lineWidth=5*sc;
    for(let i=0;i<5;i++){
      const yy=by-116*sc+i*13*sc, ww=(26-i*2)*sc;
      ctx.beginPath(); ctx.moveTo(cx-ww,yy+5*sc); ctx.lineTo(cx,yy); ctx.lineTo(cx+ww,yy+5*sc); ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx,by-52*sc); ctx.lineTo(cx-20*sc,by-24*sc); ctx.lineTo(cx-26*sc,by);
    ctx.moveTo(cx,by-52*sc); ctx.lineTo(cx+20*sc,by-24*sc); ctx.lineTo(cx+26*sc,by);
    ctx.moveTo(cx-4*sc,by-118*sc); ctx.lineTo(cx-40*sc,by-92*sc); ctx.lineTo(cx-46*sc,by-58*sc);
    ctx.moveTo(cx+4*sc,by-118*sc); ctx.lineTo(cx+40*sc,by-92*sc); ctx.lineTo(cx+50*sc,by-104*sc);
    ctx.stroke();
    ctx.fillStyle='#ebe6d6';
    ctx.beginPath(); ctx.ellipse(cx,by-140*sc,17*sc,19*sc,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ff7a1e';
    ctx.beginPath(); ctx.arc(cx-6*sc,by-144*sc,4*sc,0,Math.PI*2);
    ctx.arc(cx+6*sc,by-144*sc,4*sc,0,Math.PI*2); ctx.fill();

    ctx.fillStyle='#8d99a6';
    ctx.beginPath();
    ctx.moveTo(cx-102*sc,by-44*sc); ctx.lineTo(cx-38*sc,by-74*sc);
    ctx.lineTo(cx-38*sc,by-14*sc); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#5c6772'; ctx.lineWidth=3*sc;
    for(let i=1;i<4;i++){
      const f=i/4;
      ctx.beginPath();
      ctx.moveTo(cx-102*sc+f*64*sc, by-44*sc-f*30*sc);
      ctx.lineTo(cx-102*sc+f*64*sc, by-44*sc+f*30*sc); ctx.stroke();

    ctx.beginPath(); ctx.moveTo(cx+30*sc,by-58*sc); ctx.lineTo(cx+70*sc,by-40*sc);
