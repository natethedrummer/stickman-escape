   which are centred, so it stays tappable while the menu is open. */

//  CANVAS

const W = 960, H = 540;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;
function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width = W*s+'px'; canvas.style.height = H*s+'px';
}
resize(); addEventListener('resize', resize);

// ══════════════════════════════════════════════════════
//  AUDIO
// ══════════════════════════════════════════════════════
let AC = null;
// Music runs through its own gain node so it can be muted and balanced without
// touching the sound effects, which stay wired straight to the destination.
let musicGain = null;
const MUSIC_VOL = 0.26;             // sits under the SFX on purpose
let musicOn = (localStorage.getItem('pe_music') !== 'off');
function initAC() {
  // Via window, not bare identifiers: `AudioContext || webkitAudioContext` throws
  // a ReferenceError instead of falling back when the unprefixed name is missing,
  // and since initAC runs first inside the keydown handler, that throw used to
  // take `keys[e.code]=true` with it and leave older iPads unable to play at all.
  if (!AC) {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return;                       // no Web Audio: run the game silently
    AC = new Ctor();
  }
  // Browsers start the context suspended until a gesture; every caller of initAC
  // is already inside one, so this is the right place to wake it.
  if (AC.state === 'suspended') AC.resume();
  if (!musicGain) {
    musicGain = AC.createGain();
    musicGain.gain.value = musicOn ? MUSIC_VOL : 0;
    musicGain.connect(AC.destination);
  }
}
function tone(f, v, d, t='square', ef=null) {
  if (!AC) return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.connect(g); g.connect(AC.destination);
  o.type=t; const n=AC.currentTime;
  o.frequency.setValueAtTime(f,n);
  if(ef) o.frequency.exponentialRampToValueAtTime(ef,n+d);
  g.gain.setValueAtTime(0,n); g.gain.linearRampToValueAtTime(v,n+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,n+d);
  o.start(n); o.stop(n+d+0.02);
}
function noise(v, d) {
  if (!AC) return;
  const sz=Math.ceil(AC.sampleRate*d), buf=AC.createBuffer(1,sz,AC.sampleRate);
  const d2=buf.getChannelData(0); for(let i=0;i<sz;i++) d2[i]=Math.random()*2-1;
  const s=AC.createBufferSource(), g=AC.createGain();
  s.buffer=buf; s.connect(g); g.connect(AC.destination);
  const n=AC.currentTime;
  g.gain.setValueAtTime(v,n); g.gain.exponentialRampToValueAtTime(0.0001,n+d);
  s.start(n); s.stop(n+d);
}

  return m ? 12*(+m[3]+1)+NOTE_BASE[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0) : null;
}

    hat: hits("..x...x...x...x...x...x...x...x."),
    snare:hits("................................") },
};

let curTrack=null, musicStep=0, musicNextT=0, musicTimer=null;

function mVoice(freq,t,dur,type,vol){
  if(!AC||!musicGain) return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol),t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(musicGain);
  o.start(t); o.stop(t+dur+0.02);
}
function mKick(t){
  if(!AC||!musicGain) return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type='sine'; o.frequency.setValueAtTime(120,t);
  o.frequency.exponentialRampToValueAtTime(42,t+0.11);
  g.gain.setValueAtTime(0.28,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.15);
  o.connect(g); g.connect(musicGain); o.start(t); o.stop(t+0.17);
}
// One shared noise buffer for the drums. Buffers are immutable and can back any
// number of sources, and the hats fire several times a second for the whole
// session — regenerating the samples each time was ~33KB/s of garbage for
// identical content.
const NOISE_SECS=0.5;
let noiseBuf=null;
function getNoiseBuf(){
  if(noiseBuf) return noiseBuf;
  const n=Math.ceil(AC.sampleRate*NOISE_SECS);
  noiseBuf=AC.createBuffer(1,n,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  return noiseBuf;
}
function mNoise(t,dur,vol,hp){
  if(!AC||!musicGain) return;
  const s=AC.createBufferSource(); s.buffer=getNoiseBuf();
  const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp;
  const g=AC.createGain();
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(musicGain);
  // Start at a random offset so successive hits aren't bit-identical samples
  s.start(t,Math.random()*Math.max(0,NOISE_SECS-dur)); s.stop(t+dur);
}

function musicStepAt(i,t,tr){
  const spb=60/tr.bpm/4;
  const b=tr.bass[i]; if(b!=null) mVoice(midiHz(b),t,spb*3.2,tr.bassWave,tr.bvol);
  const l=tr.lead[i]; if(l!=null) mVoice(midiHz(l),t,spb*2.4,tr.wave,tr.lvol);
  if(tr.kick[i])  mKick(t);
  if(tr.hat[i])   mNoise(t,0.03,0.05,7000);
  if(tr.snare[i]) mNoise(t,0.13,0.12,1400);
}

// Queue anything due in the next 120ms, every 30ms.
function musicScheduler(){
  if(!AC||!musicGain||!curTrack||!musicOn) return;
  const tr=TRACKS[curTrack]; if(!tr) return;
  const spb=60/tr.bpm/4;
  if(musicNextT<AC.currentTime) musicNextT=AC.currentTime+0.06;
  while(musicNextT<AC.currentTime+0.12){
    musicStepAt(musicStep,musicNextT,tr);
    musicNextT+=spb;
    musicStep=(musicStep+1)%tr.bass.length;
  }
}

function setTrack(id){
  if(id===curTrack) return;
  curTrack=id; musicStep=0;
  musicNextT=AC?AC.currentTime+0.06:0;
}

// The current boss's own theme, falling back to the generic one for any type
// without an entry — so a new boss is playable before its music is written.
function bossTrackId(){
  if(!boss) return 'boss';
  if(boss.type==='mech'&&boss.phase===3&&TRACKS.boss_mech_shrink) return 'boss_mech_shrink';
  const id='boss_'+boss.type;
  return TRACKS[id] ? id : 'boss';
}

// Which track the current game state calls for.
function wantedTrack(){
  const s=G.screen;
  if(s==='GAME_OVER') return null;
  if(s==='BOSS_INTRO'||s==='FINAL_BOSS_INTRO') return bossTrackId();
  // A boss taunting Phil before the fight was scored with the title-screen
  // jingle. The arena is already built by this point, so the boss's own theme is
  // available to carry the cutscene into the fight.
  if(s==='CUTSCENE') return (boss&&!boss.dead) ? bossTrackId() : 'menu';
  if(s==='TITLE'||s==='MAP'||s==='WIN'||s==='RUSH_COMPLETE') return 'menu';
  if(secretRun) return 'secret';
  if(boss&&!boss.dead) return bossTrackId();
  return TRACKS['w'+G.world] ? 'w'+G.world : 'w1';
}

function updateMusic(){
  if(!AC) return;                       // nothing until the first gesture wakes audio
  if(!musicTimer) musicTimer=setInterval(musicScheduler,30);
  setTrack(musicOn?wantedTrack():null);
}

function setMusicOn(on){
  musicOn=on;
  try{ localStorage.setItem('pe_music',on?'on':'off'); }catch(e){}
  if(musicGain&&AC){
    musicGain.gain.cancelScheduledValues(AC.currentTime);
    musicGain.gain.setTargetAtTime(on?MUSIC_VOL:0,AC.currentTime,0.05);
  }
  if(!on) curTrack=null;
}
function toggleMusic(){ initAC(); setMusicOn(!musicOn); SFX.pickup(); }

const keys={}, touches={L:false,R:false,J:false,A:false,S:false,P:false,start:false};
// iPadOS Safari defaults to desktop-class browsing and does not put `ontouchstart`
// on window, so an iPad reported itself as a desktop and got no on-screen controls
// at all — unplayable without a keyboard. A coarse primary pointer catches it.
// Additive by design: this can only switch the controls on for a device that had
// none, never off for one that already worked.
const hasTouchEvents='ontouchstart' in window;
const isTouchDevice=hasTouchEvents||(window.matchMedia&&matchMedia('(pointer: coarse)').matches);
const WORLD_CHEAT='xavier', MOBILE_WORLD_CHEAT='jjsjjsjjs', LEVEL_CHEAT='drum', MOBILE_LEVEL_CHEAT='sssjjj', WORLD_CHEAT_TIMEOUT=1400;
// Secret-level picker. Mobile is ▲ ⚔ ▲ ⚔ — no code is a suffix of another, so
// the three buffers sharing one input stream can't trigger each other.
const SECRET_CHEAT='odlaw', MOBILE_SECRET_CHEAT='jaja';
let worldCheatBuffer='', mobileWorldCheatBuffer='', worldCheatLastAt=0;
let levelCheatBuffer='', mobileLevelCheatBuffer='', levelCheatLastAt=0;
let secretCheatBuffer='', mobileSecretCheatBuffer='', secretCheatLastAt=0;
function resetWorldCheat(){ worldCheatBuffer=''; mobileWorldCheatBuffer=''; worldCheatLastAt=0; }
function resetLevelCheat(){ levelCheatBuffer=''; mobileLevelCheatBuffer=''; levelCheatLastAt=0; }
function resetSecretCheat(){ secretCheatBuffer=''; mobileSecretCheatBuffer=''; secretCheatLastAt=0; }
document.addEventListener('keydown',e=>{
  initAC(); keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();
  if(e.code==='KeyM'&&!e.repeat) toggleMusic();     // works on any screen
  handleWorldCheatKey(e);
});
document.addEventListener('keyup',e=>keys[e.code]=false);
canvas.addEventListener('touchstart',e=>{ e.preventDefault(); initAC(); touches.start=true;
  const t=e.changedTouches[0]; if(t) tapPoint=cutPoint(t.clientX,t.clientY); },{passive:false});
canvas.addEventListener('touchend',()=>{ touches.start=false; });
canvas.addEventListener('mousedown',e=>{ initAC(); tapPoint=cutPoint(e.clientX,e.clientY); });
// Same fallback for the canvas itself. Without it a tap sets tapPoint (Safari
// synthesises mousedown) but never touches.start, so the "TAP TO TRY AGAIN"
// screens — which read In.restart() — could not be dismissed by touch at all.
if(!hasTouchEvents){
  canvas.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse') return;          // the mouse is already handled above
    initAC(); touches.start=true; tapPoint=cutPoint(e.clientX,e.clientY);
  });
  canvas.addEventListener('pointerup',e=>{ if(e.pointerType!=='mouse') touches.start=false; });
  canvas.addEventListener('pointercancel',()=>{ touches.start=false; });
}
function bindT(id,p,onPress){ const el=document.getElementById(id);
  el.addEventListener('touchstart',e=>{e.preventDefault();initAC();touches[p]=true; onPress&&onPress()},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();touches[p]=false},{passive:false});
  el.addEventListener('touchcancel',()=>touches[p]=false);
  // Pointer fallback for touch devices that don't dispatch touch events (an iPad
  // in desktop mode). Only bound where touch events are absent, so a phone keeps
  // exactly the path above and no button can fire twice for one press.
  if(hasTouchEvents) return;
  el.addEventListener('pointerdown',e=>{e.preventDefault();initAC();touches[p]=true; onPress&&onPress()});
  el.addEventListener('pointerup',  e=>{e.preventDefault();touches[p]=false});
  el.addEventListener('pointercancel',()=>touches[p]=false);
  el.addEventListener('pointerleave',()=>touches[p]=false); }
if(isTouchDevice){ document.getElementById('touch').style.display='block';
  bindT('tL','L');bindT('tR','R',()=>handleWorldCheatTouch('r'));bindT('tJ','J',()=>handleWorldCheatTouch('j'));
  // The sword button had no cheat callback at all, so no code could use it
  bindT('tA','A',()=>handleWorldCheatTouch('a'));bindT('tS','S',()=>handleWorldCheatTouch('s'));
  // No cheat callback: pause is not part of any code, and feeding it into the
  // buffers would let a pause mid-sequence trigger one
  bindT('tP','P'); }

// The move/jump/attack pad is a fixed overlay pinned to the bottom of the window.
// In landscape — which is how anyone plays a 16:9 platformer on a phone — that
// lands it right on top of the world map's info panel and the lower title menu
// rows, and the buttons swallow the taps meant for them. They mean nothing
// outside actual play, so they only exist during it.
let touchPadShown=true;
function syncTouchPad(){
  if(!isTouchDevice) return;
  // Hidden while someone is speaking too: the dialogue box sits along the bottom
  // where the pad lives, and with the pad gone a tap anywhere advances the line
  const want = G.screen==='PLAYING' && !dlg;
  if(want===touchPadShown) return;
  touchPadShown=want;
  document.getElementById('touch').style.display = want?'block':'none';
  if(!want){ touches.L=touches.R=touches.J=touches.A=touches.S=touches.P=false; }
}
const In={
  left:  ()=>keys['ArrowLeft'] ||keys['KeyA']||touches.L,
  right: ()=>keys['ArrowRight']||keys['KeyD']||touches.R,
  jump:  ()=>keys['Space']||keys['ArrowUp']||keys['KeyW']||touches.J,
  atk:   ()=>keys['KeyZ']||keys['KeyJ']||touches.A,
  shield:()=>keys['KeyX']||keys['KeyK']||keys['ShiftLeft']||keys['ShiftRight']||touches.S,
  start: ()=>keys['Enter']||keys['Space']||touches.start,
  restart:()=>keys['KeyR']||keys['Enter']||touches.start,
  pause:  ()=>keys['Escape']||keys['KeyP']||touches.P,
};

function makeRNG(seed) {
  let s = seed | 0;
  return () => { s=(Math.imul(1664525,s)+1013904223)|0; return (s>>>0)/0xFFFFFFFF; };
}

let parts = [];
function part(cfg) {
  parts.push({ x:cfg.x, y:cfg.y,
    vx:cfg.vx??(Math.random()-.5)*(cfg.spd||80),
    vy:cfg.vy??(Math.random()-.5)*(cfg.spd||80),
    life:1, dec:cfg.dec||2.5, sz:cfg.sz||3,
    color:cfg.color||'#fff', grav:cfg.grav??300,
    type:cfg.type||'dot', text:cfg.text||'' });
}
function burst(x,y,col,n=8,spd=100,grav=300){
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2+Math.random()*.5, r=spd*(.5+Math.random()*.8);
    part({x,y,vx:Math.cos(a)*r,vy:Math.sin(a)*r,color:col,grav,sz:2+Math.random()*3,dec:2+Math.random()});
  }
}
function dustPuff(x,y){ for(let i=0;i<4;i++) part({x:x+(Math.random()-.5)*20,y,vx:(Math.random()-.5)*40,vy:-30-Math.random()*30,color:'#aaa',sz:4+Math.random()*4,dec:3,grav:0}); }
function scorePopup(x,y,txt,col='#ffd700'){ part({x,y,vy:-55,vx:0,color:col,type:'text',text:txt,dec:1.2,grav:-20}); }
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.life-=p.dec*dt;
    if(p.life<=0){parts.splice(i,1);continue;}
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.grav*dt;
  }
}
function drawParts(){
  for(const p of parts){
    ctx.save(); ctx.globalAlpha=Math.max(0,p.life);
    if(p.type==='text'){
      ctx.fillStyle=p.color; ctx.font='bold 14px monospace'; ctx.textAlign='center';
      ctx.fillText(p.text,p.x-cam.x,p.y-cam.y);
    } else {
      ctx.fillStyle=p.color;
      const s=p.sz*Math.max(0.2,p.life);
      ctx.fillRect(p.x-cam.x-s/2,p.y-cam.y-s/2,s,s);
    }
    ctx.restore();
  }
}

//  PHYSICS
// ══════════════════════════════════════════════════════
const GRAV=1600, MAX_FALL=900;
// Scaled by secret levels (the low-gravity stage runs the whole world at 0.5).
// Reset to 1 by startLevel, so a normal level can never inherit it.
let gravMul=1;
function overlap(a,b){ return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y; }
function moveCollide(e, plats, dt){
  e.wasOnGround=e.onGround; e.onGround=false;
  // Which platform the entity ends the frame standing on. updatePlatforms() reads
  // this next frame to carry riders along with a moving platform.
  e.rideP=null;
  const x0=e.x, preBox={x:x0,y:e.y,w:e.w,h:e.h};
  e.x+=e.vx*dt;
  for(const p of plats){ if(p.gone) continue; if(overlap(e,p)){
    // Only resolve overlaps this horizontal step actually created. An entity that
    // started the frame already embedded in a platform (spawned a few px too low,
    // say) would otherwise get shoved out by the shortest horizontal distance —
    // which for a wide floor means launching it clean out of the level, where it
    // falls forever. Leave those to the vertical pass below, which lifts it out
    // the short way instead.
    if(overlap(preBox,p)) continue;
    const pL=(e.x+e.w)-p.x, pR=(p.x+p.w)-e.x;
    if(pL<pR){e.x-=pL;if(e.vx>0)e.vx=0;}else{e.x+=pR;if(e.vx<0)e.vx=0;}
  }}
  e.vy=Math.min(e.vy+GRAV*gravMul*dt,MAX_FALL); e.y+=e.vy*dt;
  for(const p of plats){ if(p.gone) continue; if(overlap(e,p)){
    const pU=(e.y+e.h)-p.y, pD=(p.y+p.h)-e.y;
    if(pU<pD){e.y-=pU;e.rideP=p;if(e.vy>0){e.vy=0;e.onGround=true;}}
    else{e.y+=pD;if(e.vy<0)e.vy=0;}
  }}
}

// ══════════════════════════════════════════════════════
//  MOVING PLATFORMS
// ══════════════════════════════════════════════════════
// Movers live in the same `plats` array as static ground, carrying an `mv` block;
// everything that walks on platforms keeps working unchanged. Each frame they
// step first, record the delta they travelled, and hand it to whatever is
// standing on them — without that, an entity would slide off a platform that
// moves out from under it.
const FALL_SHAKE_DUR = 0.45, FALL_GRAV = 1500;

// Per world: the first level movers appear on, how many at most, and which kinds.
// World 1 stays entirely static — it is where the game teaches jumping.
const MOVING_PLAT_CFG = {
  2:{ from:6, max:2, kinds:['h'] },
  3:{ from:3, max:3, kinds:['h','v'] },
  4:{ from:1, max:3, kinds:['h','v','fall'] },
  5:{ from:1, max:4, kinds:['h','v','fall'] },
  6:{ from:1, max:4, kinds:['h','v','fall'] },
};

function carryRider(e){
  const p=e.rideP;
  if(!p||p.gone||(!p.dx&&!p.dy)) return;
  e.x+=p.dx; e.y+=p.dy;
  // Patrol bounds are absolute level coords, so they have to travel too or a
  // carried enemy immediately walks itself back off the platform.
  if(e.pL!=null){ e.pL+=p.dx; e.pR+=p.dx; }
}

function updatePlatforms(dt){
  if(!levelData||!levelData.hasMovers) return;
  for(const p of levelData.plats){
    const m=p.mv;
    if(!m||p.gone) continue;
    const px=p.x, py=p.y;
    if(m.kind==='h'){
      p.x+=m.speed*m.dir*dt;
      if(p.x<m.min){ p.x=m.min; m.dir=1; }
      else if(p.x>m.max){ p.x=m.max; m.dir=-1; }
    } else if(m.kind==='v'){
      p.y+=m.speed*m.dir*dt;
      if(p.y<m.min){ p.y=m.min; m.dir=1; }
      else if(p.y>m.max){ p.y=m.max; m.dir=-1; }
    } else {
      if(m.state==='idle'){
        if(phil&&!phil.dead&&phil.rideP===p){ m.state='shake'; m.t=FALL_SHAKE_DUR; SFX.land(); }
      } else if(m.state==='shake'){
        m.t-=dt;
        m.wob=Math.sin((FALL_SHAKE_DUR-m.t)*42)*2.5;   // draw-only; collision stays put
        if(m.t<=0){ m.state='drop'; m.vy=0; m.wob=0; }
      } else if(m.state==='drop'){
        m.vy+=FALL_GRAV*dt;
        p.y+=m.vy*dt;
        if(p.y>H+220) p.gone=true;
      }
    }
    p.dx=p.x-px; p.dy=p.y-py;
  }
  if(phil&&!phil.dead) carryRider(phil);
  for(const e of enemies) if(!e.dead) carryRider(e);
}

// Falling platforms are one-shot, so a death has to put them back or the level
// becomes unfinishable on the second attempt. Sliding movers keep their current
// position — resetting those could drop an enemy that was riding one.
function resetFallenPlatforms(){
  if(!levelData||!levelData.hasMovers) return;
  for(const p of levelData.plats){
    const m=p.mv;
    if(!m||m.kind!=='fall') continue;
    p.x=m.bx; p.y=m.by; p.dx=0; p.dy=0; p.gone=false;
    m.state='idle'; m.t=0; m.vy=0; m.wob=0;
  }
}

function pickWeighted(rng, choices){
  const total=choices.reduce((sum,c)=>sum+c.weight,0);
  let roll=rng()*total;
  for(const choice of choices){
    roll-=choice.weight;
    if(roll<=0) return choice.type;
  }
  return choices[choices.length-1].type;
}

function chooseEnemyType(world, level, difficulty, plat, rng){
  const choices=[
    {type:'soldier', weight:plat.y<GROUND_Y ? 0.75 : 1.05},
    {type:'archer', weight:plat.y<GROUND_Y ? 1.0 : 0.45+difficulty*0.03},
  ];
  if(world===1&&level>=7&&plat.y<GROUND_Y&&plat.w>=120){
    choices.push({type:'glider', weight:plat.y<260 ? 0.35 : 0.18});
  }
  if(world===2&&level>=3&&plat.y>=340){
    choices.push({type:'heavy', weight:0.55});
  }
  if(world===2&&level>=5&&plat.w>=120&&plat.y>=260){
    choices.push({type:'bomber', weight:plat.y<GROUND_Y ? 0.45 : 0.28});
  }
  return pickWeighted(rng, choices);
}

function makeEnemySpawn(world, level, difficulty, plat, ex, rng){
  const type=chooseEnemyType(world, level, difficulty, plat, rng);
  if(type==='glider'){
    const homeY=Math.max(120, plat.y-130-Math.floor(rng()*24));
    return {type, x:ex, y:homeY, homeY, pL:Math.max(0,plat.x-20), pR:plat.x+plat.w+20};
  }
  return {type, x:ex, y:plat.y-ENEMY_CFG[type].h, pL:plat.x+5, pR:plat.x+plat.w-5};
}

function isHazardZoneBlocked(x, w, checkX, flagX){
  if(x<350) return true;
  if(flagX&&x+w>flagX-140) return true;
  return !!(checkX&&x<checkX+110&&x+w>checkX-110);
}

// Turns some of the level's spare floating platforms into movers, in place.
// Returns whether any were made, so updatePlatforms can skip static levels
// outright. Travel distance is fitted to the room a platform actually has, so a
// slider never drifts into its neighbours.
function attachMovers(world, level, plats, busy, flagX, rng){
  const cfg=MOVING_PLAT_CFG[world];
  if(!cfg||level<cfg.from) return false;

  const candidates=plats.filter(p =>
    p.y<GROUND_Y && p.w>=80 && p.x>520 && p.x+p.w<flagX-220 && !busy.has(p));
  let made=0;

  for(const p of candidates){
    if(made>=cfg.max) break;
    if(rng()<0.45) continue;
    const kind=cfg.kinds[Math.floor(rng()*cfg.kinds.length)];

    if(kind==='fall'){
      p.mv={ kind:'fall', bx:p.x, by:p.y, state:'idle', t:0, vy:0, wob:0 };
    } else if(kind==='h'){
      // Nearest platform either side at roughly the same height caps the travel
      let room=260;
      for(const o of plats){
        if(o===p||Math.abs(o.y-p.y)>60) continue;
        if(o.x+o.w<=p.x) room=Math.min(room,p.x-(o.x+o.w));
        else if(o.x>=p.x+p.w) room=Math.min(room,o.x-(p.x+p.w));
      }
      const travel=Math.floor(Math.min(130,room-34));
      if(travel<40) continue;
      p.mv={ kind:'h', bx:p.x, by:p.y, min:p.x-travel, max:p.x+travel,
             speed:46+Math.floor(rng()*40), dir:rng()<0.5?-1:1 };
    } else {
      let up=Math.min(120,p.y-160);
      const down=Math.min(90,GROUND_Y-70-p.y);
      // An elevator that rises far enough to press a rider into a platform
      // overhead would wedge him: the ceiling shoves him down into the elevator
      // by the platform's travel every frame, and once he is buried past half his
      // height moveCollide ejects him out the bottom and he falls off the level.
      // So cap the climb at head clearance for whatever is above the shaft.
      for(const o of plats){
        if(o===p||o.y>=p.y) continue;
        if(o.x>=p.x+p.w||o.x+o.w<=p.x) continue;
        up=Math.min(up, p.y-(o.y+o.h)-PHIL_H-8);
      }
      if(up<40||down<30) continue;
      p.mv={ kind:'v', bx:p.x, by:p.y, min:p.y-up, max:p.y+down,
             speed:40+Math.floor(rng()*32), dir:rng()<0.5?-1:1 };
    }
    p.dx=0; p.dy=0; p.gone=false;
    busy.add(p);
    made++;
  }
  return made>0;
}

// Hand-built one-screen-at-a-time stages, one per theme. They're short on purpose
// — a secret is a treat, not a second campaign — and reuse the host world's art so
// they still read as a hidden corner of that world.
function genSecretLevel(world, theme){
  const rng=makeRNG(world*911+7);
  const plats=[], enemies=[], decorations=[];
  const put=(x,y,w,h=14)=>{ const p={x,y,w,h}; plats.push(p); return p; };
  const foe=(type,p,frac)=>{
    const cfg=ENEMY_CFG[type];
    enemies.push({ type, x:Math.round(p.x+p.w*frac-cfg.w/2), y:p.y-cfg.h,
                   pL:p.x+4, pR:p.x+p.w-4 });
  };

  let worldW, flagX, flagY=GROUND_Y;

  if(theme==='moon'){
    // Gaps of 210: past the ~186px a normal-gravity jump covers, so they're the
    // whole point of the stage, but well short of the ~372px moon jump gives —
    // a mistimed hop should still land, not drop Phil down a hole.
    worldW=2200;
    put(0,GROUND_Y,460,20); put(670,GROUND_Y,420,20);
    put(1300,GROUND_Y,400,20); put(1910,GROUND_Y,290,20);
    const a=put(300,300,110), b=put(600,190,120), c=put(900,250,120);
    const d=put(1150,160,120), e=put(1500,240,130); put(1800,180,120);
    foe('archer',b,0.5); foe('soldier',c,0.5); foe('archer',d,0.5); foe('soldier',e,0.5);
    flagX=2120;
  } else if(theme==='bounce'){
    // Continuous ground: Phil is always landing, so he is always being thrown up.
    // A zig-zag shaft rather than a long climb: every step is a 60px gap and a
    // ~50px rise from the last, well inside the ~168px and ~98px a single bounce
    // buys. Missing one drops Phil on the floor to start again — there is nothing
    // to fall off, and no way to run past the flag along the ground.
    worldW=1100;
    put(0,GROUND_Y,1100,20);
    const s1=put(140,395,190), s2=put(390,340,190), s3=put(640,290,190);
    const s4=put(390,240,190), s5=put(140,190,190), top=put(430,150,300);
    foe('soldier',s2,0.5); foe('archer',s4,0.5); foe('soldier',top,0.75);
    void s1; void s3; void s5;
    flagX=560; flagY=top.y;
  } else {
    // Dark: ordinary platforming made hard by only seeing a lantern's worth of it.
    worldW=2000;
    put(0,GROUND_Y,600,20); put(700,GROUND_Y,520,20); put(1320,GROUND_Y,680,20);
    const a=put(300,360,120), b=put(520,290,110), c=put(820,350,130);
    const d=put(1040,270,120), e=put(1240,350,120), f=put(1560,300,140);
    foe('soldier',a,0.5); foe('archer',c,0.5); foe('soldier',d,0.5);
    foe('archer',f,0.5); void b; void e;
    flagX=1900;
  }

  for(let i=0;i<18;i++){
    decorations.push({ type:pickDecorType(world,rng), x:Math.floor(rng()*worldW),
                       scale:0.5+rng()*0.7, layer:rng()<0.5?0:1 });
  }

  return { worldW, plats, enemies, decorations, hazards:[], powerups:[], hasMovers:false,
    key:null, door:null, checkX:null, checkY:null, flagX, flagY,
    playerStart:{x:60,y:GROUND_Y-PHIL_H-1}, isBoss:false, secret:theme };
}

function trainGround(worldW, extra, ground){
  const plats=(ground===false?[]:[{x:0,y:GROUND_Y,w:worldW,h:20}]).concat(extra||[]);
  const decorations=[];
  for(let i=0;i<20;i++) decorations.push({
    type:(WORLDS[G.world]?.deco||['tree'])[i%(WORLDS[G.world]?.deco||['tree']).length],
    x:Math.floor((i*163+40)%worldW), scale:0.5+((i*29)%70)/100, layer:i%2 });
  return { worldW, plats, enemies:[], decorations, hazards:[], powerups:[],
    hasMovers:false, key:null, door:null, checkX:null, checkY:null,
    flagX:null, flagY:null, playerStart:{x:60,y:GROUND_Y-PHIL_H-1},
    isBoss:false, isTraining:true };
}

const TRAIN_KEY='pe_train';
function loadTrain(){
  try{
    const s=JSON.parse(localStorage.getItem(TRAIN_KEY));
    if(s&&typeof s==='object')
      return { best:(s.best&&typeof s.best==='object')?s.best:{},
               cleared:new Set((s.cleared||[]).filter(id=>TRAINING[id])) };
  }catch(e){}
  return { best:{}, cleared:new Set() };
}
let trainRec = loadTrain();
function saveTrain(){
  try{ localStorage.setItem(TRAIN_KEY,JSON.stringify({
    best:trainRec.best, cleared:[...trainRec.cleared] })); }catch(e){}
}

function genLevel(world, level) {
  const isBoss = (level===5||level===10);
  const rng = makeRNG(world*100+level);
  if (isBoss) return genBossArena(world, level, rng);

  const worldW = 3800 + level*150;
  const plats = [];
  const enemies = [];
  const decorations = [];
  const groundGaps = [];

  // Ground chunks
  let gx=0;
  while(gx < worldW-500){
    const gw=350+Math.floor(rng()*220);
    plats.push({x:gx,y:GROUND_Y,w:gw,h:20});
    const gap=70+Math.floor(rng()*70);
    const gapStart=gx+gw;
    const gapW=Math.max(0,Math.min(gap,worldW-420-gapStart));
    if(gapW>0) groundGaps.push({x:gapStart,w:gapW});
    gx += gw + gap;
  }
  plats.push({x:worldW-420,y:GROUND_Y,w:420,h:20});

  // Floating platforms - 3 tiers
  const tiers=[
    {yMin:370,yMax:395,wMin:80,wMax:160,cnt:8+Math.floor(rng()*4)},
    {yMin:270,yMax:305,wMin:80,wMax:140,cnt:6+Math.floor(rng()*4)},
    {yMin:170,yMax:215,wMin:70,wMax:120,cnt:5+Math.floor(rng()*3)},
  ];
  for(const tier of tiers){
    let px=180+Math.floor(rng()*200);
    for(let i=0;i<tier.cnt;i++){
      const pw=tier.wMin+Math.floor(rng()*(tier.wMax-tier.wMin));
      const py=tier.yMin+Math.floor(rng()*(tier.yMax-tier.yMin));
      if(px+pw<worldW-500){ plats.push({x:px,y:py,w:pw,h:14}); }
      px+=pw+110+Math.floor(rng()*160);
    }
  }

  // Platforms that something has been placed on. Moving platforms are picked from
  // what's left over at the end, so nothing positioned against a platform ever
  // finds its footing slide away.
  const busy = new Set();

  // Enemies on platforms
  const difficulty=level+(world-1)*10;
  for(const p of plats){
    if(p.w<100) continue;
    if(rng()<0.35) continue;
    const ex=p.x+40+Math.floor(rng()*(p.w-80));
    if(ex < 300) continue; // safe spawn zone near level start
    busy.add(p);
    enemies.push(makeEnemySpawn(world, level, difficulty, p, ex, rng));
    // Extra enemy on long platforms in later levels
    if(p.w>200&&difficulty>5&&rng()<0.4){
      const ex2=p.x+p.w-80;
      enemies.push(makeEnemySpawn(world, level, difficulty, p, ex2, rng));
    }
  }

  const checkX = Math.floor(worldW/2);
  const flagX = worldW - 80;
  const hazards = [];

  if(world===1&&level>=7){
    const sawLimit=Math.min(4,2+Math.floor((level-7)/2));
    const sawCandidates=plats.filter(p=>p.y<GROUND_Y&&p.w>=130&&!isHazardZoneBlocked(p.x,p.w,checkX,flagX));
    for(const p of sawCandidates){
      if(hazards.length>=sawLimit) break;
      if(rng()<0.45) continue;
      const travel=Math.max(18,Math.min(58,Math.floor((p.w-68)/2)));
      if(travel<18) continue;
      busy.add(p);
      const baseX=p.x+p.w/2-SAW_SIZE/2;
      hazards.push({
        type:'saw',
        x:baseX, y:p.y-SAW_SIZE, w:SAW_SIZE, h:SAW_SIZE,
        damage:1, ignoresInvincibility:true,
        axis:'x', min:baseX-travel, max:baseX+travel,
        speed:90+Math.floor(rng()*45), dir:rng()<0.5?-1:1, rot:rng()*Math.PI*2,
        track:{x:baseX-travel+SAW_SIZE/2,y:p.y-Math.floor(SAW_SIZE/2),w:travel*2,h:2},
      });
    }
  }

  if(world===2&&level>=2){
    const pitLimit=Math.min(4,1+Math.floor(level/3));
    let pitCount=0;
    for(const gap of groundGaps){
      if(pitCount>=pitLimit) break;
      if(gap.w<82||isHazardZoneBlocked(gap.x,gap.w,checkX,flagX)) continue;
      if(rng()<0.28) continue;
      hazards.push({
        type:'pit',
        x:gap.x, y:GROUND_Y, w:gap.w, h:20,
        damage:2, respawnOnHit:true, style:'lava', pulse:rng()*Math.PI*2,
      });
      pitCount++;
    }
  }

  if(world===2&&level>=4){
    const rockLimit=Math.min(3,1+Math.floor((level-2)/3));
    let rockCount=0;
    const rockCandidates=plats.filter(p=>p.y<GROUND_Y&&p.w>=100&&!isHazardZoneBlocked(p.x,p.w,checkX,flagX));
    for(const p of rockCandidates){
      if(rockCount>=rockLimit) break;
      if(rng()<0.5) continue;
      busy.add(p);
      const rx=Math.floor(p.x+p.w*(0.25+rng()*0.5)-ROCK_SIZE/2);
      const ry=Math.max(110,p.y-(68+Math.floor(rng()*42)));
      hazards.push({
        type:'rock',
        x:rx, y:ry, w:ROCK_SIZE, h:ROCK_SIZE,
        damage:1, state:'idle', triggerX:{min:p.x+10,max:p.x+p.w-10},
        warningTimer:0, wobble:0, vy:0, grav:1700, shardColor:'#b9976a',
      });
      rockCount++;
    }
  }

  // Power-ups — 2-3 per level on floating platforms, so they cost a climb rather
  // than sitting on the critical path. Drawn from the same seeded rng as the rest
  // of the level, which keeps a given level's set stable across replays.
  const powerups = [];
  const puLimit = 2+Math.floor(rng()*2);
  const puCandidates = plats.filter(p =>
    p.y<GROUND_Y && p.w>=70 && p.x>420 && p.x+p.w<flagX-160 &&
    !hazards.some(h => h.x<p.x+p.w && h.x+h.w>p.x && Math.abs(h.y-p.y)<90));
  for(const p of puCandidates){
    if(powerups.length>=puLimit) break;
    if(rng()<0.7) continue;
    busy.add(p);
    const type=PU_ORDER[Math.floor(rng()*PU_ORDER.length)];
    powerups.push({ type, x:Math.round(p.x+p.w/2-9), y:p.y-30 });
  }

  // Secret key and door. The key goes on the highest platform in the back half of
  // the level so it takes a real climb to reach, and never on a mover — a key
  // sliding away or dropping out from under you reads as a bug, not a puzzle.
  let key=null, door=null;
  if(hasSecretOn(world,level)){
    const keyCandidates=plats
      .filter(p => p.y<GROUND_Y && p.x>worldW*0.35 && p.x+p.w<flagX-200)
      .sort((a,b) => a.y-b.y);                       // highest platform first
    const kp=keyCandidates[0];
    if(kp){
      key={ x:Math.round(kp.x+kp.w/2-9), y:kp.y-30, w:18, h:22 };
      busy.add(kp);
    }
    door={ x:Math.round(flagX-170), y:GROUND_Y-58, w:40, h:58 };
  }

  // Moving platforms — converted in place from leftover floating platforms
  const hasMovers = attachMovers(world, level, plats, busy, flagX, rng);

  // Background decorations
  for(let i=0;i<30;i++){
    decorations.push({type:pickDecorType(world,rng),x:Math.floor(rng()*worldW),scale:0.5+rng()*0.8,layer:rng()<0.5?0:1});
  }

  // checkY/flagY are the GROUND LINE the flag stands on, not the top of its pole.
  // Both the draw call and the hit box subtract the 80px pole height themselves —
  // passing GROUND_Y-80 here subtracted it twice, which floated every campaign
  // flag a pole's length off the ground and put its hit box out of reach of a
  // walking Phil. You had to jump into the finish flag to end a level.
  // genSecretLevel has always passed GROUND_Y; this now matches it.
  return { worldW, plats, enemies, decorations, hazards, powerups, hasMovers, key, door,
    checkX, checkY:GROUND_Y, flagX, flagY:GROUND_Y,
    playerStart:{x:80,y:GROUND_Y-PHIL_H-1}, isBoss:false };
}

//  SAVED PROGRESS
// ══════════════════════════════════════════════════════
// Single campaign slot. Versioned so a future field change can invalidate old
// saves cleanly instead of loading a half-understood object.
const SAVE_KEY='pe_save', SAVE_VERSION=1;

function readSave(){
  try{
    const s=JSON.parse(localStorage.getItem(SAVE_KEY));
    if(!s||s.v!==SAVE_VERSION) return null;
    // Where the player currently is, which since the world map exists is NOT
    // necessarily the furthest they've reached — picking an earlier level to
    // replay moves this back. `pe_progress` is the record of furthest reached.
    // Level 11 means the player had reached the final Mech fight.
    if(!(s.world>=1&&s.world<=TOTAL_WORLDS)) return null;
    if(!(s.level>=1&&s.level<=11)) return null;
    return { v:s.v, world:s.world, level:s.level, score:+s.score||0,
             lives:Math.max(1,Math.min(9,+s.lives||3)), seenCuts:s.seenCuts||{} };
  }catch(e){ return null; }
}
function writeSave(){
  if(G.mode!=='CAMPAIGN') return;             // Boss Rush never touches campaign progress
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v:SAVE_VERSION, world:G.world, level:G.level,
      score:G.score, lives:G.lives, seenCuts:G.seenCuts||{},
    }));
  }catch(e){}
  saveState=readSave();
}
function clearSave(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  saveState=null;
}
let saveState=readSave();

// ══════════════════════════════════════════════════════
//  MAP PROGRESS
// ══════════════════════════════════════════════════════
// Deliberately separate from the campaign save. `pe_save` is one resumable run
// and gets wiped by NEW GAME and by finishing the game; unlocked levels and best
// scores should survive both — beating the campaign must not re-lock the map.
// Keeping it apart also means the save format never had to change, so an
// in-progress run from an older build keeps working untouched.
const PROG_KEY='pe_progress';
const posRank=(w,l)=>w*100+l;

function loadProgress(){
  try{
    const p=JSON.parse(localStorage.getItem(PROG_KEY));
    if(p&&p.w>=1&&p.w<=TOTAL_WORLDS&&p.l>=1&&p.l<=11){
      const best={};
      if(p.best&&typeof p.best==='object'){
        for(const k of Object.keys(p.best)){ const n=+p.best[k]; if(n>0) best[k]=n; }
      }
      return { w:p.w, l:p.l, best };
    }
  }catch(e){}
  // First run on a build that has the map: seed from however far the existing
  // campaign save had got, so nobody loses access to levels they already beat.
  return { w:saveState?saveState.world:1, l:saveState?saveState.level:1, best:{} };
}
let progress=loadProgress();

function saveProgress(){
  try{ localStorage.setItem(PROG_KEY, JSON.stringify(progress)); }catch(e){}
}
function markReached(w,l){
  if(posRank(w,l)>posRank(progress.w,progress.l)){ progress.w=w; progress.l=l; saveProgress(); }
}
function recordBest(w,l,pts){
  const k=w+'-'+l;
  if(pts>0&&pts>(progress.best[k]||0)){ progress.best[k]=pts; saveProgress(); }
}
function bestFor(w,l){ return progress.best[w+'-'+l]||0; }
function levelUnlocked(w,l){ return posRank(w,l)<=posRank(progress.w,progress.l); }
function levelCleared(w,l){ return posRank(w,l)<posRank(progress.w,progress.l); }
function levelsInWorld(w){ return w===TOTAL_WORLDS?11:10; }   // world 6 carries the final Mech node
function totalLevels(){ return (TOTAL_WORLDS-1)*10+11; }
function clearedCount(){
  let n=0;
  for(let w=1;w<=TOTAL_WORLDS;w++)
    for(let l=1;l<=levelsInWorld(w);l++) if(levelCleared(w,l)) n++;
  return n;
}

  dmg:1, range:48, dur:0.18, cd:0.26 };
const KUNGFU_AIR_DMG = 2;              // the flying kick

const CLOAKS = {
  none:   { name:'NO CLOAK', price:0, color:'#8a94a2',
            blurb:'Just Phil, as he escaped.', note:'' },
  ninja:  { name:'NINJA', price:150, color:'#2a2f3a',
            blurb:'Black wrap, mask, trailing scarf.', note:'' },
  army:   { name:'ARMY KIT', price:150, color:'#3a5a10',
            blurb:'The uniform he walked away from.', note:'' },
  tux:    { name:'TUXEDO', price:200, color:'#14161c',
            blurb:'Nobody escapes this well dressed.', note:'' },
  glow:   { name:'GLOW SUIT', price:250, color:'#7dffb0', glow:true,
            blurb:'Glows in the dark. Only glows.', note:'Looks only — it lights nothing up' },
  kungfu: { name:'KUNG FU GI', price:600, color:'#e8e2d0', martial:true,
            blurb:'Kicks and punches instead of a weapon.',
            note:'Fast and short-range — and a flying kick hits for 2' },
};
const CLOAK_ORDER = ['none','ninja','army','tux','glow','kungfu'];

function cloakDef(){ return CLOAKS[shop.cloak]||CLOAKS.none; }
function martialActive(){ return cloakDef().martial===true; }

// ── SHIELDS ──
// A third slot. The stock shield's rule — it only stops what hits Phil's front —
// is the game's oldest lesson, so each upgrade bends exactly one thing about it
// and pays for it somewhere else.
const SHIELDS = {
  wood: { name:'WOOD SHIELD', price:0, color:'#4466cc', rim:'#2244aa', walk:100,
    blurb:'The one Phil escaped with.',
    stats:['Blocks arrows at the front','Blocks enemies at the front'] },
  tower: { name:'TOWER SHIELD', price:250, color:'#8a929c', rim:'#4c545e', walk:66,
    allAngles:true, tall:true,
    blurb:'Covers every side. Heavy.',
    stats:['Blocks arrows from ANY side','Walk slower while it is up'] },
  spiked: { name:'SPIKED SHIELD', price:350, color:'#7a5230', rim:'#3f2a17', walk:100,
    spikes:1,
    blurb:'Whatever hits it, hurts.',
    stats:['Blocks like the wood one','Enemies that hit it take 1'] },
  magic: { name:'MAGIC SHIELD', price:500, color:'#8f6ad6', rim:'#4d327f', walk:100,
    charges:3,
    blurb:'Three charges that eat a hit whole.',
    stats:['Blocks like the wood one','3 charges a life','A charge eats any one hit'] },
};
const SHIELD_ORDER = ['wood','tower','spiked','magic'];

// Drills test the base skill. A tower shield would let you stand still and pass
// the shield drill without turning once, which is the one thing it measures.
function curShield(){
  if(train&&train.id==='shield') return SHIELDS.wood;
  return SHIELDS[shop.shield]||SHIELDS.wood;
}

const SHOP_KEY = 'pe_shop';
function loadShop(){
  try{
    const s=JSON.parse(localStorage.getItem(SHOP_KEY));
    if(s&&typeof s==='object'){
      const owned=new Set((s.owned||[]).filter(w=>WEAPONS[w]));
      owned.add('sword');                        // the sword is never not owned
      const eq=WEAPONS[s.equipped]&&owned.has(s.equipped)?s.equipped:'sword';
      const cloaks=new Set((s.cloaks||[]).filter(c=>CLOAKS[c]));
      cloaks.add('none');                        // bare Phil is always available
      const cl=CLOAKS[s.cloak]&&cloaks.has(s.cloak)?s.cloak:'none';
      const shields=new Set((s.shields||[]).filter(x=>SHIELDS[x]));
      shields.add('wood');                       // he never loses the first one
      const sh=SHIELDS[s.shield]&&shields.has(s.shield)?s.shield:'wood';
      return { coins:Math.max(0,s.coins|0), owned, equipped:eq, cloaks, cloak:cl,
               shields, shield:sh };
    }
  }catch(e){}
  return { coins:0, owned:new Set(['sword']), equipped:'sword',
           cloaks:new Set(['none']), cloak:'none',
           shields:new Set(['wood']), shield:'wood' };
}
let shop = loadShop();
function saveShop(){
  try{ localStorage.setItem(SHOP_KEY,JSON.stringify({
    coins:shop.coins, owned:[...shop.owned], equipped:shop.equipped,
    cloaks:[...shop.cloaks], cloak:shop.cloak,
    shields:[...shop.shields], shield:shop.shield })); }catch(e){}
}
// The gi takes the weapon slot over rather than sitting beside it. Wearing it
// means giving up the bazooka, which is the whole point of it costing 600.
function curWeapon(){
  if(martialActive()) return KUNGFU_ATTACK;
  return WEAPONS[shop.equipped]||WEAPONS.sword;
}
function ownedWeapons(){ return WEAPON_ORDER.filter(w=>shop.owned.has(w)); }

// Banked the moment they are picked up, so closing the tab — or dying — never
// costs the player coins they have already collected.
function addCoins(n){
  if(n<=0) return 0;
  shop.coins+=n; saveShop();
  return n;
}

// Switching mid-level is free and instant — the swing timer is deliberately not
// reset, so cycling past a weapon you don't want costs nothing.
function equipWeapon(id){
  if(!WEAPONS[id]||!shop.owned.has(id)) return;
  shop.equipped=id; saveShop();
}
function equipShield(id){
  if(!SHIELDS[id]||!shop.shields.has(id)) return;
  shop.shield=id; saveShop();
  if(phil) phil.shieldCharges=SHIELDS[id].charges||0;
}

function equipCloak(id){
  if(!CLOAKS[id]||!shop.cloaks.has(id)) return;
  shop.cloak=id; saveShop();
}

// Grounded punches are quick and cheap; the flying kick is the reward for
// committing to a jump. It is the only reason to wear the gi over a bazooka.
function attackDamage(wep){
  if(wep.martial&&!phil.onGround) return KUNGFU_AIR_DMG;
  return wep.dmg||1;
}

function cycleWeapon(dir){
  if(martialActive()){
    if(phil&&!phil.dead) scorePopup(phil.x+phil.w/2,phil.y-14,'GI: NO WEAPONS','#e8e2d0');
    SFX.broke(); return;
  }
  const own=ownedWeapons();
  if(own.length<2) return;
  let i=own.indexOf(shop.equipped); if(i<0) i=0;
  equipWeapon(own[(i+dir+own.length)%own.length]);
  SFX.pickup();
  if(phil&&!phil.dead) scorePopup(phil.x+phil.w/2,phil.y-14,curWeapon().name,curWeapon().color);
}

// Every score award funnels through here so the ×2 power-up needs exactly one
// hook. Returns the points actually granted, for the popup text.
function addScore(base){
  const pts=Math.round(base*scoreMult());
  G.score+=pts;
  return pts;
}

function initPhil(sx,sy){
  phil={ x:sx,y:sy, vx:0,vy:0, w:PHIL_W,h:PHIL_H,
    health:5.0, maxHealth:5.0, facingR:true,
    onGround:false, wasOnGround:false,
    walkCycle:0, jumpBuffer:0,
    attacking:false, atkTimer:0, atkCD:0, attackedSet:new Set(),
    shielding:false, dead:false, deathTimer:0, invTimer:2.0,
    starT:0, speedT:0, multT:0, starHitT:0, auraPhase:0,
    // Rockets are per-life, not per-purchase — respawning rebuilds phil, so a
    // death hands them all back rather than leaving a dud weapon equipped.
    ammo:WEAPONS.bazooka.ammoMax, boomOut:false, fireFx:0,
    // Magic charges refill on every respawn, same as rockets do
    shieldCharges:(SHIELDS[shop.shield]||SHIELDS.wood).charges||0, shieldFx:0 };
}

function spawnEnemies(defs){
  return defs.map(d=>{
    museumSee(d.type);          // encountering one is what unlocks its page
    const cfg=ENEMY_CFG[d.type]||ENEMY_CFG.soldier;
    return {
      type:d.type, x:d.x, y:d.y, vx:0,vy:0, w:cfg.w,h:cfg.h,
      health:cfg.maxHealth,maxHealth:cfg.maxHealth, facingR:false,
      onGround:false, wasOnGround:false, walkCycle:(d.x*0.07)%(Math.PI*2),
      pL:d.pL,pR:d.pR, homeY:d.homeY??d.y,
      aiState:'PATROL', alertTimer:0, atkCD:0,
      dead:false, deathTimer:0, alerted:false, stateTimer:0,
      guardOpen:false, hoverPhase:(d.x*0.031)%(Math.PI*2),
    };
  });
}

function spawnHazards(defs=[]){
  return defs.map(h=>{
    if(h.type==='saw') return {...h, active:true, cooldown:0, rot:h.rot??0, dir:h.dir||1};
    if(h.type==='pit') return {...h, active:true, cooldown:0, pulse:h.pulse??0};
    if(h.type==='rock') return {...h, active:true, state:h.state||'idle', warningTimer:h.warningTimer||0, wobble:h.wobble||0, vy:h.vy||0, grav:h.grav||1700, spentTimer:0.35};
    return {...h, active:true};
  });
}

function startLevel(){
  writeSave();                    // auto-save at the start of every campaign level
  if(G.mode==='CAMPAIGN') markReached(G.world,G.level);
  levelStartScore=G.score;
  secretRun=null; gravMul=1; hasKey=false;   // never inherit secret-level rules
  hasRay=false; rayCD=0; rayFx=null;
  levelData = genLevel(G.world, G.level);
  enemies   = spawnEnemies(levelData.enemies);
  projs     = [];
  pickups   = spawnPowerups(levelData.powerups);
  hazards   = spawnHazards(levelData.hazards);
  boss      = null;
  dlg       = null;              // a stale line would freeze the new level
  checkActivated = false;
  checkpointRespawn = null;
  parts     = [];
  cam.x=0; cam.y=0; shake=0; paused=false; combo=0; comboTimer=0;
  initPhil(levelData.playerStart.x, levelData.playerStart.y);
  lastSafeGround = {...levelData.playerStart};

  if(levelData.isBoss){
    const bt = getBossType(G.world, G.level);
    boss = spawnBoss(bt, levelData.worldW);
    const toBossIntro = ()=>{ G.screen='BOSS_INTRO'; bossIntroTimer=3.0; };
    // World bosses (level 10) get a comic cutscene first; mini bosses go straight
    // in. Boss Rush skips the story beats entirely — it's back-to-back fights.
    if(G.level===10 && G.mode!=='RUSH') playCutscene('boss'+G.world, toBossIntro);
    else toBossIntro();
  } else {
    G.screen = 'PLAYING';
    playWorldArrival();      // draws over the level, so it needs PLAYING first
  }
}

// ── SECRET LEVEL FLOW ──
// G.world/G.level deliberately stay pointed at the campaign level with the door,
// so running out of lives drops the player back onto that level (the existing
// GAME_OVER path calls startLevel) rather than stranding them in the secret.
// `world` is the secret to play; it defaults to wherever Phil is, which is the
// door case. The cheat picker passes an arbitrary one. G.world moves to the
// target because the background, platforms and music all key off it — the stage
// should look and sound like the world it belongs to, not the one you left.
function startSecretLevel(world=G.world, opts={}){
  const theme=SECRET_THEME[world];
  secretRun={ theme, world, returnWorld:G.world, returnLevel:G.level, cheat:!!opts.cheat };
  G.world=world;
  levelData = genSecretLevel(world, theme);
  enemies   = spawnEnemies(levelData.enemies);
  projs     = [];
  pickups   = [];
  hazards   = [];
  boss      = null;
  dlg       = null;              // a stale line would freeze the new level
  checkActivated = false;
  checkpointRespawn = null;
  parts     = [];
  cam.x=0; cam.y=0; shake=0; paused=false; combo=0; comboTimer=0;
  hasKey=false;
  gravMul = theme==='moon' ? 0.5 : 1;
  initPhil(levelData.playerStart.x, levelData.playerStart.y);
  lastSafeGround = {...levelData.playerStart};
  G.screen='SECRET_INTRO'; secretIntroTimer=2.8;
  SFX.clear();
}

function secretComplete(){
  const meta=SECRET_META[secretRun.theme];
  const first=!secretsFound.has(secretRun.world);
  // A secret reached by cheat is playable and scores, but doesn't count as found
  // — Golden Phil still has to be earned by actually hunting the six keys.
  if(!secretRun.cheat){ secretsFound.add(secretRun.world); saveSecrets(); }
  // Full prize the first time only, so a found secret can be replayed for fun
  // without turning into a score farm.
  secretAward = addScore((first&&!secretRun.cheat) ? meta.bonus : 500);
  lastCoinAward = addCoins(COIN_SECRET);
  secretGolden = secretRun.cheat ? false : checkGoldenUnlock();
  G.lives=3; phil.health=5.0;
  SFX.win();
  burst(levelData.flagX,levelData.flagY-20,'#ffd54a',20,150,0);
  G.screen='SECRET_CLEAR'; levelClearTimer=3.4;
}

function leaveSecret(){
  const ret=secretRun;
  secretRun=null; gravMul=1;
  G.world=ret.returnWorld; G.level=ret.returnLevel;
  if(ret.cheat){
    // Never advance the campaign through a level that wasn't played — the cheat
    // drops you back onto the level you jumped in from.
    startLevel();
    return;
  }
  // Leaving through the door clears that campaign level, so it earns a best too
  recordBest(ret.returnWorld,ret.returnLevel,G.score-levelStartScore);
  nextLevel();                    // the door counted as clearing that level
}

// ── TUTORIAL FLOW ──
// Runs as its own mode. Campaign progress, the save file, lives and score are all
// parked on the way in and restored on the way out, so the tutorial can be
// replayed from the title mid-campaign without touching a thing.
function startTutorial(from='TITLE'){
  initAC();
  tutReturn=from;
  tutKeep={ mode:G.mode, world:G.world, level:G.level, score:G.score, lives:G.lives };
  G.mode='TUTORIAL'; G.world=1; G.level=1; G.score=0; G.lives=3;
  secretRun=null; gravMul=1; hasKey=false;
  hasRay=false; rayCD=0; rayFx=null;
  levelData = genTutorialLevel();
  enemies   = spawnEnemies(levelData.enemies);
  projs=[]; pickups=[]; hazards=[]; boss=null; parts=[]; dlg=null;
  checkActivated=false; checkpointRespawn=null;
  cam.x=0; cam.y=0; shake=0; paused=false; combo=0; comboTimer=0;
  initPhil(levelData.playerStart.x, levelData.playerStart.y);
  lastSafeGround={...levelData.playerStart};
  tut={ i:0, jumps:0, blocks:0, held:0, mercyT:0, flash:'', flashT:0 };
  enterTutStep(0);
  G.screen='PLAYING';
}

// Falling is a lesson, not a punishment: each step parks the respawn point inside
// itself, so the worst a mistake costs is the walk back to where you were.
function enterTutStep(i){
  tut.i=i; tut.held=0; tut.mercyT=0;
  const s=TUT_STEPS[i];
  if(s) checkpointRespawn={ x:s.safeX, y:GROUND_Y-PHIL_H-1 };
}

function tutAdvance(msg){
  tut.flash=msg; tut.flashT=1.5;
  if(tut.i+1<TUT_STEPS.length){ enterTutStep(tut.i+1); SFX.checkpoint(); }
}

function updateTutorial(dt){
  if(!tut||phil.dead) return;
  if(tut.flashT>0) tut.flashT-=dt;
  const s=tutStep();
  if(!s) return;
  tut.held+=dt;
  if(s.mercy) tut.mercyT+=dt;
  if(s.done()){ tutAdvance('Got it!'); return; }
  // The two steps that ask for a skill let go after a while rather than trapping
  // anyone who can't land it
  if(s.mercy&&tut.mercyT>=s.mercy) tutAdvance('Good enough — moving on');
}

// The red flag is the one hard gate in the tutorial: without it a player could
// sprint past the archer and finish having learned nothing about the shield.
function tutorialFlagTouch(){
  if(tut.i>=TUT_STEPS.length-1){ tutorialFinish(); return; }
  if(tut.flashT<=0){ tut.flash='Finish the drill first!'; tut.flashT=1.6; SFX.broke(); }
  phil.x=levelData.flagX-72; phil.vx=0;
}

function markTutorialDone(){
  tutorialDone=true;
  try{ localStorage.setItem(TUT_KEY,'done'); }catch(e){}
}

function tutorialFinish(){
  markTutorialDone();
  SFX.win();
  burst(levelData.flagX,levelData.flagY-20,'#ff3322',18,130,0);
  G.screen='TUTORIAL_DONE';
}

// Skipping counts as done. Being asked again every time you start a new game is
// worse than missing it — the title always has it if you want it back.
function skipTutorial(){
  markTutorialDone();
  exitTutorial();
}

function exitTutorial(){
  const to=tutReturn, keep=tutKeep;
  tut=null; tutKeep=null; paused=false;
  if(keep){ G.mode=keep.mode; G.world=keep.world; G.level=keep.level;
            G.score=keep.score; G.lives=keep.lives; }
  else G.mode='CAMPAIGN';
  if(to==='CAMPAIGN'){ playCutscene('intro',startLevel); return; }
  if(to==='PRACTICE'){ openPractice(true); return; }
  titleKeyHeld=true; G.screen='TITLE';
}

// ── TRAINING FLOW ──
const TRAIN_REWARD = 50;            // one-off, the first time a drill is passed
let train = null;                   // { id, t, score, done, ... } while running
let trainKeep = null;               // campaign state parked for the duration

function trainDef(){ return train ? TRAINING[train.id] : null; }
function trainScoreNow(){ return train.id==='parkour' ? train.t : train.score; }
function fmtTrain(id,v){
  if(v==null) return '—';
  return id==='parkour' ? v.toFixed(2)+'s' : String(v);
}

function startTraining(id){
  const d=TRAINING[id];
  if(!d) return;
  initAC();
  trainKeep={ mode:G.mode, world:G.world, level:G.level, score:G.score, lives:G.lives };
  G.mode='TRAINING'; G.world=d.world; G.level=1; G.score=0; G.lives=3;
  secretRun=null; gravMul=1; hasKey=false;
  hasRay=false; rayCD=0; rayFx=null;
  tut=null; dlg=null;
  train={ id, t:0, score:0, done:false, hitGuard:false };
  levelData = d.build();
  enemies   = spawnEnemies(levelData.enemies);
  projs=[]; pickups=[]; hazards=[]; boss=null; parts=[];
  checkActivated=false; checkpointRespawn=null;
  cam.x=0; cam.y=0; shake=0; paused=false; combo=0; comboTimer=0;
  initPhil(levelData.playerStart.x, levelData.playerStart.y);
  lastSafeGround={...levelData.playerStart};
  d.start();
  G.screen='PLAYING';
}

function updateTraining(dt){
  if(!train||train.done||phil.dead) return;
  const d=trainDef();
  train.t+=dt;
  if(!phil.attacking) train.hitGuard=false;      // one score per swing, not per frame
  d.update(dt);
  if(d.timed!==false && train.t>=TRAIN_TIME) finishTraining();
}

// Parkour is the only drill that ends on the flag rather than the clock
function trainFlagTouch(){
  if(train.id==='parkour') finishTraining();
}

function trainPhilDied(){
  if(train.id==='survive'){
    // Dying IS the end of a survival run — but let the death play out first
    setTimeout(()=>{ if(train&&!train.done) finishTraining(); },1400);
    return;
  }
  setTimeout(()=>{ if(train&&!train.done) respawnPhil(); },1000);
}

function finishTraining(){
  if(!train||train.done) return;
  train.done=true;
  const d=trainDef();
  const score = train.id==='parkour' ? +train.t.toFixed(2) : train.score;
  const passed = d.lower ? score<=d.target : score>=d.target;
  const prev = trainRec.best[train.id];
  const better = prev==null || (d.lower ? score<prev : score>prev);

  train.final=score; train.passed=passed; train.newBest=better; train.prev=prev;
  if(better) trainRec.best[train.id]=score;
  train.coins=0;
  // Paid once per drill, ever. A drill you can replay for coins is a coin farm,
  // and the shop is meant to be earned in the campaign.
  if(passed && !trainRec.cleared.has(train.id)){
    trainRec.cleared.add(train.id);
    train.coins=addCoins(TRAIN_REWARD);
  }
  saveTrain();
  if(passed) SFX.win(); else SFX.clear();
  G.screen='TRAIN_DONE';
}

function exitTraining(){
  const keep=trainKeep;
  train=null; trainKeep=null; paused=false;
  if(keep){ G.mode=keep.mode; G.world=keep.world; G.level=keep.level;
            G.score=keep.score; G.lives=keep.lives; }
  else G.mode='CAMPAIGN';
  openPractice(true);
}

// ── HUD + RESULT ──
function drawTrainingHUD(){
  if(!train||paused) return;
  const d=trainDef();
  const bw=386, bx=(W-bw)/2, by=54, bh=44;
  ctx.fillStyle='rgba(6,12,20,0.86)'; ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle='#ffd54a'; ctx.lineWidth=2; ctx.strokeRect(bx+1,by+1,bw-2,bh-2);

  ctx.textAlign='left';
  ctx.fillStyle='#ffd54a'; ctx.font='bold 12px monospace';
  ctx.fillText(d.name,bx+12,by+18);
  ctx.fillStyle='#8a8256'; ctx.font='10px monospace';
  ctx.fillText('BEAT '+fmtTrain(train.id,d.target),bx+12,by+34);

  // The clock counts down on the timed drills and up on the parkour run, because
  // on parkour the number IS the score
  const left=Math.max(0,TRAIN_TIME-train.t);
  const clock = d.timed===false ? train.t.toFixed(2)+'s' : left.toFixed(1)+'s';
  ctx.textAlign='center';
  ctx.fillStyle=(d.timed!==false&&left<6)?'#ff7766':'#ffffff';
  ctx.font='bold 20px monospace';
  ctx.fillText(clock,bx+bw/2+28,by+29);

  ctx.textAlign='right';
  ctx.fillStyle='#ffffff'; ctx.font='bold 20px monospace';
  if(d.timed!==false) ctx.fillText(String(train.score),bx+bw-12,by+24);
  ctx.fillStyle='#8a8256'; ctx.font='10px monospace';
  ctx.fillText(d.timed!==false?d.unit:'best '+fmtTrain(train.id,trainRec.best[train.id]),
    bx+bw-12,by+37);
  ctx.textAlign='left';
}

function drawTrainDone(){
  const d=trainDef();
  ctx.fillStyle='rgba(4,8,14,0.9)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.save();
  ctx.shadowColor=train.passed?'#44ff88':'#ffbb55'; ctx.shadowBlur=18;
  ctx.fillStyle=train.passed?'#7dffb0':'#ffd54a'; ctx.font='bold 42px monospace';
  ctx.fillText(train.passed?'DRILL PASSED':'GOOD RUN',W/2,120);
  ctx.restore();
  ctx.fillStyle='#a9c4d4'; ctx.font='15px monospace';
  ctx.fillText(d.name,W/2,152);

  const rows=[
    ['YOUR SCORE', fmtTrain(train.id,train.final)],
    ['TO PASS',    fmtTrain(train.id,d.target)],
    ['YOUR BEST',  fmtTrain(train.id,trainRec.best[train.id])+(train.newBest?'   ★ NEW':'')],
  ];
  rows.forEach((r,i)=>{
    const y=212+i*42;
    ctx.fillStyle='rgba(255,213,74,0.08)'; ctx.fillRect(W/2-230,y-24,460,34);
    ctx.textAlign='left';  ctx.fillStyle='#8a8256'; ctx.font='bold 13px monospace';
    ctx.fillText(r[0],W/2-214,y);
    ctx.textAlign='right'; ctx.fillStyle='#ffffff'; ctx.font='bold 17px monospace';
    ctx.fillText(r[1],W/2+214,y);
  });

  ctx.textAlign='center';
  if(train.coins>0){
    ctx.fillStyle='#ffd700'; ctx.font='bold 18px monospace';
    ctx.fillText('+'+train.coins+' COINS for passing it the first time',W/2,368);
  } else if(train.passed){
    ctx.fillStyle='#6a7a6a'; ctx.font='13px monospace';
    ctx.fillText('Already passed — this one is for the leaderboard now',W/2,368);
  } else {
    ctx.fillStyle='#8a8256'; ctx.font='13px monospace';
    ctx.fillText(d.blurb,W/2,368);
  }

  if(Math.sin(frameN*.07)>0){
    ctx.fillStyle='#ffffff'; ctx.font='bold 16px monospace';
    ctx.fillText(isTouchDevice?'TAP TO GO BACK':'PRESS ENTER TO GO BACK',W/2,H-40);
  }
  ctx.textAlign='left';
}

// ── BOSS RUSH RUN ──
function startRushRun(){
  G.mode='RUSH'; G.score=0; G.lives=3; G.seenCuts={};
  const pool=Object.keys(BOSS_SLOT);
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  rush.queue=[...pool,'mech'];    // the Mech is always the finale, never a random pick
  rush.idx=0; rush.cleared=0; rush.speed=1;
  startRushFight(5.0);
}

function startRushFight(health){
  const type=rush.queue[rush.idx];
  if(type==='mech'){
    // Match the campaign's final-boss context so the arena themes as Berlin
    // rather than inheriting whatever world the previous rush fight used.
    G.world=TOTAL_WORLDS; G.level=11;
    startFinalBossLevel();
  } else {
    const slot=BOSS_SLOT[type];
    G.world=slot[0]; G.level=slot[1];
    startLevel();                 // reuses the campaign arena; skips cutscenes in RUSH mode
  }
  phil.health=Math.max(0.5,Math.min(5.0,health));   // health carries across fights
  applyRushScaling();
}

// Bosses always start in phase 1 — the ramp is health and speed only. Spawning
// them already in phase 2 would skip the transition inside hitBoss(), which is
// what triggers the Bone Revenant's split-into-halves mechanic (see #47).
function applyRushScaling(){
  if(!boss) return;
  const n=rush.cleared;
  boss.maxHealth=Math.max(1,Math.round(boss.maxHealth*Math.min(1.5,1+0.08*n)));
  boss.health=boss.maxHealth;
  rush.speed=Math.min(1.25,1+0.023*n);
}

function rushBossCleared(){
  rush.cleared++;
  lastCoinAward=addCoins(COIN_BOSS);                // Boss Rush pays for weapons too
  phil.health=Math.min(5.0,phil.health+1.5);        // heal between fights (playtested: 1.0 was a touch harsh)
  for(const id of SKIN_ORDER){
    const s=SKINS[id];
    if(s.unlockAt===rush.cleared && !unlockedSkins.has(id)){
      unlockedSkins.add(id); currentSkin=id; saveSkins();
      SFX.clear(); scorePopup(phil.x+phil.w/2,phil.y-40,'SKIN UNLOCKED: '+s.name,'#ffdd44');
    }
  }
  G.screen='LEVEL_CLEAR'; levelClearTimer=2.5;
}

function rushNextFight(){
  rush.idx++;
  if(rush.idx>=rush.queue.length){
    if(G.score>rush.best){ rush.best=G.score; try{localStorage.setItem('pe_rush',rush.best);}catch(e){} }
    if(G.score>G.highScore){ G.highScore=G.score; try{localStorage.setItem('pe_hs',G.highScore);}catch(e){} }
    G.screen='RUSH_COMPLETE';
    return;
  }
  startRushFight(phil.health);
}

// ══════════════════════════════════════════════════════
//  PLAYER (PHIL)
// ══════════════════════════════════════════════════════
function updatePhil(dt){
  if(phil.dead){ phil.deathTimer-=dt; return; }

  const left=In.left(), right=In.right();
  const shielding = In.shield() && !phil.attacking;
  // Each raise of the guard spikes a given enemy once. Cleared on lowering it,
  // so a soldier that backs off and charges again takes another hit.
  if(!shielding && phil.spikeSet) phil.spikeSet.clear();
  phil.shielding = shielding;
  const boosted = phil.speedT>0;
  const speed = shielding ? (curShield().walk||100) : (boosted?SPEED_RUN:240);

  if(left){  phil.vx=-speed; phil.facingR=false; }
  else if(right){ phil.vx=speed; phil.facingR=true; }
  else phil.vx *= Math.pow(0.02,dt);

  // Jump buffering
  if(In.jump()) phil.jumpBuffer=0.12;
  if(phil.jumpBuffer>0){
    phil.jumpBuffer-=dt;
    if(phil.onGround){ phil.vy=boosted?SPEED_JUMP:-620; phil.jumpBuffer=0; SFX.jump(); dustPuff(phil.x+phil.w/2,phil.y+phil.h);
      if(tut) tut.jumps++;                      // counted at the source of truth
    }
  }

  // Attack — while Phil is holding the shrink ray, Z fires that instead of the
  // sword, so the finale doesn't ask the player to learn a new key at the climax
  if(rayCD>0) rayCD-=dt;
  if(rayFx){ rayFx.life-=dt; if(rayFx.life<=0) rayFx=null; }
  const wep=curWeapon();
  if(phil.fireFx>0) phil.fireFx-=dt;
  if(hasRay){
    if(In.atk()&&rayCD<=0&&!shielding){ fireShrinkRay(); rayCD=RAY_CD; }
  } else if(wep.ranged){
    if(In.atk()&&phil.atkCD<=0&&!shielding) fireWeapon(wep);
  } else if(In.atk()&&phil.atkCD<=0&&!shielding){
    phil.attacking=true; phil.atkTimer=wep.dur; phil.atkCD=wep.cd;
    phil.attackedSet.clear();
    if(wep===WEAPONS.hammer) SFX.smash(); else SFX.atk();
  }
  if(phil.atkTimer>0) phil.atkTimer-=dt; else phil.attacking=false;
  if(phil.atkCD>0) phil.atkCD-=dt;
  if(phil.invTimer>0) phil.invTimer-=dt;
  if(comboTimer>0){ comboTimer-=dt; if(comboTimer<=0) combo=0; }
  tickPowerups(dt);

  moveCollide(phil, levelData.plats, dt);
  if(phil.onGround&&!phil.wasOnGround){
    dustPuff(phil.x+phil.w/2,phil.y+phil.h); SFX.land();
    if(secretRun&&secretRun.theme==='bounce'){
      // Leave onGround set: the jump check at the top of the next frame reads it,
      // so the player can still choose a full jump instead of the stock bounce.
      // The landing edge stays correct anyway — the frame after this one is
      // airborne, which clears wasOnGround before the next touchdown.
      phil.vy=BOUNCE_V; SFX.jump();
      burst(phil.x+phil.w/2,phil.y+phil.h,'#8fe6ff',6,70,0);
    }
  }
  if(phil.onGround&&Math.abs(phil.vx)>20) phil.walkCycle+=dt*8;

  // Attack hit check
  if(phil.attacking){
    const rng=wep.range||ATK_RANGE;
    const ax = phil.facingR ? phil.x+phil.w : phil.x-rng;
    const atkBox={x:ax,y:phil.y+8,w:rng,h:28};
    // Hit enemies
    for(const e of enemies){
      if(!e.dead&&!phil.attackedSet.has(e)&&overlap(atkBox,e)){
        phil.attackedSet.add(e);
        if(e.type==='glider'&&phil.onGround) continue;
        // The hammer's whole point is that a raised shield stops mattering
        if(isHeavyFrontGuarding(e)){
          if(!wep.breaksGuard){
            burst((phil.facingR?e.x:e.x+e.w),e.y+e.h*0.45,'#88ccff',6,70,0); SFX.block();
            continue;
          }
          burst((phil.facingR?e.x:e.x+e.w),e.y+e.h*0.45,'#ffcc66',12,140,120);
        }
        hitEnemy(e,attackDamage(wep));
      }
    }
    // Destroy bombs mid-air
    for(const p of projs){
      if(p.dead||p.type!=='bomb'||!overlap(atkBox,p)) continue;
      p.dead=true;
      burst(p.x,p.y,'#ffd27a',10,90,30); SFX.block();
    }
    // Hit boss
    if(boss&&!boss.dead&&!phil.attackedSet.has(boss)&&overlapBoss(atkBox)){
      phil.attackedSet.add(boss); hitBoss(attackDamage(wep), atkBox);
    }
  }

  // World clamp
  if(phil.x<0){phil.x=0;phil.vx=0;}
  if(phil.x+phil.w>levelData.worldW){phil.x=levelData.worldW-phil.w;phil.vx=0;}
  if(phil.y>H+100){ philDie(); return; }

  // Projectile hits
  if(phil.invTimer<=0){
    for(const p of projs){
      if(p.dead||!p.hostile||p.type!=='arrow') continue;
      const pb={x:p.x,y:p.y,w:p.w,h:p.h};
      if(!overlap(pb,phil)) continue;
      // Shield block check (only arrows blockable)
      if(phil.shielding&&p.type==='arrow'){
        const fromRight=p.vx<0, facingRight=phil.facingR;
        if(curShield().allAngles||fromRight===facingRight){
          p.dead=true; burst(p.x,p.y,'#88ccff',6,70,0); SFX.block();
          if(tut) tut.blocks++;
          if(train&&train.id==='shield') train.score++;
          continue;
        }
      }
      p.dead=true; philTakeDmg(0.5); break;
    }
  }

  // Enemy contact
  if(phil.invTimer<=0){
    for(const e of enemies){
      if(e.dead) continue;
      if(!overlap(phil,e)) continue;
      // Shield block melee
      if(phil.shielding){
        const eInFront=phil.facingR?(e.x>phil.x):(e.x+e.w<phil.x+phil.w);
        if(eInFront){
          SFX.block(); phil.invTimer=0.3;
          const sp=curShield().spikes;
          if(sp&&!phil.spikeSet?.has(e)){
            (phil.spikeSet||(phil.spikeSet=new Set())).add(e);
            hitEnemy(e,sp);
          }
          continue;
        }
      }
      philTakeDmg(0.5); phil.vx=phil.x<e.x+e.w/2?-220:220; phil.vy=-300; break;
    }
  }

  // Boss contact
  // A fleeing, knee-high Mech is harmless — bumping into it must not chip Phil
  const bossHarmless = boss&&boss.type==='mech'&&boss.phase===3&&
                       (boss.aiState==='FLEE'||boss.aiState==='COLLAPSE');
  if(boss&&!boss.dead&&!bossHarmless&&phil.invTimer<=0&&overlapBoss(phil)){
    const focus=getBossFocusBox()||boss;
    philTakeDmg(0.5); phil.vx=phil.x<focus.x+focus.w/2?-250:250; phil.vy=-320;
  }

  // Checkpoint
  if(!checkActivated&&levelData.checkX){
    const flagBox={x:levelData.checkX-15,y:levelData.checkY-80,w:30,h:90};
    if(overlap(phil,flagBox)){
      checkActivated=true; SFX.checkpoint();
      checkpointRespawn={x:levelData.checkX-PHIL_W/2, y:GROUND_Y-PHIL_H-1};
      burst(levelData.checkX,levelData.checkY-20,'#4488ff',10,60,0);
      scorePopup(levelData.checkX,levelData.checkY-50,'+'+addScore(100),'#4488ff');
    }
  }

  // Secret key
  if(levelData.key&&!hasKey&&overlap(phil,levelData.key)){
    hasKey=true;
    burst(levelData.key.x+9,levelData.key.y+11,'#ffd54a',16,120,0);
    scorePopup(levelData.key.x+9,levelData.key.y-14,'SECRET KEY!','#ffd54a');
    SFX.power();
  }

  // Secret door — an alternative exit standing just short of the finish flag
  if(levelData.door&&hasKey&&overlap(phil,levelData.door)){
    startSecretLevel();
    return;                       // phil and levelData were just replaced
  }

  // Red flag (level end)
  if(levelData.flagX&&!boss){
    const flagBox={x:levelData.flagX-15,y:levelData.flagY-80,w:30,h:90};
    if(overlap(phil,flagBox)){
      if(tut) tutorialFlagTouch();
      else if(train) trainFlagTouch();
      else if(secretRun) secretComplete();
      else levelComplete();
    }
  }
}

function philTakeDmg(amt, opts={}){
  const { ignoreInv=false, setInv=true, respawnToSafe=false } = opts;
  if(phil.dead) return false;
  if(!ignoreInv&&phil.invTimer>0) return false;
  // An arrow through the guard costs a point. That is the whole drill: it is
  // cheaper to turn and block than to tank it.
  if(train&&train.id==='shield'&&!train.done){ train.taken++; train.score--; }
  const hitX=phil.x+phil.w/2, hitY=phil.y+phil.h/2;

  // The star is true immunity — it also beats hazards that pass ignoreInv (saws,
  // lava). Pit hits still run the respawnToSafe teleport below: skipping it would
  // leave Phil sitting in the gap to fall off the bottom of the level, which
  // would make picking up a star strictly worse than not having one.
  // A magic charge eats the hit whole. The star still wins — it is free and
  // temporary, so spending a charge under one would be strictly worse. Pit hits
  // can be absorbed too: the respawnToSafe teleport below runs either way, so
  // Phil is still lifted out of the gap rather than left in it.
  const immune = phil.starT>0;
  if(!immune && phil.shieldCharges>0){
    phil.shieldCharges--; phil.shieldFx=0.45;
    burst(hitX,hitY,SHIELDS.magic.color,14,130,0);
    scorePopup(hitX,hitY-18,'ABSORBED',SHIELDS.magic.color);
    SFX.block();
    if(setInv) phil.invTimer=INV_DUR;
    if(respawnToSafe){
      const sp=lastSafeGround||checkpointRespawn||levelData.playerStart;
      phil.x=sp.x; phil.y=sp.y; phil.vx=0; phil.vy=0;
      phil.onGround=false; phil.wasOnGround=false;
      lastSafeGround={x:sp.x,y:sp.y};
    }
    return false;
  }
  if(immune){
    // Contact is continuous (a saw only sets its cooldown when it actually
    // lands a hit), so throttle the feedback instead of firing it every frame.
    if(phil.starHitT<=0){
      phil.starHitT=0.18;
      burst(hitX,hitY,'#ffe14d',8,110);
      SFX.starHit();
    }
  } else {
    phil.health=Math.max(0,phil.health-amt);
    if(setInv) phil.invTimer=INV_DUR;
    shake=0.4;
    combo=0; comboTimer=0;
    burst(hitX,hitY,'#ff4444',10,120);
    SFX.hit();
    if(phil.health<=0){
      philDie();
      return true;
    }
  }
  if(respawnToSafe){
    dustPuff(hitX,Math.max(GROUND_Y,phil.y+phil.h));
    const sp=lastSafeGround||checkpointRespawn||levelData.playerStart;
    phil.x=sp.x; phil.y=sp.y; phil.vx=0; phil.vy=0;
    phil.onGround=false; phil.wasOnGround=false;
    lastSafeGround={x:sp.x,y:sp.y};
    burst(phil.x+phil.w/2,phil.y+phil.h/2,'#ffaa66',8,90,0);
    dustPuff(phil.x+phil.w/2,phil.y+phil.h);
  }
  return !immune;
}

function philDie(){
  phil.dead=true; phil.deathTimer=1.8;
  burst(phil.x+phil.w/2,phil.y+phil.h/2,'#4488ff',20,150,400);
  SFX.die(); shake=0.7;
  combo=0; comboTimer=0;
  // Nobody runs out of lives in a tutorial. The step's own respawn point puts
  // Phil back where he was, and the lesson carries on.
  if(tut){ setTimeout(()=>{ if(tut) respawnPhil(); },1200); return; }
  if(train){ trainPhilDied(); return; }
  G.lives--;
  if(G.lives>0){
    setTimeout(()=>{ respawnPhil(); },1800);
  } else {
    setTimeout(()=>{ G.screen='GAME_OVER'; },1800);
  }
}

function respawnPhil(){
  const sp=checkpointRespawn||levelData.playerStart;
  resetFallenPlatforms();
  initPhil(sp.x,sp.y);
  lastSafeGround={x:sp.x,y:sp.y};
  G.screen='PLAYING';
}

function levelComplete(){
  addScore(500); SFX.clear();
  if(museumDirty) saveMuseum();
  lastCoinAward=addCoins(levelData.isBoss?COIN_BOSS:COIN_LEVEL);

  // figure that means anything when you replay a level from the map.
  if(G.mode==='CAMPAIGN') recordBest(G.world,G.level,G.score-levelStartScore);
  G.lives=3; phil.health=5.0;
  burst(levelData.flagX,levelData.flagY-20,'#ff3322',16,120,0);

}
