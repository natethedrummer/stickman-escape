    ctx.fillStyle='#1c2230';
    ctx.beginPath();
    ctx.moveTo(cx-34*sc,by-88*sc); ctx.lineTo(cx+34*sc,by-88*sc);
    ctx.lineTo(cx+26*sc,by-18*sc); ctx.lineTo(cx-26*sc,by-18*sc); ctx.closePath(); ctx.fill();
    ctx.fillRect(cx-24*sc,by-20*sc,18*sc,20*sc);
    ctx.fillRect(cx+6*sc,by-20*sc,18*sc,20*sc);
    ctx.fillStyle='#f2f2f4';
    ctx.beginPath();
    ctx.moveTo(cx-9*sc,by-88*sc); ctx.lineTo(cx+9*sc,by-88*sc);
    ctx.lineTo(cx+5*sc,by-42*sc); ctx.lineTo(cx-5*sc,by-42*sc); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#8a1f1f';
    ctx.beginPath();
    ctx.moveTo(cx,by-84*sc); ctx.lineTo(cx+6*sc,by-74*sc);
    ctx.lineTo(cx,by-48*sc); ctx.lineTo(cx-6*sc,by-74*sc); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#e8d4bb';
    ctx.beginPath(); ctx.arc(cx,by-104*sc,15*sc,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#14161c';
    ctx.fillRect(cx-15*sc,by-110*sc,30*sc,8*sc);
    ctx.beginPath(); ctx.arc(cx,by-116*sc,15*sc,Math.PI,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#14161c'; ctx.lineWidth=2*sc;
    ctx.beginPath(); ctx.moveTo(cx+14*sc,by-102*sc);
    ctx.quadraticCurveTo(cx+26*sc,by-92*sc,cx+22*sc,by-76*sc); ctx.stroke();
    ctx.strokeStyle='#1c2230'; ctx.lineWidth=9*sc;
    ctx.beginPath(); ctx.moveTo(cx-30*sc,by-80*sc); ctx.lineTo(cx-44*sc,by-42*sc); ctx.stroke();
  } else if(type==='mech'){
    ctx.fillStyle='#3c4450';
    ctx.fillRect(cx-46*sc,by-124*sc,92*sc,66*sc);
    ctx.fillStyle='#2b323c';
    ctx.fillRect(cx-38*sc,by-58*sc,26*sc,58*sc);
    ctx.fillRect(cx+12*sc,by-58*sc,26*sc,58*sc);
    ctx.fillStyle='#4c5663';
    ctx.fillRect(cx-24*sc,by-166*sc,48*sc,40*sc);
    ctx.fillStyle='#ff3a2a';
    ctx.fillRect(cx-16*sc,by-154*sc,12*sc,7*sc);
    ctx.fillRect(cx+4*sc,by-154*sc,12*sc,7*sc);
    ctx.fillStyle='#5a6470';
    ctx.fillRect(cx-78*sc,by-118*sc,32*sc,20*sc);
    ctx.fillRect(cx+46*sc,by-118*sc,32*sc,20*sc);
    ctx.fillStyle='#7d8794';
    ctx.fillRect(cx-96*sc,by-114*sc,20*sc,12*sc);
  }
  ctx.restore();
}

// ─── PANEL SCENERY ───
function cutSky(r,a,b){
  const g=ctx.createLinearGradient(0,r.y,0,r.y+r.h);
  g.addColorStop(0,a); g.addColorStop(1,b);
  ctx.fillStyle=g; ctx.fillRect(r.x,r.y,r.w,r.h);
}
function cutFloor(r,hy,fill,top){
  ctx.fillStyle=fill; ctx.fillRect(r.x,hy,r.w,r.y+r.h-hy);
  ctx.fillStyle=top;  ctx.fillRect(r.x,hy,r.w,5);
}
function cutWorldBg(n,r){
  const w=WORLDS[n], hy=r.y+r.h*0.76;
  cutSky(r,w.skyT,w.skyB);
  if(n===1){
    [0.08,0.24,0.42,0.62,0.82,0.95].forEach((f,i)=>drawPineTree(r.x+r.w*f,hy,0.8+(i%3)*0.16,'#1c5210'));
  } else if(n===2){
    drawDune(r.x-40,hy-46,340,54,'#d9a860'); drawDune(r.x+r.w*0.5,hy-40,380,48,'#c99848');
    [0.16,0.44,0.78].forEach((f,i)=>drawCactus(r.x+r.w*f,hy,0.85+(i%2)*0.2,'#2f7a35'));
  } else if(n===3){
    ctx.fillStyle='#cfe0ee';
    ctx.beginPath(); ctx.moveTo(r.x,hy); ctx.lineTo(r.x+r.w*0.28,hy-124);
    ctx.lineTo(r.x+r.w*0.54,hy); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(r.x+r.w*0.46,hy); ctx.lineTo(r.x+r.w*0.76,hy-152);
    ctx.lineTo(r.x+r.w,hy); ctx.closePath(); ctx.fill();
    [0.1,0.34,0.66,0.9].forEach((f,i)=>drawSnowPine(r.x+r.w*f,hy,0.72+(i%2)*0.16,'#1f4a20'));
  } else if(n===4){
    [0.12,0.3,0.55,0.8].forEach((f,i)=>drawPipe(r.x+r.w*f,hy,0.9+(i%2)*0.25,'#5b6672'));
    [0.22,0.68].forEach(f=>drawGearPole(r.x+r.w*f,hy,1.05,'#7b8794'));
  } else if(n===5){
    [0.1,0.3,0.52,0.74,0.92].forEach((f,i)=>drawStalagmite(r.x+r.w*f,hy,0.85+(i%3)*0.2,'#4a3d33'));
    [0.2,0.62].forEach(f=>drawLantern(r.x+r.w*f,hy-56,1,'#e8a83c'));
  } else {
    ctx.fillStyle='#39404d';
    for(let i=0;i<7;i++){
      const bx=r.x+8+i*112, bh=90+((i*53)%70);
      ctx.fillRect(bx,hy-bh,92,bh);
      ctx.fillStyle='#f0d68a';
      for(let wy=0;wy<Math.floor(bh/26);wy++)
        for(let wx=0;wx<3;wx++)
          if((i+wy+wx)%3) ctx.fillRect(bx+12+wx*28,hy-bh+12+wy*26,13,13);
      ctx.fillStyle='#39404d';
    }
    [0.18,0.55,0.88].forEach(f=>drawStreetlight(r.x+r.w*f,hy,1,'#9aa4b0'));
  }
  cutFloor(r,hy,WORLDS[n].platFill,WORLDS[n].platTop);
  return hy;
}
function cutYardBg(r,night){
  const hy=r.y+r.h*0.78;
  cutSky(r, night?'#101828':'#5b6b80', night?'#243247':'#98a6b8');
  if(night){
    ctx.fillStyle='rgba(255,255,255,0.85)';
    for(let i=0;i<26;i++) ctx.fillRect(r.x+((i*97)%r.w), r.y+8+((i*61)%110), 2, 2);
  }
  ctx.fillStyle='#2f3a44';
  for(let i=0;i<12;i++) ctx.fillRect(r.x+18+i*64,hy-96,7,96);
  ctx.fillRect(r.x,hy-98,r.w,6); ctx.fillRect(r.x,hy-58,r.w,5);
  ctx.strokeStyle='#4a5762'; ctx.lineWidth=2;
  for(let i=0;i<9;i++){
    ctx.beginPath(); ctx.moveTo(r.x+i*92,hy-96); ctx.lineTo(r.x+i*92+70,hy-58); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r.x+i*92,hy-58); ctx.lineTo(r.x+i*92+70,hy-96); ctx.stroke();
  }
  cutFloor(r,hy,'#4a4a44','#5e5e54');
  return hy;
}
function cutSpotlight(x,y,r0,r1,col){
  const g=ctx.createRadialGradient(x,y,r0,x,y,r1);
  g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r1,0,Math.PI*2); ctx.fill();
}

// ─── TEXT ───
function cutFont(b){ return b.style==='shout' ? 'bold 17px monospace' : '15px monospace'; }
function cutWrap(text,maxW){
  const words=text.split(' '), out=[]; let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxW && line){ out.push(line); line=w; }
    else line=t;
  }
  if(line) out.push(line);
  return out;
}
function cutBlocks(p,r){
  if(p._blocks) return p._blocks;
  const blocks=[];
  if(p.caption){
    ctx.font='14px monospace';
    blocks.push({ kind:'caption', lines:cutWrap(p.caption, r.w*0.56) });
  }
  for(const b of (p.lines||[])){
    ctx.font=cutFont(b);
    blocks.push({ kind:'bubble', b, lines:cutWrap(b.text,(b.w||0.34)*r.w) });
  }
  for(const bl of blocks) bl.n=bl.lines.reduce((a,L)=>a+L.length,0);
  p._blocks=blocks;
  return blocks;
}
function cutTotal(blocks){ return blocks.reduce((a,b)=>a+b.n,0); }
function cutReveal(lines,left){
  const out=[];
  for(const L of lines){
    if(left<=0){ out.push(''); continue; }
    out.push(L.slice(0,left)); left-=L.length;
  }
  return out;
}

function cutCaptionBox(r,lines){
  ctx.font='14px monospace';
  let maxW=0; for(const L of lines) maxW=Math.max(maxW,ctx.measureText(L).width);
  const padX=12, padY=9, lh=19;
  const bw=maxW+padX*2, bh=lines.length*lh+padY*2;
  const bx=r.x+14, by=r.y+14;
  ctx.fillStyle='#f6e9c4'; ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle='#14140f'; ctx.lineWidth=2.5; ctx.strokeRect(bx,by,bw,bh);
  ctx.fillStyle='#20200f'; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  lines.forEach((L,i)=>ctx.fillText(L,bx+padX,by+padY+14+i*lh));
}

function cutBubbleBox(r,b,lines){
  ctx.font=cutFont(b);
  let maxW=0; for(const L of lines) maxW=Math.max(maxW,ctx.measureText(L).width);
  const padX=13, padY=11, lh=19;
  const bw=maxW+padX*2, bh=lines.length*lh+padY*2;
  const bx=r.x+b.x*r.w-bw/2, by=r.y+b.y*r.h-bh/2;
  const tx=r.x+(b.tail?b.tail[0]:b.x)*r.w, ty=r.y+(b.tail?b.tail[1]:b.y+0.16)*r.h;

  ctx.save();
  ctx.strokeStyle='#14140f'; ctx.lineWidth=2.5; ctx.fillStyle='#fdfdf6';
  if(b.style==='thought'){
    for(const [ox,oy,rr] of [[-bw*0.3,-bh*0.42,15],[bw*0.06,-bh*0.5,17],[bw*0.34,-bh*0.36,14],
                             [-bw*0.36,bh*0.34,14],[bw*0.02,bh*0.46,16],[bw*0.36,bh*0.3,13]]){
      ctx.beginPath(); ctx.arc(bx+bw/2+ox,by+bh/2+oy,rr,0,Math.PI*2); ctx.fill(); ctx.stroke();
    }
    cutRR(bx,by,bw,bh,10); ctx.fill();
    const dx=tx-(bx+bw/2), dy=ty-(by+bh/2);
    for(let i=1;i<=3;i++){
      const f=i/3.4;
      ctx.beginPath(); ctx.arc(bx+bw/2+dx*f,by+bh/2+dy*f,7-i*1.6,0,Math.PI*2);
      ctx.fill(); ctx.stroke();
    }
  } else if(b.style==='shout'){
    cutStar(bx+bw/2,by+bh/2,bw*0.88,bh*1.55,bw*0.72,bh*1.0,13,0.2);
    ctx.fill(); ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(bx+bw*0.34,by+bh); ctx.lineTo(tx,ty); ctx.lineTo(bx+bw*0.56,by+bh);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    cutRR(bx,by,bw,bh,10); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#fdfdf6';
    ctx.fillRect(bx+bw*0.34+1.6,by+bh-1.4,bw*0.22-3.2,3);
  }
  ctx.fillStyle=b.style==='shout'?'#a01818':'#14140f';
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.font=cutFont(b);
  lines.forEach((L,i)=>ctx.fillText(L,bx+bw/2,by+padY+14+i*lh));
  if(b.who){
    ctx.font='bold 10px monospace'; ctx.textAlign='left';
    if(b.style==='shout'){        // sits on the white burst, no tab needed
      ctx.fillStyle='#6a6250'; ctx.fillText(b.who,bx+4,by-5);
    } else {                      // tab, so the name reads on any background
      const ww=ctx.measureText(b.who).width+10;
      ctx.fillStyle='#14140f'; ctx.fillRect(bx+6,by-14,ww,14);
      ctx.fillStyle='#f6e9c4'; ctx.fillText(b.who,bx+11,by-4);
    }
  }
  ctx.restore();
}

function getCutscene(key){
  if(CUT_SCENES[key]) return CUT_SCENES[key];
  const m=/^boss(\d)$/.exec(key);
  if(m && CUT_BOSS_SCENES[+m[1]]) return buildBossScene(+m[1]);
  return null;
}

// ─── PLAYBACK ───
function playCutscene(key, after){
  const panels=G.seenCuts[key] ? null : getCutscene(key);
  if(!panels){ after(); return; }
  G.seenCuts[key]=true;
  for(const p of panels) p._blocks=null;
  cutscene={ panels, i:0, chars:0, t:0, after };
  cutHeld=true; tapPoint=null;
  G.screen='CUTSCENE';
}

function endCutscene(){
  const after=cutscene.after;
  cutscene=null; tapPoint=null; cutHeld=true;
  keys['Enter']=false; keys['Space']=false; keys['KeyZ']=false; touches.start=false;
  after();
}

function advanceCutscene(){
  const p=cutscene.panels[cutscene.i];
  const total=cutTotal(cutBlocks(p,CUT_R));
  if(cutscene.chars<total){ cutscene.chars=total; SFX.block(); return; }
  cutscene.i++;
  if(cutscene.i>=cutscene.panels.length){ endCutscene(); return; }
  cutscene.chars=0; cutscene.t=0; SFX.checkpoint();
}

function updateCutscene(dt){
  cutscene.t+=dt;
  const p=cutscene.panels[cutscene.i];
  const total=cutTotal(cutBlocks(p,CUT_R));
  if(cutscene.chars<total) cutscene.chars=Math.min(total,cutscene.chars+dt*CUT_CPS);

  const skipKey=keys['Escape'];
  const advKey=keys['Space']||keys['Enter']||keys['KeyZ']||keys['ArrowRight'];
  const tapSkip=cutInBox(tapPoint,CUT_SKIP);
  const tapAdv=tapPoint && !tapSkip;
  tapPoint=null;

  if(skipKey||tapSkip){ keys['Escape']=false; endCutscene(); return; }
  // Taps are already one-shot; only the keyboard needs a held-key guard.
  if(tapAdv) advanceCutscene();
  else if(advKey && !cutHeld){ cutHeld=true; advanceCutscene(); }
  if(!cutscene) return;
  if(!advKey) cutHeld=false;
}

function drawCutscene(){
  const p=cutscene.panels[cutscene.i];
  const r=CUT_R;
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#141410'); g.addColorStop(1,'#22221a');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // Panel pops in slightly on arrival
  const pop=Math.min(1,cutscene.t/0.18), sc=0.965+0.035*pop;
  ctx.save();
  ctx.translate(r.x+r.w/2,r.y+r.h/2); ctx.scale(sc,sc); ctx.translate(-(r.x+r.w/2),-(r.y+r.h/2));
  ctx.globalAlpha=pop;

  ctx.save();
  ctx.beginPath(); ctx.rect(r.x,r.y,r.w,r.h); ctx.clip();
  ctx.fillStyle='#0d0d0a'; ctx.fillRect(r.x,r.y,r.w,r.h);
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  p.art(r,cutscene.t);
  ctx.restore();

  // Panel text
  const blocks=cutBlocks(p,r);
  let left=Math.floor(cutscene.chars);
  for(const bl of blocks){
    if(left<=0) break;
    const shown=cutReveal(bl.lines,left);
    if(bl.kind==='caption') cutCaptionBox(r,shown);
    else cutBubbleBox(r,bl.b,shown);
    left-=bl.n;
  }

  ctx.strokeStyle='#f2efe2'; ctx.lineWidth=6; ctx.strokeRect(r.x-3,r.y-3,r.w+6,r.h+6);
  ctx.strokeStyle='#14140f'; ctx.lineWidth=3; ctx.strokeRect(r.x,r.y,r.w,r.h);
  ctx.restore();

  // Progress dots
  const n=cutscene.panels.length, dw=13, x0=W/2-(n*dw)/2+dw/2;
  for(let i=0;i<n;i++){
    ctx.fillStyle=i===cutscene.i?'#ffcc22':(i<cutscene.i?'#7a7358':'#3c3a30');
    ctx.beginPath(); ctx.arc(x0+i*dw,H-58,4,0,Math.PI*2); ctx.fill();
  }

  const total=cutTotal(blocks);
  ctx.textAlign='center';
  if(cutscene.chars>=total && Math.sin(frameN*.09)>0){
    ctx.fillStyle='#fff'; ctx.font='bold 15px monospace';
    ctx.fillText(isTouchDevice?'TAP TO CONTINUE  ▶':'PRESS SPACE TO CONTINUE  ▶',W/2,H-28);
  } else {
    ctx.fillStyle='#6e6a58'; ctx.font='13px monospace';
    ctx.fillText(isTouchDevice?'tap to show all the words':'space skips ahead',W/2,H-28);
  }

  // Skip button
  const b=CUT_SKIP;
  ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(b.x,b.y,b.w,b.h);
  ctx.strokeStyle='#8a8570'; ctx.lineWidth=2; ctx.strokeRect(b.x,b.y,b.w,b.h);
  ctx.fillStyle='#cfcab4'; ctx.font='12px monospace';
  ctx.fillText(isTouchDevice?'SKIP':'SKIP (ESC)',b.x+b.w/2,b.y+19);
  ctx.textAlign='left';
}

//  MAIN LOOP
// ══════════════════════════════════════════════════════
let lastT=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min((ts-lastT)/1000,.05); lastT=ts; frameN++;

  syncTouchPad();
  updateMusic();
  ctx.clearRect(0,0,W,H);

  // --- TITLE ---
  if(G.screen==='TITLE'){ drawTitle(); handleTitleInput(); return; }
  if(G.screen==='MAP'){ updateMap(dt); drawMap(); handleMapInput(); return; }
  if(G.screen==='PRACTICE'){ drawPractice(); handlePracticeInput(); return; }
  if(G.screen==='MUSEUM'){ drawMuseum(dt); handleMuseumInput(); return; }
  if(G.screen==='TRAIN_DONE'){
    drawBackground(); drawPlatforms(); drawDecorations(); drawTrainDone();
    if(train.passed&&Math.random()<.03) burst(Math.random()*W,Math.random()*H*.6,'#ffe14d',10,140,0);
    updateParts(dt); drawParts();
    if(In.restart()){ exitTraining(); }
    return;
  }
  // Drawn over the frozen level it was opened from, so you can see where you are
  if(G.screen==='SECRET_PICK'){
    drawBackground(); drawPlatforms(); drawDecorations(); drawHUD();
    drawSecretPicker(); handleSecretPickInput(); return;
  }
  // Opened from the title as well as mid-level, so it can't assume a live level
  // to draw itself over the way the secret picker does
  if(G.screen==='SHOP'){
    if(shopReturn==='PLAYING'&&levelData){ drawBackground(); drawPlatforms(); drawDecorations(); }
    else drawTitle();
    drawShop(); handleShopInput(dt); return;
  }
  // --- TUTORIAL COMPLETE ---
  if(G.screen==='TUTORIAL_DONE'){
    drawBackground(); drawPlatforms(); drawDecorations(); drawTutorialDone();
    if(Math.random()<.03) burst(Math.random()*W,Math.random()*H*.6,'#7dffb0',10,140,0);
    updateParts(dt); drawParts();
    if(In.restart()){ exitTutorial(); }
    return;
  }
  // --- BOSS RUSH COMPLETE ---
  if(G.screen==='RUSH_COMPLETE'){ drawRushComplete(); if(Math.random()<.03) burst(Math.random()*W,Math.random()*H*.6,'#'+Math.floor(Math.random()*0xffffff).toString(16),12,150,0); updateParts(dt); drawParts(); if(In.restart()){ G.mode='CAMPAIGN'; G.screen='TITLE'; } return; }
  // --- CUTSCENE ---
  if(G.screen==='CUTSCENE'){ updateCutscene(dt); if(cutscene) drawCutscene(); return; }
  // --- GAME OVER ---
  if(G.screen==='GAME_OVER'){ drawBackground(); drawPlatforms(); drawGameOver(); if(In.restart()){ initAC(); if(G.mode==='RUSH'){ G.mode='CAMPAIGN'; G.screen='TITLE'; } else { G.lives=3; startLevel(); } } return; }
  // --- WIN ---
  if(G.screen==='WIN'){ drawWin(); if(Math.random()<.03) burst(Math.random()*W,Math.random()*H*.6,'#'+Math.floor(Math.random()*0xffffff).toString(16),12,150,0); updateParts(dt); drawParts(); if(In.restart()){ G.screen='TITLE'; } return; }

  // --- SECRET INTRO / CLEAR ---
  if(G.screen==='SECRET_INTRO'){
    drawBackground(); drawPlatforms(); drawDecorations();
    secretIntroTimer-=dt;
    drawSecretIntro();
    if(secretIntroTimer<=0){ G.screen='PLAYING'; }
    return;
  }
  if(G.screen==='SECRET_CLEAR'){
    drawBackground(); drawPlatforms(); drawDecorations(); drawHUD(); drawSecretClear();
    if(Math.random()<.04) burst(Math.random()*W,Math.random()*H*.6,'#ffd54a',10,140,0);
    updateParts(dt); drawParts();
    levelClearTimer-=dt;
    if(levelClearTimer<=0) leaveSecret();
    return;
  }

  // --- BOSS INTRO ---
  if(G.screen==='BOSS_INTRO'||G.screen==='FINAL_BOSS_INTRO'){
    drawBackground(); drawPlatforms(); drawDecorations();
    drawBoss();
    bossIntroTimer-=dt;
    if(G.screen==='BOSS_INTRO') drawBossIntro(); else drawFinalBossIntro();
    // The taunt lands as the fight opens, with the boss already on screen —
    // the mini bosses are the ones with no comic scene of their own
    if(bossIntroTimer<=0){ G.screen='PLAYING'; if(boss) playBossTaunt(boss.type); }
    return;
  }

  // --- LEVEL CLEAR ---
  if(G.screen==='LEVEL_CLEAR'){
    drawBackground(); drawPlatforms(); drawDecorations(); drawHUD(); drawLevelClear();
    levelClearTimer-=dt;
    if(levelClearTimer<=0){ if(G.mode==='RUSH') rushNextFight(); else nextLevel(); }
    return;
  }

  // --- PLAYING ---
  if(G.screen==='PLAYING'){
    // Pause toggle (edge-triggered). Held off while someone is speaking: the
    // dialogue owns Escape as its skip, and the two would fight over it.
    if(!dlg){
      if(In.pause()){ if(!pauseKeyHeld){ paused=!paused; pauseSelect=0; pauseKeyHeld=true; } } else { pauseKeyHeld=false; }
    }

    if(dlg){
      updateDialogue(dt);
      updateParts(dt);          // let the boss's death sparks keep burning behind it
    } else if(paused){
      // Navigate pause menu
      if(keys['ArrowDown']||keys['KeyS']){ pauseSelect=(pauseSelect+1)%pauseItems().length; keys['ArrowDown']=false; keys['KeyS']=false; }
      if(keys['ArrowUp']  ||keys['KeyW']){ pauseSelect=(pauseSelect+pauseItems().length-1)%pauseItems().length; keys['ArrowUp']=false; keys['KeyW']=false; }
      if(keys['Enter']||keys['Space']){
        keys['Enter']=false; keys['Space']=false;
        pauseActivate();
      }
      handlePauseTap();     // the only way to work this menu on a phone or iPad
    } else {
      // Weapon swap — C or Q cycles, the number keys pick directly, and tapping
      // the HUD box is the touch route (the pad has no room for a sixth button)
      const swapKey=keys['KeyC']||keys['KeyQ'];
      const digit=WEAPON_ORDER.findIndex((w,i)=>keys['Digit'+(i+1)]);
      if(swapKey||digit>=0){
        if(!swapKeyHeld){
          swapKeyHeld=true;
          if(digit>=0) { if(shop.owned.has(WEAPON_ORDER[digit])&&shop.equipped!==WEAPON_ORDER[digit]){ equipWeapon(WEAPON_ORDER[digit]); SFX.pickup(); } }
          else cycleWeapon(1);
        }
      } else swapKeyHeld=false;
      if(tapPoint){
        const b=WEAPON_BOX;
        if(tapPoint.x>=b.x-10&&tapPoint.x<=b.x+b.w+10&&tapPoint.y>=b.y-10&&tapPoint.y<=b.y+b.h+10) cycleWeapon(1);
        tapPoint=null;
      }

      updatePlatforms(dt);   // must lead: riders are carried before they move themselves
      updatePhil(dt);
      updateEnemies(dt);
      // Boss Rush difficulty ramp: run the boss on a faster clock as the run goes
      // on. One call site speeds up movement, attack timers and recovery windows
      // for all 12 bosses without touching any individual boss AI.
      updateBoss(G.mode==='RUSH'?dt*rush.speed:dt);
      updateProjs(dt);
      updatePickups(dt);
      updateHazards(dt);
      updateTutorial(dt);    // after the world moves: steps read the settled state
      updateTraining(dt);
      updateCam(dt);
      updateParts(dt);
    }
  }

  // Screen shake
  let sx=0,sy=0;
  if(shake>0){ shake-=dt*3; sx=(Math.random()-.5)*10*shake; sy=(Math.random()-.5)*10*shake; }
  ctx.save(); ctx.translate(sx,sy);

  drawBackground();
  drawPlatforms();
  drawDecorations();
  drawHazards();

  // Flags
  if(levelData.checkX&&!levelData.isBoss)
    drawFlag(levelData.checkX,levelData.checkY-80,checkActivated?'#2255cc':'#3366ff',checkActivated);
  if(levelData.flagX&&!levelData.isBoss)
    drawFlag(levelData.flagX,levelData.flagY-80,'#dd1111',true);
  drawSecretDoor();
  drawSecretKey();
  if(train) trainDef().draw();

  // Shockwaves (drawn before entities)
  if(boss&&boss.shockwaves){
    for(const sw of boss.shockwaves){
      const swx=sw.x-cam.x, swy=(sw.y||GROUND_Y-18)-cam.y;
      ctx.fillStyle=sw.color||'rgba(255,180,50,0.35)'; ctx.fillRect(swx,swy,sw.w,sw.h||18);
    }
  }

  drawBoss();
  drawShrinkRay();
  drawProjectiles();
  drawPickups();
  drawParts();

  // Draw enemies
  for(const e of enemies){
    if(e.dead&&e.deathTimer<=0) continue;
    ctx.save();
    if(e.dead) ctx.globalAlpha=Math.max(0,e.deathTimer/1.2);
    const cfg=ENEMY_CFG[e.type]||ENEMY_CFG.soldier;
    drawStickman(e.x,e.y,e.w,e.h,{
      facingR:e.facingR, walkCycle:e.walkCycle,
      attacking:e.type==='heavy'&&e.aiState==='ATTACK', atkTimer:e.stateTimer, atkDur:0.8,
      shielding:e.type==='heavy'&&!e.guardOpen,
      color:cfg.color,
      swordColor:e.type==='heavy'?'#bba56a':'#888', shieldColor:cfg.shieldColor, invTimer:0,
      dead:e.dead, isPlayer:false, scale:e.type==='heavy'?1.08:(e.type==='glider'?0.95:1),
      isArcher:e.type==='archer',
      health:e.health, maxHealth:e.maxHealth,
      type:e.type,
    });
    ctx.restore();
  }

  // Draw Phil
  if(!phil.dead||phil.deathTimer>0){
    if(!phil.dead) drawPhilAura();
    ctx.save();
    if(phil.dead) ctx.globalAlpha=Math.max(0,phil.deathTimer/1.8);
    drawStickman(phil.x,phil.y,phil.w,phil.h,{
      facingR:phil.facingR, walkCycle:phil.walkCycle,
      attacking:phil.attacking, atkTimer:phil.atkTimer, atkDur:curWeapon().dur||ATK_DUR,
      shielding:phil.shielding,
      color:skinDef().color, swordColor:skinDef().sword,
      invTimer:phil.invTimer, dead:phil.dead,
      isPlayer:true, scale:1, skin:currentSkin,
      // The shrink ray overrides the attack button, so Phil shouldn't be
      // brandishing a bazooka he currently can't fire
      weapon:hasRay?'sword':shop.equipped, boomOut:phil.boomOut, fireFx:phil.fireFx,
      cloak:shop.cloak, martial:!hasRay&&martialActive(), airborne:!phil.onGround,
      shield:shop.shield, charges:phil.shieldCharges,
    });
    ctx.restore();
  }

  ctx.restore(); // end shake

  drawDarkness();
  drawHUD();
  drawDialogue();
  if(paused) drawPauseMenu();
}

requestAnimationFrame(ts=>{ lastT=ts; requestAnimationFrame(loop); });
</script>
</body>
</html>
