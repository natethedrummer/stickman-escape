const STAR_POS = Array.from({length:120},(_,i)=>({x:Math.sin(i*7.3)*.5+.5,y:Math.sin(i*13.7)*.5+.5,r:.5+(i%3)*.5}));
const TREE_POS_FAR  = Array.from({length:25},(_,i)=>({x:i*200+80,scale:.5+Math.sin(i*3.7)*.2}));
const TREE_POS_NEAR = Array.from({length:20},(_,i)=>({x:i*250+130,scale:.7+Math.sin(i*2.9)*.25}));
const BIRD_POS = Array.from({length:10},(_,i)=>({
  x: i*197+40,
  y: 46+((i*71)%128),
  scale: .85+((i*29)%70)/100,
  speed: .22+((i*17)%36)/100,
  phase: i*1.9
}));
// Birds only fly in worlds that have an open sky — not the factory smog or underground mines.
const BIRD_SKIES = {
  forest: { tint:'rgba(18,34,22,0.72)',   count:8 },
  desert: { tint:'rgba(86,44,12,0.72)',   count:6 },
  snow:   { tint:'rgba(74,94,128,0.72)',  count:5 },
  berlin: { tint:'rgba(12,18,34,0.72)',   count:4 },
};

function drawPineTree(x,y,scale,col){
  ctx.fillStyle=col;
  // Trunk
  ctx.fillRect(x-3*scale,y,6*scale,18*scale);
  // Canopy layers
  [[0,-8,22],[0,-22,18],[0,-34,14]].forEach(([ox,oy,r])=>{
    ctx.beginPath(); ctx.moveTo(x+ox*scale,y+oy*scale);
    ctx.lineTo(x+(ox-r)*scale,y+(oy+r)*scale);
    ctx.lineTo(x+(ox+r)*scale,y+(oy+r)*scale);
    ctx.closePath(); ctx.fill();
  });
}
function drawDune(x,y,w,h,col){
  ctx.fillStyle=col;
  ctx.beginPath(); ctx.moveTo(x,y+h);
  ctx.quadraticCurveTo(x+w/2,y-h,x+w,y+h); ctx.closePath(); ctx.fill();
}
function drawCactus(x,y,scale,col){
  ctx.fillStyle=col;
  // Main trunk
  ctx.fillRect(x-5*scale,y-45*scale,10*scale,45*scale);
  // Left arm
  ctx.fillRect(x-20*scale,y-28*scale,15*scale,8*scale);
  ctx.fillRect(x-25*scale,y-40*scale,8*scale,14*scale);
  // Right arm
  ctx.fillRect(x+5*scale,y-22*scale,15*scale,8*scale);
  ctx.fillRect(x+17*scale,y-35*scale,8*scale,15*scale);
}

function drawSnowPine(x,y,scale,col){
  drawPineTree(x,y,scale,col);
  ctx.fillStyle='rgba(255,255,255,0.88)';
  [[0,-10,22],[0,-24,18],[0,-36,14]].forEach(([ox,oy,r])=>{
    ctx.beginPath();
    ctx.moveTo(x+ox*scale,y+(oy+3)*scale);
    ctx.lineTo(x+(ox-r*0.8)*scale,y+(oy+r*0.55)*scale);
    ctx.lineTo(x+(ox+r*0.8)*scale,y+(oy+r*0.55)*scale);
    ctx.closePath();
    ctx.fill();
  });
}

function drawIceCrystal(x,y,scale,col){
  ctx.save();
  ctx.translate(x,y-24*scale);
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.moveTo(0,-26*scale);
  ctx.lineTo(10*scale,-6*scale);
  ctx.lineTo(6*scale,26*scale);
  ctx.lineTo(-6*scale,26*scale);
  ctx.lineTo(-10*scale,-6*scale);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.4)';
  ctx.fillRect(-2*scale,-18*scale,3*scale,34*scale);
  ctx.restore();
}

function drawPipe(x,y,scale,col){
  ctx.fillStyle=col;
  ctx.fillRect(x-12*scale,y-42*scale,24*scale,42*scale);
  ctx.fillStyle='#7f8790';
  ctx.fillRect(x-15*scale,y-46*scale,30*scale,8*scale);
  ctx.fillRect(x-15*scale,y-8*scale,30*scale,8*scale);
}

function drawGearPole(x,y,scale,col){
  ctx.fillStyle=col;
  ctx.fillRect(x-4*scale,y-48*scale,8*scale,48*scale);
  ctx.strokeStyle='#adb5bf';
  ctx.lineWidth=3*scale;
  ctx.beginPath(); ctx.arc(x,y-28*scale,12*scale,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(x,y-28*scale,5*scale,0,Math.PI*2); ctx.stroke();
}

function drawStalagmite(x,y,scale,col){
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.moveTo(x,y-44*scale);
  ctx.lineTo(x+16*scale,y);
  ctx.lineTo(x-16*scale,y);
  ctx.closePath();
  ctx.fill();
}

function drawLantern(x,y,scale,col){
  ctx.fillStyle='#4a3625';
  ctx.fillRect(x-2*scale,y-50*scale,4*scale,18*scale);
  ctx.fillStyle=col;
  ctx.fillRect(x-10*scale,y-34*scale,20*scale,20*scale);
  ctx.fillStyle='rgba(255,220,120,0.7)';
  ctx.fillRect(x-6*scale,y-30*scale,12*scale,12*scale);
}

function drawStreetlight(x,y,scale,col){
  ctx.fillStyle=col;
  ctx.fillRect(x-3*scale,y-55*scale,6*scale,55*scale);
  ctx.fillRect(x-3*scale,y-55*scale,18*scale,6*scale);
  ctx.fillStyle='rgba(255,238,180,0.8)';
  ctx.fillRect(x+12*scale,y-47*scale,10*scale,8*scale);
}

function drawBollard(x,y,scale,col){
  ctx.fillStyle=col;
  ctx.fillRect(x-5*scale,y-20*scale,10*scale,20*scale);
  ctx.fillStyle='#ff4444';
  ctx.fillRect(x-5*scale,y-16*scale,10*scale,4*scale);
}

function drawAntenna(x,y,scale,col){
  ctx.fillStyle=col;
  ctx.fillRect(x-2*scale,y-52*scale,4*scale,52*scale);
  ctx.fillStyle='#dde5ef';
  ctx.fillRect(x-8*scale,y-44*scale,16*scale,3*scale);
  ctx.fillRect(x-6*scale,y-30*scale,12*scale,3*scale);
  ctx.fillRect(x-4*scale,y-18*scale,8*scale,3*scale);
}

function drawBird(x,y,scale,flap){
  const span=11*scale, lift=flap*7*scale;
  ctx.beginPath();
  ctx.moveTo(x-span,y);
  ctx.quadraticCurveTo(x-span*.5,y-lift,x,y);
  ctx.quadraticCurveTo(x+span*.5,y-lift,x+span,y);
  ctx.lineWidth=Math.max(1.4,2.2*scale);
  ctx.stroke();
}

function drawBirds(bg){
  ctx.strokeStyle=bg.tint; ctx.lineCap='round';
  const wrap=W+150;
  for(let i=0;i<bg.count;i++){
    const b=BIRD_POS[i];
    const bx=((b.x+frameN*b.speed-cam.x*.06)%wrap+wrap)%wrap-75;
    const by=b.y+Math.sin(frameN*.02+b.phase)*5;
    drawBird(bx,by,b.scale,Math.sin(frameN*.14+b.phase));
  }
  ctx.lineCap='butt';
}

function drawBackground(){
  const w=WORLDS[G.world];
  // Sky gradient
  const gr=ctx.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,w.skyT); gr.addColorStop(1,w.skyB);
  ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);

  // Birds drift across the sky behind the scenery
  const birdSky=BIRD_SKIES[w.bgName];
  if(birdSky) drawBirds(birdSky);

  if(w.bgName==='forest'){
    // Stars
    ctx.fillStyle='rgba(255,255,255,0.5)';
    STAR_POS.forEach(s=>{ const sx=((s.x*5000-cam.x*0.05)%W+W)%W; ctx.beginPath(); ctx.arc(sx,s.y*H*.5,s.r,0,Math.PI*2); ctx.fill(); });
    // Far trees
    TREE_POS_FAR.forEach(t=>{ const tx=((t.x-cam.x*.1)%(TREE_POS_FAR.length*200)+TREE_POS_FAR.length*200)%W-60; drawPineTree(tx,GROUND_Y-cam.y-20,t.scale,'#1a4a0a'); });
    // Near trees
    TREE_POS_NEAR.forEach(t=>{ const tx=((t.x-cam.x*.3)%(TREE_POS_NEAR.length*250)+TREE_POS_NEAR.length*250)%W-60; drawPineTree(tx,GROUND_Y-cam.y-10,t.scale,'#2a6a14'); });
  } else if(w.bgName==='desert'){
    // Dunes far
    for(let i=0;i<8;i++){ const dx=((i*300-cam.x*.1)%(8*300)+8*300)%W-60; drawDune(dx,H-80,260,60,'#a07030'); }
    for(let i=0;i<6;i++){ const dx=((i*380-cam.x*.25)%(6*380)+6*380)%W-80; drawDune(dx,H-60,300,50,'#b88040'); }
  } else if(w.bgName==='snow'){
    ctx.fillStyle='rgba(255,255,255,0.65)';
    STAR_POS.forEach(s=>{ const sx=((s.x*5200-cam.x*0.08)%W+W)%W; ctx.fillRect(sx,s.y*H*.62,1+s.r,1+s.r); });
    for(let i=0;i<6;i++){
      const mx=((i*260-cam.x*.08)%(6*260)+6*260)%W-120;
      ctx.fillStyle=i%2?'#99afd0':'#7a90b4';
      ctx.beginPath(); ctx.moveTo(mx,H-120); ctx.lineTo(mx+120,H-310); ctx.lineTo(mx+240,H-120); ctx.closePath(); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.8)';
      ctx.beginPath(); ctx.moveTo(mx+80,H-185); ctx.lineTo(mx+120,H-310); ctx.lineTo(mx+160,H-185); ctx.closePath(); ctx.fill();
    }
    for(let i=0;i<4;i++){
      const dx=((i*320-cam.x*.18)%(4*320)+4*320)%W-80;
      drawDune(dx,H-45,300,26,'rgba(240,248,255,0.95)');
    }
  } else if(w.bgName==='factory'){
    ctx.fillStyle='rgba(30,24,38,0.9)';
    for(let i=0;i<7;i++){
      const bx=((i*180-cam.x*.08)%(7*180)+7*180)%W-40;
      ctx.fillRect(bx,H-180,90,140);
      ctx.fillStyle='rgba(120,150,160,0.18)';
      for(let r=0;r<4;r++) for(let c=0;c<3;c++) ctx.fillRect(bx+12+c*22,H-165+r*24,10,12);
      ctx.fillStyle='rgba(30,24,38,0.9)';
    }
    for(let i=0;i<4;i++){
      const sx=((i*260-cam.x*.18)%(4*260)+4*260)%W-40;
      ctx.fillStyle='#444b58'; ctx.fillRect(sx,H-230,28,190);
      ctx.fillStyle='rgba(160,160,160,0.22)';
      ctx.beginPath(); ctx.arc(sx+14,H-240-((frameN+i*20)%30),16,0,Math.PI*2); ctx.fill();
    }
  } else if(w.bgName==='mines'){
    ctx.fillStyle='rgba(0,0,0,0.28)';
    for(let i=0;i<6;i++){
      const ox=((i*220-cam.x*.08)%(6*220)+6*220)%W-80;
      ctx.beginPath(); ctx.moveTo(ox,H); ctx.lineTo(ox+70,H-220); ctx.lineTo(ox+150,H); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(ox+60,0); ctx.lineTo(ox+130,170); ctx.lineTo(ox+200,0); ctx.closePath(); ctx.fill();
    }
    for(let i=0;i<10;i++){
      const cx=((i*120-cam.x*.15)%(10*120)+10*120)%W-20;
      ctx.fillStyle=i%2?'rgba(120,255,220,0.18)':'rgba(180,120,255,0.12)';
      ctx.beginPath(); ctx.moveTo(cx,H-80); ctx.lineTo(cx+10,H-120); ctx.lineTo(cx+18,H-82); ctx.closePath(); ctx.fill();
    }
  } else if(w.bgName==='berlin'){
    ctx.fillStyle='rgba(18,22,32,0.9)';
    for(let i=0;i<9;i++){
      const bx=((i*140-cam.x*.12)%(9*140)+9*140)%W-30;
      const bh=70+(i%4)*38;
      ctx.fillRect(bx,H-80-bh,95,bh);
      ctx.fillStyle='rgba(255,220,140,0.18)';
      for(let r=0;r<4;r++) for(let c=0;c<3;c++) ctx.fillRect(bx+12+c*24,H-68-bh+r*18,12,10);
      ctx.fillStyle='rgba(18,22,32,0.9)';
    }
    const towerX=((520-cam.x*.2)%W+W)%W;
    ctx.fillStyle='#b7c4d4';
    ctx.fillRect(towerX,H-250,4,170);
    ctx.beginPath(); ctx.arc(towerX+2,H-260,18,0,Math.PI*2); ctx.fill();
    ctx.fillRect(towerX-18,H-300,40,6);
  }
}

function drawPlatforms(){
  const w=WORLDS[G.world];
  for(const p of levelData.plats){
    if(p.gone) continue;
    const wob=p.mv&&p.mv.wob||0;
    const px=p.x-cam.x+wob, py=p.y-cam.y;
    if(px+p.w<0||px>W) continue;
    ctx.fillStyle=w.platFill; ctx.fillRect(px,py,p.w,p.h);
    ctx.fillStyle=w.platTop; ctx.fillRect(px,py,p.w,4);
    ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(px,py+p.h-3,p.w,3);
    // Decorative dots/grass on forest platforms
    if(G.world===1&&p.y<GROUND_Y){
      ctx.fillStyle='#5ab025';
      for(let i=0;i<Math.floor(p.w/20);i++) ctx.fillRect(px+5+i*20,py-3,3,3);
    } else if(G.world===3){
      ctx.fillStyle='rgba(255,255,255,0.95)';
      for(let i=0;i<Math.floor(p.w/24);i++) ctx.fillRect(px+6+i*24,py-4,10,4);
    } else if(G.world===4){
      ctx.fillStyle='rgba(255,180,80,0.35)';
      for(let i=0;i<Math.floor(p.w/34);i++) ctx.fillRect(px+8+i*34,py+4,6,6);
    } else if(G.world===5){
      ctx.fillStyle='rgba(120,255,220,0.3)';
      for(let i=0;i<Math.floor(p.w/42);i++) ctx.fillRect(px+12+i*42,py+4,4,8);
    } else if(G.world===6){
      ctx.fillStyle='rgba(255,255,255,0.25)';
      for(let i=0;i<Math.floor(p.w/50);i++) ctx.fillRect(px+10+i*50,py+5,18,2);
    }
    if(p.mv) drawMoverMarkings(p,px,py);
  }
}

// A moving platform has to be readable as one *before* you jump onto it, so each
// kind gets its own marking: travel arrows for sliders and elevators, cracks for
// the ones that give way.
function drawMoverMarkings(p,px,py){
  const m=p.mv, cx=px+p.w/2, mid=py+p.h/2;
  ctx.save();
  if(m.kind==='fall'){
    ctx.strokeStyle=m.state==='idle'?'rgba(255,215,120,0.75)':'rgba(255,120,90,0.95)';
    ctx.lineWidth=1.6;
    for(let i=0;i<Math.max(2,Math.floor(p.w/28));i++){
      const zx=px+14+i*28;
      ctx.beginPath();
      ctx.moveTo(zx,py+3); ctx.lineTo(zx-4,mid); ctx.lineTo(zx+3,py+p.h-2);
      ctx.stroke();
    }
  } else {
    const horiz=m.kind==='h';
    ctx.fillStyle='rgba(255,235,150,0.85)';
    // Two arrowheads pointing along the axis of travel
    for(const s of [-1,1]){
      ctx.beginPath();
      if(horiz){
        const ax=cx+s*(p.w/2-7);
        ctx.moveTo(ax+s*5,mid); ctx.lineTo(ax-s*3,mid-5); ctx.lineTo(ax-s*3,mid+5);
      } else {
        const ay=mid+s*7;
        ctx.moveTo(cx,ay+s*5); ctx.lineTo(cx-5,ay-s*2); ctx.lineTo(cx+5,ay-s*2);
      }
      ctx.closePath(); ctx.fill();
    }
    // Faint rail showing the full span the platform covers
    ctx.strokeStyle='rgba(255,235,150,0.22)'; ctx.lineWidth=2;
    ctx.beginPath();
    if(horiz){ ctx.moveTo(m.min-cam.x+p.w/2,mid); ctx.lineTo(m.max-cam.x+p.w/2,mid); }
    else { ctx.moveTo(cx,m.min-cam.y+p.h/2); ctx.lineTo(cx,m.max-cam.y+p.h/2); }
    ctx.stroke();
  }
  ctx.restore();
}

function drawDecorations(){
  if(!levelData.decorations) return;
  const w=WORLDS[G.world];
  for(const d of levelData.decorations){
    const parallax=d.layer===0?0.1:0.25;
    const dx=d.x-cam.x*parallax;
    if(dx<-100||dx>W+100) continue;
    if(d.type==='tree') drawPineTree(dx,GROUND_Y-cam.y,d.scale,d.layer===0?'#1a4a0a':'#2a6a14');
    else if(d.type==='cactus') drawCactus(dx,GROUND_Y-cam.y,d.scale,d.layer===0?'#2a6a2a':'#3a8a3a');
    else if(d.type==='snowPine') drawSnowPine(dx,GROUND_Y-cam.y,d.scale,d.layer===0?'#46648a':'#5f7faa');
    else if(d.type==='iceCrystal') drawIceCrystal(dx,GROUND_Y-cam.y,d.scale,d.layer===0?'rgba(170,220,255,0.55)':'rgba(220,245,255,0.78)');
    else if(d.type==='pipe') drawPipe(dx,GROUND_Y-cam.y,d.scale,d.layer===0?'#4c5663':'#707b88');
    else if(d.type==='gearPole') drawGearPole(dx,GROUND_Y-cam.y,d.scale,d.layer===0?'#4d5661':'#8c97a2');
    else if(d.type==='stalagmite') drawStalagmite(dx,GROUND_Y-cam.y,d.scale,d.layer===0?'#56443c':'#7a6658');
    else if(d.type==='crystal') drawIceCrystal(dx,GROUND_Y-cam.y,d.scale,d.layer===0?'rgba(120,255,220,0.35)':'rgba(180,255,240,0.7)');
    else if(d.type==='lantern') drawLantern(dx,GROUND_Y-cam.y,d.scale,d.layer===0?'rgba(255,215,130,0.45)':'rgba(255,226,150,0.75)');
    else if(d.type==='streetlight') drawStreetlight(dx,GROUND_Y-cam.y,d.scale,d.layer===0?'#57616d':'#8e99a6');
    else if(d.type==='bollard') drawBollard(dx,GROUND_Y-cam.y,d.scale,d.layer===0?'#727981':'#c0c6ce');
    else if(d.type==='antenna') drawAntenna(dx,GROUND_Y-cam.y,d.scale,d.layer===0?'#5a6570':'#b2bcc8');
  }
}

function drawSawHazard(h,cx,cy){
  const track=h.track||{
    x:h.axis==='x'?h.min+h.w/2:h.x+h.w/2-2,
    y:h.axis==='x'?h.y+h.h/2-2:h.min+h.h/2,
    w:h.axis==='x'?Math.max(0,h.max-h.min):4,
    h:h.axis==='x'?4:Math.max(0,h.max-h.min)
  };
  const tx=track.x-cam.x, ty=track.y-cam.y;
  const toothCount=10;
  const innerR=Math.max(8,h.w/2-5);
  const outerR=innerR+5;

  ctx.fillStyle='#4f5660';
  ctx.fillRect(tx,ty,track.w,track.h);
  ctx.fillStyle='#8d96a1';
  if(h.axis==='x'){
    ctx.fillRect(tx,ty,track.w,2);
    ctx.fillRect(tx+2,ty+track.h-1,track.w-4,1);
  } else {
    ctx.fillRect(tx,ty,2,track.h);
    ctx.fillRect(tx+track.w-1,ty+2,1,track.h-4);
  }
  ctx.fillStyle='#394048';
  if(h.axis==='x'){
    ctx.fillRect(tx-4,ty-4,8,track.h+8);
    ctx.fillRect(tx+track.w-4,ty-4,8,track.h+8);
  } else {
    ctx.fillRect(tx-4,ty-4,track.w+8,8);
    ctx.fillRect(tx-4,ty+track.h-4,track.w+8,8);
  }

  ctx.save();
  ctx.globalAlpha=0.22;
  ctx.strokeStyle='rgba(220,230,255,0.5)';
  ctx.lineWidth=2;
  for(let i=0;i<3;i++){
    const offset=outerR+6+i*5;
    ctx.beginPath();
    if(h.axis==='x'){
      const dir=h.dir||1;
      ctx.moveTo(cx-dir*offset,cy-7+i*5);
      ctx.lineTo(cx-dir*(offset+7),cy-6+i*5);
    } else {
      const dir=h.dir||1;
      ctx.moveTo(cx-7+i*5,cy-dir*offset);
      ctx.lineTo(cx-6+i*5,cy-dir*(offset+7));
    }
    ctx.stroke();
  }
  ctx.restore();

  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(h.rot||0);
  ctx.beginPath();
  for(let i=0;i<toothCount*2;i++){
    const ang=i*Math.PI/toothCount;
    const r=i%2===0?outerR:innerR;
    const px=Math.cos(ang)*r, py=Math.sin(ang)*r;
    if(i===0) ctx.moveTo(px,py);
    else ctx.lineTo(px,py);
  }
  ctx.closePath();
  ctx.fillStyle='#b7bfc8';
  ctx.fill();
  ctx.strokeStyle='#626b75';
  ctx.lineWidth=2;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(0,0,innerR-3,0,Math.PI*2);
  ctx.fillStyle='#8b949f';
  ctx.fill();
  ctx.strokeStyle='#d5dce3';
  ctx.lineWidth=1.5;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(-2,-2,innerR-7,Math.PI*1.08,Math.PI*1.78);
  ctx.strokeStyle='rgba(255,255,255,0.32)';
  ctx.lineWidth=2;
  ctx.stroke();

  ctx.fillStyle='#535a63';
  ctx.beginPath();
  ctx.arc(0,0,5,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#d9e0e6';
  for(let i=0;i<4;i++){
    const ang=i*Math.PI/2+Math.PI/4;
    ctx.beginPath();
    ctx.arc(Math.cos(ang)*8,Math.sin(ang)*8,1.4,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawPitHazard(h,px,py){
  const depth=h.h+18;
  ctx.fillStyle='rgba(12,8,8,0.82)';
  ctx.fillRect(px,py+4,h.w,depth);
  ctx.fillStyle='rgba(0,0,0,0.22)';
  ctx.fillRect(px+3,py+depth-2,h.w-6,4);

  if(h.style==='lava'){
    ctx.fillStyle='#5a1e08';
    ctx.fillRect(px,py,h.w,4);
    ctx.fillRect(px,py+2,4,h.h+4);
    ctx.fillRect(px+h.w-4,py+2,4,h.h+4);

    ctx.save();
    ctx.shadowColor='rgba(255,120,20,0.45)';
    ctx.shadowBlur=10;
    ctx.fillStyle='#ff6a00';
    ctx.fillRect(px+4,py+3,h.w-8,9);
    ctx.restore();

    ctx.fillStyle='#ffb347';
    const bubbleCount=Math.max(2,Math.floor(h.w/28));
    for(let i=0;i<bubbleCount;i++){
      const t=h.pulse+i*1.35;
      const bx=bubbleCount===1?px+h.w/2:px+10+i*(h.w-20)/(bubbleCount-1);
      const rise=(Math.sin(t)+1)*1.6;
      const bw=4+((Math.sin(t*1.7)+1)*2);
      ctx.fillRect(bx-bw/2,py+5+rise,bw,2+(Math.cos(t*1.3)+1));
      ctx.fillStyle='rgba(255,235,150,0.38)';
      ctx.fillRect(bx-bw/3,py+3+rise,bw/1.5,1.5);
      ctx.fillStyle='#ffb347';
    }

    ctx.fillStyle='rgba(255,160,70,0.18)';
    ctx.fillRect(px+6,py-6,h.w-12,6);
    return;
  }

  ctx.fillStyle='#4a4f56';
  const spikeCount=Math.max(4,Math.floor(h.w/18));
  const spikeW=h.w/spikeCount;
  for(let i=0;i<spikeCount;i++){
    const sx=px+i*spikeW;
    const spikeH=12+((i%2)*4)+Math.sin(h.pulse+i*0.7)*1.5;
    ctx.beginPath();
    ctx.moveTo(sx,py+6);
    ctx.lineTo(sx+spikeW/2,py+6-spikeH);
    ctx.lineTo(sx+spikeW,py+6);
    ctx.closePath();
    ctx.fill();
  }
  ctx.fillStyle='#bcc4ce';
  for(let i=0;i<spikeCount;i++){
    const sx=px+i*spikeW;
    const spikeH=8+((i%2)*3);
    ctx.beginPath();
    ctx.moveTo(sx+2,py+5);
    ctx.lineTo(sx+spikeW/2,py+5-spikeH);
    ctx.lineTo(sx+spikeW/2+2,py+5);
    ctx.closePath();
    ctx.fill();
  }
  ctx.fillStyle='#272c31';
  ctx.fillRect(px,py+6,h.w,3);
}

function drawRockHazard(h,rx,ry){
  if(h.state==='spent'){
    const fade=Math.max(0,Math.min(1,(h.spentTimer||0)/0.35));
    const chunks=[
      {ox:-8,oy:h.h-4,w:10,h:8,tilt:-1},
      {ox:3,oy:h.h-7,w:12,h:9,tilt:1},
      {ox:13,oy:h.h-3,w:8,h:6,tilt:-1}
    ];
    ctx.save();
    ctx.globalAlpha=fade;
    for(const c of chunks){
      ctx.fillStyle='#7a624a';
      ctx.beginPath();
      ctx.moveTo(rx+c.ox,ry+c.oy+c.h);
      ctx.lineTo(rx+c.ox+c.w*0.2,ry+c.oy);
      ctx.lineTo(rx+c.ox+c.w,ry+c.oy+c.h*0.25);
      ctx.lineTo(rx+c.ox+c.w*0.75,ry+c.oy+c.h);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle='rgba(210,180,130,0.35)';
      ctx.fillRect(rx+c.ox+2,ry+c.oy+2,c.w*0.35,2);
    }
    ctx.restore();
    return;
  }

  const cx=rx+h.w/2, top=ry, bottom=ry+h.h;
  if(h.state!=='falling'){
    ctx.fillStyle='#6d5540';
    ctx.fillRect(cx-3,top-9,6,9);
    ctx.fillStyle='#957458';
    ctx.fillRect(cx-6,top-11,12,4);
  }

  ctx.beginPath();
  ctx.moveTo(cx,top+1);
  ctx.lineTo(rx+h.w*0.46,top+6);
  ctx.lineTo(rx+h.w*0.34,ry+h.h*0.42);
  ctx.lineTo(cx,bottom);
  ctx.lineTo(rx+h.w*0.16,ry+h.h*0.38);
  ctx.lineTo(rx+h.w*0.08,top+8);
  ctx.closePath();
  ctx.fillStyle='#7a624a';
  ctx.fill();
  ctx.strokeStyle='#4a392d';
  ctx.lineWidth=1.5;
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(cx-2,top+4);
  ctx.lineTo(rx+h.w*0.18,top+10);
  ctx.lineTo(rx+h.w*0.28,ry+h.h*0.36);
  ctx.lineTo(cx-3,bottom-5);
  ctx.closePath();
  ctx.fillStyle='#a78563';
  ctx.fill();

  ctx.strokeStyle='#5a4333';
  ctx.lineWidth=1.2;
  ctx.beginPath();
  ctx.moveTo(cx,ry+h.h*0.2);
  ctx.lineTo(cx-3,ry+h.h*0.46);
  ctx.lineTo(cx-1,bottom-7);
  ctx.moveTo(cx-1,ry+h.h*0.32);
  ctx.lineTo(cx+5,ry+h.h*0.48);
  ctx.stroke();

  if(h.state==='warning'){
    ctx.strokeStyle='rgba(245,230,200,0.55)';
    ctx.beginPath();
    ctx.moveTo(cx+2,ry+h.h*0.18);
    ctx.lineTo(cx+7,ry+h.h*0.34);
    ctx.lineTo(cx+4,ry+h.h*0.58);
    ctx.stroke();

    ctx.fillStyle='rgba(215,190,150,0.5)';
    for(let i=0;i<3;i++){
      const t=(ROCK_WARNING_DUR-(h.warningTimer||0))*7+i*0.9;
      const dustX=cx-5+i*4+Math.sin(t)*1.5;
      const dustY=top+6+i*5+Math.cos(t*1.4)*2;
      ctx.fillRect(dustX,dustY,2,2);
    }
  }
}

function drawHazards(){
  if(!hazards||!hazards.length) return;
  for(const h of hazards){
    if(h.type==='pit'){
      const px=h.x-cam.x, py=h.y-cam.y;
      if(px+h.w<0||px>W) continue;
      drawPitHazard(h,px,py);
      continue;
    }
    if(h.type==='saw'){
      const cx=h.x+h.w/2-cam.x, cy=h.y+h.h/2-cam.y;
      if(cx<-48||cx>W+48||cy<-48||cy>H+48) continue;
      drawSawHazard(h,cx,cy);
      continue;
    }
    if(h.type==='rock'){
      if(h.state==='spent'&&h.spentTimer<=0) continue;
      const wobble=h.state==='warning' ? h.wobble||0 : 0;
      const rx=h.x-cam.x+wobble, ry=h.y-cam.y;
      if(rx+h.w<0||rx>W||ry+h.h<0||ry>H) continue;
      drawRockHazard(h,rx,ry);
    }
  }
}

function heartPath(cx,cy){
  ctx.beginPath();
  ctx.arc(cx-4,cy,5,Math.PI*.8,Math.PI*.2,true);
  ctx.arc(cx+4,cy,5,Math.PI*.8,Math.PI*.2,true);
  ctx.lineTo(cx,cy+9); ctx.closePath();
}
// The equipped weapon, under the top-right of the HUD bar. It doubles as the
// touch control for swapping, and that is why it is not along the bottom: on a
// phone in landscape the control pad overlays canvas y 422-511, so a tap target
// down there competes with the jump button. Up here it is clear in every layout,
// and clear of the boss bar (x 330-630) and the power-up stack (top left).
const WEAPON_BOX = { x:W-172, y:54, w:162, h:36 };
function drawWeaponIcon(kind,cx,cy,scale){
  const col=(WEAPONS[kind]||KUNGFU_ATTACK).color;
  ctx.save(); ctx.translate(cx,cy); if(scale) ctx.scale(scale,scale);
  if(kind==='sword'){
    ctx.strokeStyle=col; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-8,7); ctx.lineTo(7,-8); ctx.stroke();
    ctx.strokeStyle='#8a6a3a'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(-10,9); ctx.lineTo(-5,4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-10,3); ctx.lineTo(-3,10); ctx.stroke();
  } else if(kind==='hammer'){
    ctx.strokeStyle='#6b4a22'; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-8,8); ctx.lineTo(4,-4); ctx.stroke();
    ctx.save(); ctx.translate(5,-5); ctx.rotate(-Math.PI/4);
    ctx.fillStyle=col; ctx.fillRect(-4,-6,9,12);
    ctx.strokeStyle='#5c3d17'; ctx.lineWidth=1.5; ctx.strokeRect(-4,-6,9,12);
    ctx.restore();
  } else if(kind==='boomerang'){
    ctx.strokeStyle=col; ctx.lineWidth=3.5; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(-8,6); ctx.lineTo(0,-8); ctx.lineTo(8,6); ctx.stroke();
  } else if(kind==='kungfu'){
    ctx.fillStyle=col;                              // a bare fist
    ctx.beginPath(); ctx.arc(1,0,7,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#8a836c'; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(-3,-3); ctx.lineTo(4,-3); ctx.moveTo(-3,1); ctx.lineTo(4,1); ctx.stroke();
    ctx.fillStyle='#1f2430'; ctx.fillRect(-9,-4,4,9);  // cuff
  } else {
    ctx.fillStyle='#4a5058'; ctx.fillRect(-10,-3,19,7);
    ctx.fillStyle=col; ctx.fillRect(-8,-3,5,7);
    ctx.fillStyle='#2c3138'; ctx.fillRect(8,-5,4,11); ctx.fillRect(-5,4,4,3);
  }
  ctx.restore();
}
function drawWeaponBox(){
  if(hasRay) return;                 // the shrink ray owns the attack button
  const b=WEAPON_BOX, wep=curWeapon();
  const many=ownedWeapons().length>1 && !martialActive();   // the gi ignores them
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(b.x,b.y,b.w,b.h);
  ctx.strokeStyle=wep.color; ctx.lineWidth=1.5; ctx.strokeRect(b.x+.5,b.y+.5,b.w-1,b.h-1);
  drawWeaponIcon(martialActive()?'kungfu':shop.equipped,b.x+20,b.y+18);
  ctx.textAlign='left'; ctx.fillStyle=wep.color; ctx.font='bold 12px monospace';
  ctx.fillText(wep.name,b.x+38,b.y+15);
  ctx.font='10px monospace';
  if(many){
    ctx.textAlign='right'; ctx.fillStyle='#8899aa';
    ctx.fillText(isTouchDevice?'TAP':'[C]',b.x+b.w-6,b.y+14);
    ctx.textAlign='left';
  }
  if(wep.ammoMax){
    // Rockets read as pips, not a number — an empty row is obvious at a glance
    for(let i=0;i<wep.ammoMax;i++){
      ctx.fillStyle=i<phil.ammo?'#ff9a4a':'#4a3a2a';
      ctx.fillRect(b.x+38+i*10,b.y+21,7,6);
    }
    if(phil.ammo<=0){ ctx.fillStyle='#ff7766'; ctx.fillText('EMPTY',b.x+38+wep.ammoMax*10+6,b.y+27); }
  } else {
    // Once you own more than one, the corner already says how to swap, so the
    // second line is better spent on the reason you would
    ctx.fillStyle='#889';
    ctx.fillText(wep.martial ? 'DMG 1  \u2022  AIR KICK 2'
                             : (many?('DAMAGE '+wep.dmg):'your trusty blade'),b.x+38,b.y+27);
  }
  ctx.textAlign='left';
}

// The instruction panel. It sits under the HUD bar rather than along the bottom
// because on a phone in landscape the control pad overlays the lower third of the
// canvas — and this is the one thing in the game that must always be readable.
function drawKeyCap(label,x,y){
  ctx.font='bold 12px monospace';
  const w=Math.max(26,ctx.measureText(label).width+16), h=22;
  ctx.fillStyle='rgba(120,200,255,0.16)';
  ctx.fillRect(x,y,w,h);
  ctx.strokeStyle='#7fd0ff'; ctx.lineWidth=1.5; ctx.strokeRect(x+.5,y+.5,w-1,h-1);
  ctx.fillStyle='#dff2ff'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(label,x+w/2,y+h/2+1);
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  return w;
}

function wrapLine(text,maxW,font){
  ctx.font=font;
  const out=[]; let line='';
  for(const word of text.split(' ')){
    const next=line?line+' '+word:word;
    if(line&&ctx.measureText(next).width>maxW){ out.push(line); line=word; }
    else line=next;
  }
  if(line) out.push(line);
  return out;
}

function drawTutorialPanel(){
  if(!tut||paused) return;      // the pause menu owns the screen; PAUSED sits here
  const s=tutStep();
  if(!s) return;
  const caps = isTouchDevice ? s.touch : s.keys;
  const bw=560, bx=(W-bw)/2, by=58;
  const text = typeof s.body==='function' ? s.body() : s.body;
  const body=wrapLine(text,bw-36,'13px monospace');
  const bh=52+body.length*17+(caps.length?30:6);

  ctx.fillStyle='rgba(6,14,22,0.88)'; ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle='#7fd0ff'; ctx.lineWidth=2; ctx.strokeRect(bx+1,by+1,bw-2,bh-2);
  // Progress rail along the top edge — how far through the drills you are
  const done=tut.i/(TUT_STEPS.length-1);
  ctx.fillStyle='rgba(127,208,255,0.25)'; ctx.fillRect(bx+2,by+2,bw-4,3);
  ctx.fillStyle='#7fd0ff'; ctx.fillRect(bx+2,by+2,(bw-4)*done,3);

  ctx.textAlign='center';
  ctx.fillStyle='#ffffff'; ctx.font='bold 17px monospace';
  ctx.fillText(s.title,W/2,by+30);
  ctx.fillStyle='#a9c4d4'; ctx.font='13px monospace';
  body.forEach((l,i)=>ctx.fillText(l,W/2,by+50+i*17));
  ctx.textAlign='left';

  if(caps.length){
    const gap=8;
    ctx.font='bold 12px monospace';
    const widths=caps.map(c=>Math.max(26,ctx.measureText(c).width+16));
    let cx=W/2-(widths.reduce((a,b)=>a+b,0)+gap*(caps.length-1))/2;
    const cy=by+bh-28;
    caps.forEach((c,i)=>{ drawKeyCap(c,cx,cy); cx+=widths[i]+gap; });
  }

  // "Got it!" confirmation, floating just under the panel
  if(tut.flashT>0){
    ctx.globalAlpha=Math.min(1,tut.flashT*1.8);
    ctx.textAlign='center';
    ctx.fillStyle='#8fe08a'; ctx.font='bold 16px monospace';
    ctx.fillText(tut.flash,W/2,by+bh+22);
    ctx.globalAlpha=1; ctx.textAlign='left';
  }
}

function drawTutorialDone(){
  ctx.fillStyle='rgba(4,10,16,0.9)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.save();
  ctx.shadowColor='#44ff88'; ctx.shadowBlur=20;
  ctx.fillStyle='#7dffb0'; ctx.font='bold 46px monospace';
  ctx.fillText("YOU'RE READY",W/2,124);
  ctx.restore();
  ctx.fillStyle='#a9c4d4'; ctx.font='15px monospace';
  ctx.fillText('That is everything Phil can do. The rest is up to you.',W/2,158);

  const rows=[
    ['Move and jump','Cross gaps, climb to high platforms'],
    ['Attack','Two hits beats a soldier; big ones take more'],
    ['Shield', curShield().allAngles ? 'Yours covers every side; a plain one is front only'
                                     : 'Only stops arrows hitting Phil at the front'],
    ['Five hearts','Every hit costs half — ten hits and you are out'],
    ['Blue flag','Checkpoint. Die after it and you restart there'],
    ['Red flag','The end of the level'],
  ];
  rows.forEach((r,i)=>{
    const y=200+i*38;
    ctx.fillStyle='rgba(127,208,255,0.09)'; ctx.fillRect(W/2-290,y-20,580,32);
    ctx.textAlign='right';
    ctx.fillStyle='#7fd0ff'; ctx.font='bold 14px monospace';
    ctx.fillText(r[0],W/2-30,y);
    ctx.textAlign='left';
    ctx.fillStyle='#c9d8e2'; ctx.font='13px monospace';
    ctx.fillText(r[1],W/2-10,y);
  });

  ctx.textAlign='center';
  if(Math.sin(frameN*.07)>0){
    ctx.fillStyle='#ffffff'; ctx.font='bold 17px monospace';
    ctx.fillText(isTouchDevice?'TAP TO START':'PRESS ENTER TO START',W/2,H-30);
  }
  ctx.textAlign='left';
}

function drawHUD(){
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,W,48);
  // Hearts
  ctx.font='bold 13px monospace'; ctx.fillStyle='#cc4444'; ctx.textAlign='left'; ctx.fillText('HP:',10,20);
  for(let i=0;i<5;i++){
    const val=phil.health-i;
    const hx=48+i*30, hy=16;
    if(val>=1){ ctx.fillStyle='#ff3333'; heartPath(hx,hy); ctx.fill(); }
    else if(val>=.5){
      ctx.fillStyle='#441111'; heartPath(hx,hy); ctx.fill();
      ctx.save(); ctx.beginPath(); ctx.rect(hx-14,hy-14,14,28); ctx.clip();
      ctx.fillStyle='#ff3333'; heartPath(hx,hy); ctx.fill(); ctx.restore();
    } else { ctx.fillStyle='#441111'; heartPath(hx,hy); ctx.fill(); }
    ctx.strokeStyle='#880000'; ctx.lineWidth=1.5; heartPath(hx,hy); ctx.stroke();
  }
  // Score
  ctx.fillStyle='#ffd700'; ctx.font='bold 14px monospace'; ctx.textAlign='left';
  ctx.fillText('SCORE: '+G.score,curShield().charges?245:200,20);
  // Lives
  ctx.fillStyle='#88aaff'; ctx.font='bold 13px monospace';
  ctx.fillText('LIVES: '+G.lives,360,20);
  // Carrying the secret key
  if(hasKey){
    ctx.save();
    ctx.shadowColor='#ffd54a'; ctx.shadowBlur=8;
    ctx.fillStyle='#ffd54a'; ctx.font='bold 13px monospace';
    ctx.fillText('⚷ KEY',462,20);
    ctx.restore();
  }
  // Magic shield charges, right of the hearts so they read as a second health bar
  if(phil.shieldCharges>0||curShield().charges){
    const cx0=200;
    ctx.fillStyle='#8f6ad6'; ctx.font='bold 11px monospace';
    ctx.fillText('\u25c8',cx0-14,20);
    for(let i=0;i<(curShield().charges||0);i++){
      ctx.fillStyle=i<phil.shieldCharges?'#c9a8ff':'#3a2f4d';
      ctx.fillRect(cx0+i*9,11,7,9);
    }
  }
  // Coins
  ctx.fillStyle='#ffd700'; ctx.font='bold 13px monospace';
  ctx.beginPath(); ctx.ellipse(560,15,5,6,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#c8930a'; ctx.beginPath(); ctx.ellipse(560,15,2.4,4,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ffd700'; ctx.fillText(String(shop.coins),570,20);
  // Level indicator
  ctx.textAlign='center'; ctx.fillStyle='#ccaaff'; ctx.font='12px monospace';
  const isBoss=(G.level===5||G.level===10);
  if(tut){
    ctx.fillStyle='#7fd0ff';
    ctx.fillText(`HOW TO PLAY  -  STEP ${Math.min(tut.i+1,TUT_STEPS.length)} OF ${TUT_STEPS.length}`,W/2,38);
  } else if(train){
    ctx.fillStyle='#ffd54a';
    ctx.fillText('★ TRAINING DRILL ★',W/2,38);
  } else if(secretRun){
    ctx.fillStyle='#ffd54a';
    ctx.fillText(`★ SECRET AREA - ${SECRET_META[secretRun.theme].name} ★`,W/2,38);
  } else if(G.mode==='RUSH'){
    const meta=getBossMeta(boss?.type||rush.queue[rush.idx]);
    ctx.fillStyle='#ffbb55';
    ctx.fillText(`★ BOSS RUSH - ${Math.min(rush.idx+1,RUSH_TOTAL)} / ${RUSH_TOTAL} - ${(meta.name||'BOSS').toUpperCase()}`,W/2,38);
  } else {
    ctx.fillText((G.screen==='FINAL_BOSS_INTRO'||boss?.type==='mech')?'★ FINAL BOSS ★':`WORLD ${G.world} - ${WORLDS[G.world].name} - LEVEL ${G.level}${isBoss?' ⚠ BOSS':''} `,W/2,38);
  }
  drawWeaponBox();

  // Controls hint
  const controlsHint=ownedWeapons().length>1
    ? 'A/D: Move   W/Space: Jump   Z: Attack   X: Shield   C: Swap weapon   Esc: Pause'
    : 'A/D: Move   W/Space: Jump   Z: Sword   X: Shield   Esc: Pause';
  ctx.font='bold 10px monospace';
  const hintW=ctx.measureText(controlsHint).width;
  ctx.fillStyle='rgba(0,0,0,0.45)';
  ctx.fillRect(W/2-hintW/2-8,H-19,hintW+16,15);
  ctx.fillStyle='rgba(245,245,255,0.92)';
  ctx.fillText(controlsHint,W/2,H-8);
  ctx.textAlign='left';

  // Active power-ups — stacked under the HP row, left of the boss bar's centre
  let puRow=0;
  for(const t of PU_ORDER){
    const def=POWERUPS[t], left=phil[def.hud];
    if(!left||left<=0) continue;
    const bx=10, by=54+puRow*20, bw=118, bh=15;
    ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(bx,by,bw,bh);
    // Bar drains over the power-up's full duration; blinks under 1.5s left
    const frac=Math.max(0,Math.min(1,left/def.dur));
    ctx.globalAlpha=(left<1.5&&Math.floor(left*8)%2)?0.35:1;
    ctx.fillStyle=def.color; ctx.fillRect(bx,by,bw*frac,bh);
    // The label sits across both the filled and drained halves of the bar, so it
    // gets a dark outline rather than a flat colour that only works on one of them.
    ctx.font='bold 10px monospace'; ctx.textAlign='center';
    ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,0.8)'; ctx.lineJoin='round';
    const label=def.name+'  '+left.toFixed(1)+'s';
    ctx.strokeText(label,bx+bw/2,by+11);
    ctx.fillStyle='#fff'; ctx.fillText(label,bx+bw/2,by+11);
    ctx.globalAlpha=1; ctx.textAlign='left'; ctx.lineWidth=1;
    puRow++;
  }

  // Boss health bar — repurposed as a shrink gauge once the finale starts, since
  // health means nothing when the fight is about size
  if(boss&&!boss.dead){
    const shrinking=boss.type==='mech'&&boss.phase===3&&boss.aiState!=='FLEE';
    const bw=300, bh=14, bx=(W-bw)/2, by=54;
    ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(bx-2,by-2,bw+4,bh+4);
    ctx.fillStyle=shrinking?'#1b1030':'#330000'; ctx.fillRect(bx,by,bw,bh);
    const pct=shrinking ? Math.max(0,1-boss.shrinkHits/SHRINK_HITS)
                        : Math.max(0,boss.health/boss.maxHealth);
    const bcol=shrinking?'#7dfcff':(pct>.5?'#ee2222':pct>.25?'#ee8800':'#ffdd00');
    ctx.fillStyle=bcol; ctx.fillRect(bx,by,bw*pct,bh);
    // The label crosses both the filled and empty halves of the bar, so it needs
    // an outline rather than a flat colour that only works against one of them
    const blabel=shrinking?'SHRINK THE MECH — Z TO FIRE'
      :(boss.aiState==='FLEE'?'FINISH IT!':getBossMeta(boss.type).name);
    ctx.font='bold 11px monospace'; ctx.textAlign='center';
    ctx.lineWidth=3; ctx.lineJoin='round'; ctx.strokeStyle='rgba(0,0,0,0.85)';
    ctx.strokeText(blabel,W/2,by+10);
    ctx.fillStyle='#fff'; ctx.fillText(blabel,W/2,by+10);
    ctx.lineWidth=1; ctx.textAlign='left';
  }

  // Combo indicator
  if(combo>=2){
    const cx2=W/2, cy2=H-30;
    const frac=Math.min(1,comboTimer/COMBO_WINDOW);
    const col=combo>=5?'#ff88ff':combo>=3?'#ffaa00':'#ffdd44';
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(cx2-60,cy2-18,120,8);
    ctx.fillStyle=col; ctx.fillRect(cx2-60,cy2-18,120*frac,8);
    ctx.fillStyle=col; ctx.font='bold 16px monospace'; ctx.textAlign='center';
    ctx.shadowColor=col; ctx.shadowBlur=8;
    ctx.fillText('COMBO ×'+combo,cx2,cy2-22); ctx.shadowBlur=0;
    ctx.textAlign='left';
  }

  // Checkpoint indicator
  if(levelData.checkX&&!levelData.isBoss){
    ctx.fillStyle=checkActivated?'rgba(70,150,255,0.8)':'rgba(100,100,150,0.5)';
    ctx.font='11px monospace'; ctx.textAlign='right';
    ctx.fillText(checkActivated?'CHECKPOINT ✓':'CHECKPOINT',W-10,20);
    ctx.textAlign='left';
  }

  drawTutorialPanel();
  drawTrainingHUD();
}

function drawSecretKey(){

  ctx.beginPath(); ctx.arc(kx+9,ky+6,6,0,Math.PI*2); ctx.fill();      // bow
  ctx.fillStyle='#2a2410';
  ctx.beginPath(); ctx.arc(kx+9,ky+6,2.4,0,Math.PI*2); ctx.fill();    // hole
  ctx.fillStyle='#ffd54a';

function drawSecretDoor(){
  const d=levelData.door;
  if(!d) return;
  const dx=d.x-cam.x, dy=d.y-cam.y;
  ctx.save();
  if(hasKey){
    ctx.globalAlpha=0.3+Math.sin(frameN*0.1)*0.14;
    ctx.fillStyle='#ffd54a';
    ctx.fillRect(dx-10,dy-10,d.w+20,d.h+14);
    ctx.globalAlpha=1;
  }
  // Frame and dark opening
  ctx.fillStyle=hasKey?'#6a5320':'#3a3a42';
  ctx.fillRect(dx-4,dy-4,d.w+8,d.h+4);
  ctx.fillStyle='#0d0d14';
  ctx.fillRect(dx,dy,d.w,d.h);
  if(hasKey){
    // Unlocked: the opening glows and invites you in
    const g=ctx.createLinearGradient(dx,dy+d.h,dx,dy);
    g.addColorStop(0,'rgba(255,213,74,0.55)'); g.addColorStop(1,'rgba(255,213,74,0)');
    ctx.fillStyle=g; ctx.fillRect(dx,dy,d.w,d.h);
    ctx.fillStyle='#ffe89a'; ctx.font='bold 10px monospace'; ctx.textAlign='center';
    ctx.fillText('ENTER',dx+d.w/2,dy-12); ctx.textAlign='left';
  } else {
    // Locked: keyhole tells you what you're missing
    ctx.fillStyle='#8a8a96';
    ctx.beginPath(); ctx.arc(dx+d.w/2,dy+d.h*0.45,5,0,Math.PI*2); ctx.fill();
    ctx.fillRect(dx+d.w/2-2.5,dy+d.h*0.45,5,11);

  ctx.restore();
}

// ─── STICKMAN DRAW ───
// Phil's bought kit, drawn in drawStickman's local space: the origin is between
// his feet and `dir` mirrors him, so every offset below is measured from the hand
// the caller passes in. Only the player ever gets here — enemies keep their own
// spear and sword, which is what makes an armed Phil read as different.
// `mode` is which of the three arm poses drawStickman is currently in.
function drawHeldWeapon(kind, hx, hy, dir, mode, st){
  const wep=WEAPONS[kind];
  // With the shield up the weapon is in the *back* hand, pointing away from the
  // way Phil faces — same as the stock sword-at-side pose it replaces.
  const d = mode==='side' ? -dir : dir;
  if(kind==='hammer'){
    const len=mode==='thrust'?30:(mode==='side'?20:22);
    const lift=mode==='thrust'?-10:(mode==='side'?-8:-9);
    const ex=hx+d*len, ey=hy+lift;
    ctx.strokeStyle='#6b4a22'; ctx.lineWidth=4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(ex,ey); ctx.stroke();
    // Head sits across the end of the shaft, squared off to the swing direction
    ctx.save();
    ctx.translate(ex,ey); ctx.rotate(Math.atan2(ey-hy,ex-hx));
    ctx.fillStyle=wep.color; ctx.fillRect(-3,-9,11,18);
    ctx.fillStyle='#8a5f2a'; ctx.fillRect(-3,-9,4,18);
    ctx.strokeStyle='#5c3d17'; ctx.lineWidth=1.5; ctx.strokeRect(-3,-9,11,18);
    ctx.restore();
    if(mode==='thrust'&&st.atkProg>0.5){
      ctx.strokeStyle='rgba(255,200,120,0.4)'; ctx.lineWidth=9;
      ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(ex,ey); ctx.stroke();
    }
    return;
  }
  if(kind==='boomerang'){
    if(st.boomOut) return;                       // it's out there, not in his hand
    const bx=hx+d*8, by=hy-4;
    ctx.save();
    ctx.translate(bx,by); ctx.scale(d,1); ctx.rotate(-0.5);
    ctx.strokeStyle=wep.color; ctx.lineWidth=4; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(-7,5); ctx.lineTo(0,-6); ctx.lineTo(7,5); ctx.stroke();
    ctx.restore();
    return;
  }
  // Bazooka — a tube along the arm, with the muzzle flash on the firing frames
  const bx=hx-d*8, by=hy-5;
  ctx.save();
  ctx.translate(bx,by); ctx.scale(d,1); ctx.rotate(-0.12);
  ctx.fillStyle='#4a5058'; ctx.fillRect(0,-4,30,9);
  ctx.fillStyle=wep.color; ctx.fillRect(2,-4,7,9);
  ctx.fillStyle='#2c3138'; ctx.fillRect(28,-6,5,13);          // muzzle ring
  ctx.fillRect(6,5,5,4);                                      // grip
  ctx.fillStyle='#8d949c'; ctx.fillRect(10,-7,9,3);           // sight
  if(st.fireFx>0){
    const a=Math.min(1,st.fireFx/0.16);
    ctx.globalAlpha=a;
    ctx.fillStyle='#ffe6a0';
    ctx.beginPath(); ctx.moveTo(33,0); ctx.lineTo(46,-9); ctx.lineTo(42,0); ctx.lineTo(46,9); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#ff9a3c';
    ctx.beginPath(); ctx.arc(35,0,5,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

// Cloaks, drawn in drawStickman's local space: head centre (0,-bodyH-headR),
// torso -bodyH..0, feet at legH. Drawn over the body and under the skin
// decoration, so a Boss Rush skin's cap still sits on top of a ninja mask.
function drawCloakOn(kind, dir, sc, bodyH, headR, bodyCol){
  const def=CLOAKS[kind];
  if(!def||kind==='none') return;
  const hy=-bodyH-headR;
  ctx.save();

  if(kind==='glow'){                              // luminous, and nothing more
    ctx.globalAlpha=0.30+Math.sin(frameN*0.09)*0.08;
    ctx.fillStyle=def.color;
    ctx.beginPath(); ctx.ellipse(0,-bodyH*0.5,13*sc,bodyH*0.85,0,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }

  // Torso garment, common to every cloak
  ctx.fillStyle=def.color;
  ctx.fillRect(-5*sc,-bodyH+5*sc,10*sc,bodyH-4*sc);

  if(kind==='ninja'){
    ctx.fillRect(-headR,hy-1,headR*2,4.5);        // mask band
    ctx.strokeStyle=def.color; ctx.lineWidth=3*sc;
    ctx.beginPath();                              // scarf, trailing behind
    ctx.moveTo(-dir*3*sc,-bodyH+3*sc);
    ctx.quadraticCurveTo(-dir*15*sc,-bodyH+2*sc+Math.sin(frameN*0.14)*3,
                         -dir*22*sc,-bodyH+10*sc+Math.sin(frameN*0.14)*4);
    ctx.stroke();
  } else if(kind==='army'){
    ctx.beginPath(); ctx.arc(0,hy-1,headR+1.5,Math.PI,Math.PI*2); ctx.fill();  // helmet
    ctx.fillRect(-headR-2,hy-2,(headR+2)*2,2.5);
    ctx.fillStyle='#6b7d3a';                      // webbing
    ctx.fillRect(-5*sc,-bodyH+11*sc,10*sc,2.5*sc);
  } else if(kind==='tux'){
    ctx.fillStyle='#f2f2f2';                      // shirt front
    ctx.beginPath();
    ctx.moveTo(0,-bodyH+5*sc); ctx.lineTo(3*sc,-bodyH+15*sc); ctx.lineTo(-3*sc,-bodyH+15*sc);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='#c1121f';                      // bow tie
    ctx.beginPath();
    ctx.moveTo(-3.5*sc,-bodyH+4*sc); ctx.lineTo(0,-bodyH+6.5*sc); ctx.lineTo(-3.5*sc,-bodyH+9*sc);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(3.5*sc,-bodyH+4*sc); ctx.lineTo(0,-bodyH+6.5*sc); ctx.lineTo(3.5*sc,-bodyH+9*sc);
    ctx.closePath(); ctx.fill();
  } else if(kind==='kungfu'){
    ctx.strokeStyle='#c9c2ab'; ctx.lineWidth=1.5; // wrapped lapels
    ctx.beginPath();
    ctx.moveTo(-5*sc,-bodyH+5*sc); ctx.lineTo(0,-bodyH+13*sc); ctx.lineTo(5*sc,-bodyH+5*sc);
    ctx.stroke();
    ctx.fillStyle='#1f2430';                      // black belt
    ctx.fillRect(-6*sc,-bodyH+15*sc,12*sc,3.5*sc);
    ctx.fillRect(dir*2*sc,-bodyH+18*sc,2.5*sc,7*sc);
  }
  ctx.restore();
  ctx.strokeStyle=bodyCol; ctx.fillStyle=bodyCol;
}

function drawStickman(x,y,w,h,opts){
  const {facingR,walkCycle,attacking,atkTimer,atkDur,shielding,
         color,swordColor,shieldColor,invTimer,dead,isPlayer,scale,isArcher,health,maxHealth,type,skin} = opts;
  // Anything other than the sword takes the drawHeldWeapon path; the sword keeps
  // the original strokes untouched, and enemies never reach either.
  const wepKind = (isPlayer&&opts.weapon&&WEAPONS[opts.weapon]) ? opts.weapon : 'sword';
  const wepState = { boomOut:!!opts.boomOut, fireFx:opts.fireFx||0, atkProg:0 };
  const sc=scale||1;
  const cx=x+w/2, by=y+h;
  const dir=facingR?1:-1;
  const headR=7*sc, bodyH=20*sc, legH=17*sc, armL=12*sc, lw=Math.max(1.5,2*sc);
  const atkProg=attacking?(1-atkTimer/atkDur):0;

  ctx.save();
  ctx.translate(cx-cam.x, by-cam.y);
  if(invTimer>0&&isPlayer) ctx.globalAlpha=Math.sin(invTimer*22)>.0?1:0.3;
  if(dead) ctx.globalAlpha=0.5;
  ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=lw; ctx.lineCap='round'; ctx.lineJoin='round';

  // Head
  ctx.beginPath(); ctx.arc(0,-bodyH-headR,headR,0,Math.PI*2); ctx.stroke();

  if(type==='glider'){
    const flap=Math.sin(walkCycle*1.8)*5*sc;
    ctx.strokeStyle='rgba(215,235,255,0.85)'; ctx.lineWidth=Math.max(1.5,2*sc);
    ctx.beginPath();
    ctx.moveTo(0,-bodyH+6); ctx.lineTo(-18*sc,-bodyH-2-flap); ctx.lineTo(-28*sc,-bodyH+8);
    ctx.moveTo(0,-bodyH+6); ctx.lineTo(18*sc,-bodyH-2+flap); ctx.lineTo(28*sc,-bodyH+8);
    ctx.stroke();
    ctx.strokeStyle=color; ctx.lineWidth=lw;
  }

  if(isPlayer){
    // Eyes
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(dir*2.5,-bodyH-headR,2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(dir*2.5+dir,-bodyH-headR,1,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=color;
  } else {
    // Enemy angry X eyes
    ctx.lineWidth=1.5;
    [-3,2].forEach(ox=>{ const ey=-bodyH-headR; ctx.beginPath(); ctx.moveTo(ox-1.5,ey-2); ctx.lineTo(ox+1.5,ey+1); ctx.moveTo(ox+1.5,ey-2); ctx.lineTo(ox-1.5,ey+1); ctx.stroke(); });
    ctx.lineWidth=lw;
    // Archer hat
    if(isArcher){ ctx.fillStyle='#556b2f'; ctx.fillRect(-headR,-bodyH-headR*2-4,headR*2,5); ctx.fillStyle='#556b2f'; ctx.fillRect(-headR+3,-bodyH-headR*2-10,headR*2-6,8); ctx.fillStyle=color; }
  }

  // Body
  ctx.beginPath(); ctx.moveTo(0,-bodyH); ctx.lineTo(0,0); ctx.stroke();

  // Legs walk
  const legSw=Math.sin(walkCycle)*18*sc;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(dir*(legSw*.3-4*sc),legH*.55); ctx.lineTo(dir*(-2*sc+legSw*.2),legH); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(dir*(-legSw*.3+4*sc),legH*.55); ctx.lineTo(dir*(2*sc-legSw*.2),legH); ctx.stroke();

  // Arms
  const armSw=Math.sin(walkCycle+Math.PI)*10*sc;
  if(shielding){
    // Shield arm (front arm raised holding shield)
    const shX=dir*(armL+6); const shY=-bodyH+4;
    ctx.beginPath(); ctx.moveTo(0,-bodyH+5); ctx.lineTo(shX,shY); ctx.stroke();
    // Shield. Enemies keep the stock plate (they pass shieldColor); only Phil's
    // varies, and the taller tower shield is why the size is not a constant.
    const sd = isPlayer ? (SHIELDS[opts.shield]||SHIELDS.wood) : null;
    const shW = sd&&sd.tall ? 16 : 14, shH = sd&&sd.tall ? 30 : 22;
    ctx.fillStyle=sd?sd.color:(shieldColor||'#4466cc');
    ctx.strokeStyle=sd?sd.rim:(shieldColor?'#4a3314':'#2244aa'); ctx.lineWidth=2;
    const shieldX=shX+dir*4-6, shieldY=shY-(shH-10);
    ctx.fillRect(shieldX,shieldY,shW,shH);
    ctx.strokeRect(shieldX,shieldY,shW,shH);
    if(sd&&sd.spikes){
      ctx.fillStyle='#d8d3c4';                    // studs along the leading edge
      for(let i=0;i<4;i++){
        const sy2=shieldY+4+i*5;
        ctx.beginPath();
        ctx.moveTo(shieldX+(dir>0?shW:0),sy2);
        ctx.lineTo(shieldX+(dir>0?shW+5:-5),sy2+2.5);
        ctx.lineTo(shieldX+(dir>0?shW:0),sy2+5);
        ctx.closePath(); ctx.fill();
      }
    } else if(sd&&sd.charges){
      ctx.strokeStyle='#e0d0ff'; ctx.lineWidth=1.5; // rune, brighter with charges left
      ctx.globalAlpha=(opts.charges>0?0.9:0.25);
      ctx.beginPath(); ctx.arc(shieldX+shW/2,shieldY+shH/2,4.5,0,Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(shieldX+shW/2,shieldY+3); ctx.lineTo(shieldX+shW/2,shieldY+shH-3); ctx.stroke();
      ctx.globalAlpha=1;
    } else {
      ctx.strokeStyle='#99aaff'; ctx.lineWidth=1;   // the classic cross
      ctx.beginPath(); ctx.moveTo(shieldX+shW/2,shieldY+2); ctx.lineTo(shieldX+shW/2,shieldY+shH-2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(shieldX+2,shieldY+shH/2); ctx.lineTo(shieldX+shW-2,shieldY+shH/2); ctx.stroke();
    }
    ctx.strokeStyle=color; ctx.lineWidth=lw;
    // Back arm
    ctx.beginPath(); ctx.moveTo(0,-bodyH+5); ctx.lineTo(-dir*(armL-3),-bodyH+12+armSw*.3); ctx.stroke();
    // Weapon at side
    const sx=-dir*(armL-3), sy=-bodyH+12+armSw*.3;
    if(opts.martial){ /* nothing held */ }
    else if(wepKind!=='sword'){ drawHeldWeapon(wepKind,sx,sy,dir,'side',wepState); }
    else {
      ctx.strokeStyle=swordColor||'#c8eeff'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(sx-dir*18,sy-8); ctx.stroke();
    }
  } else if(attacking){
    const thX=dir*(armL+8+atkProg*8), thY=-bodyH+6-atkProg*4;
    ctx.beginPath(); ctx.moveTo(0,-bodyH+5); ctx.lineTo(thX,thY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,-bodyH+5); ctx.lineTo(-dir*(armL-4),-bodyH+12); ctx.stroke();
    if(opts.martial){
      // Nothing in hand. On the ground it is a straight punch; in the air the
      // back leg comes through as the flying kick, which is the hit that hurts.
      ctx.strokeStyle=color; ctx.lineWidth=lw;
      ctx.beginPath(); ctx.moveTo(0,-bodyH+5); ctx.lineTo(thX+dir*6,thY+2); ctx.stroke();
      ctx.fillStyle=color;
      ctx.beginPath(); ctx.arc(thX+dir*8,thY+2,3.2*sc,0,Math.PI*2); ctx.fill();
      if(opts.airborne){
        ctx.beginPath();                          // kicking leg, straight out
        ctx.moveTo(0,0); ctx.lineTo(dir*(20+atkProg*12)*sc,-2*sc); ctx.stroke();
        ctx.beginPath();                          // trailing leg, tucked
        ctx.moveTo(0,0); ctx.lineTo(-dir*8*sc,legH*0.7); ctx.stroke();
      }
      if(atkProg>0.35){
        ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=2;
        const r=(opts.airborne?20:13)*sc;
        const ix=thX+dir*(opts.airborne?24:12), iy=thY+(opts.airborne?-4:2);
        for(let i=0;i<3;i++){
          ctx.beginPath();
          ctx.arc(ix,iy,r+i*4,-0.6+ (dir<0?Math.PI:0), 0.6+(dir<0?Math.PI:0));
          ctx.stroke();
        }
      }
    } else if(wepKind!=='sword'){
      wepState.atkProg=atkProg;
      drawHeldWeapon(wepKind,thX,thY,dir,'thrust',wepState);
    } else {
    // Sword thrust
    ctx.strokeStyle=swordColor||'#c8eeff'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(thX,thY); ctx.lineTo(thX+dir*26,thY-8); ctx.stroke();
    ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(thX-dir*2,thY+4); ctx.lineTo(thX+dir*4,thY-4); ctx.stroke();
    // Glow during attack
    if(atkProg>0.5){ ctx.strokeStyle='rgba(180,220,255,0.4)'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(thX,thY); ctx.lineTo(thX+dir*26,thY-8); ctx.stroke(); }
    }
  } else {
    // Idle / walk
    const a1x=dir*(armL+armSw*.3), a1y=-bodyH+10+Math.abs(armSw)*.2;
    const a2x=-dir*(armL-armSw*.3), a2y=-bodyH+10-Math.abs(armSw)*.2;
    ctx.beginPath(); ctx.moveTo(0,-bodyH+5); ctx.lineTo(a1x,a1y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,-bodyH+5); ctx.lineTo(a2x,a2y); ctx.stroke();
    // Weapon at rest — the gi has empty hands
    if(isPlayer&&opts.martial){ /* nothing held */ }
    else if(isPlayer&&wepKind!=='sword'){ drawHeldWeapon(wepKind,a1x,a1y,dir,'rest',wepState); }
    else if(isPlayer){ ctx.strokeStyle=swordColor||'#c8eeff'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(a1x,a1y); ctx.lineTo(a1x+dir*20,a1y-9); ctx.stroke(); }
    // Archer bow
    if(isArcher){ ctx.strokeStyle='#8B4513'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(a2x-dir*2,a2y-5,10,dir<0?-Math.PI*.6:-Math.PI*.4,dir<0?Math.PI*.6:Math.PI*.4,dir>0); ctx.stroke(); ctx.strokeStyle='rgba(200,200,200,0.7)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(a2x-dir*2,a2y-14); ctx.lineTo(a2x-dir*2,a2y+4); ctx.stroke(); }
    if(type==='bomber'){
      ctx.fillStyle='#222';
      ctx.beginPath(); ctx.arc(a2x-dir*2,a2y-3,4.5,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#ffcc66'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(a2x+dir*1,a2y-7); ctx.lineTo(a2x+dir*4,a2y-12); ctx.stroke();
      ctx.strokeStyle=color; ctx.lineWidth=lw;
    }
    // Soldier spear
    if(!isArcher&&!isPlayer&&type!=='bomber'&&type!=='glider'){ ctx.strokeStyle='#8B6914'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(a1x,a1y); ctx.lineTo(a1x+dir*26,a1y-12); ctx.stroke(); ctx.fillStyle='#bbaa22'; ctx.beginPath(); ctx.moveTo(a1x+dir*26,a1y-12); ctx.lineTo(a1x+dir*32,a1y-20); ctx.lineTo(a1x+dir*20,a1y-14); ctx.fill(); }
  }

  // Cloak first, skin second: a skin's cap belongs on top of a ninja's mask
  if(isPlayer&&opts.cloak&&opts.cloak!=='none') drawCloakOn(opts.cloak,dir,sc,bodyH,headR,color);

  // Skin decoration (Boss Rush unlocks). Drawn in the same local space as the
  // body above: head centred at (0,-bodyH-headR), torso -bodyH..0, feet at legH.
  if(isPlayer&&skin&&skin!=='phil'){
    const hy=-bodyH-headR;                       // head centre
    const legSwD=Math.sin(walkCycle)*18*sc;
    if(skin==='mario'){
      ctx.fillStyle='#b3140b';                    // cap (darker than the red body so it reads)
      ctx.beginPath(); ctx.arc(0,hy-1.5,headR+1,Math.PI,0); ctx.fill();
      ctx.fillRect(-headR-1,hy-2.5,headR*2+2,3);  // band
      ctx.fillRect(dir>0?headR-1:-headR-7,hy-2.5,8,3);   // brim, forward-facing
      ctx.fillStyle='#f7d9b0';                    // face patch, so the cap stands off the head
      ctx.beginPath(); ctx.arc(0,hy+2.5,headR-2.5,0,Math.PI); ctx.fill();
      ctx.fillStyle='#3a2008';                    // moustache
      ctx.fillRect(-4.5,hy+3,9,2.5);
      ctx.fillStyle='#2f56c8';                    // overalls
      ctx.fillRect(-3.5,-bodyH+7,7,bodyH-7);
    } else if(skin==='sonica'){
      ctx.fillStyle=color;                        // quills, swept back
      [[-3,-16,-9],[1,-15,3],[5,-11,9]].forEach(q=>{
        ctx.beginPath();
        ctx.moveTo(-dir*(headR-3),hy+q[0]);
        ctx.lineTo(-dir*(headR-q[1]),hy+q[1]*0.5);
        ctx.lineTo(-dir*(headR-3),hy+q[2]);
        ctx.closePath(); ctx.fill();
      });
      ctx.fillStyle='#e02b2b';                    // red shoes
      ctx.beginPath(); ctx.ellipse(dir*(legSwD*.2-2*sc),legH-1,6,3.4,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(dir*(2*sc-legSwD*.2),legH-1,6,3.4,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#f7e2c0';                    // muzzle
      ctx.beginPath(); ctx.arc(dir*3,hy+3,3,0,Math.PI*2); ctx.fill();
    } else if(skin==='minion'){
      ctx.strokeStyle='#8d8d95'; ctx.lineWidth=2;  // goggle strap + rim
      ctx.beginPath(); ctx.moveTo(-headR,hy-1); ctx.lineTo(headR,hy-1); ctx.stroke();
      ctx.beginPath(); ctx.arc(dir*1.5,hy-1,3.6,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle='#f2f2f2'; ctx.beginPath(); ctx.arc(dir*1.5,hy-1,2.6,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(dir*2.2,hy-1,1.2,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#2f56c8';                     // overalls
      ctx.fillRect(-3.5,-bodyH+9,7,bodyH-9);
      ctx.strokeStyle=color; ctx.lineWidth=lw;
    }
    ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=lw;
  }

  // Giant boss: add club
  if(type==='giant_boss'){
    ctx.strokeStyle='#5a3a10'; ctx.lineWidth=8;
    const a1x=dir*(armL+armSw*.3), a1y=-bodyH+10+Math.abs(armSw)*.2;
    ctx.beginPath(); ctx.moveTo(a1x,a1y); ctx.lineTo(a1x+dir*35,a1y-10); ctx.stroke();
    ctx.fillStyle='#4a2a00'; ctx.beginPath(); ctx.arc(a1x+dir*38,a1y-12,14,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#6a4a20'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(a1x+dir*38,a1y-12,14,0,Math.PI*2); ctx.stroke();
  }

  ctx.restore();

  // Enemy health pips
  if(!isPlayer&&!dead&&maxHealth>0){
    const bx=x-cam.x, by2=y-cam.y-6;
    for(let i=0;i<maxHealth;i++){
      ctx.fillStyle=i<health?'#44ff44':'#223322';
      ctx.fillRect(bx+i*6,by2,5,3);
    }
  }
}

// ─── BOSS DRAW FUNCTIONS ───
function drawGiant(){
  const b=boss;
  if(b.dead&&b.deathTimer<=0) return;
  const sc=2.5;
  const opts={facingR:b.facingR,walkCycle:b.walkCycle,attacking:false,atkTimer:0,atkDur:1,
    shielding:false,color:b.phase===2?'#cc3311':'#885522',swordColor:'#888',
    invTimer:b.invTimer,dead:b.dead,isPlayer:false,scale:sc,isArcher:false,health:b.health,maxHealth:b.maxHealth,type:'giant_boss'};
  ctx.save();
  if(b.dead) ctx.globalAlpha=Math.max(0,b.deathTimer/3);
  drawStickman(b.x,b.y,b.w,b.h,opts);
  ctx.restore();
  // Shockwaves
  for(const sw of b.shockwaves){
    const sx=sw.x-cam.x, sy=sw.y-cam.y;
    ctx.fillStyle=`rgba(180,120,40,${Math.min(1,sw.life*.8)})`;
    ctx.fillRect(sx,sy,sw.w,sw.h);
    ctx.fillStyle=`rgba(255,200,100,${Math.min(1,sw.life*.6)})`;
    ctx.fillRect(sx,sy,sw.w,4);
  }
}

function drawAnaconda(){
  const b=boss;
  if(b.dead&&b.deathTimer<=0) return;
  ctx.save();
  if(b.dead) ctx.globalAlpha=Math.max(0,b.deathTimer/3);

  // Draw segments (tail to neck, so head is on top)
  for(let i=b.segCount-1;i>=0;i--){
    const idx=Math.min(i*10,b.segHistory.length-1);
    if(idx<0) continue;
    const seg=b.segHistory[idx];
    const r=Math.max(6,14-(i/b.segCount)*7);
    const t=1-i/b.segCount;
    // Alternating belly/back
    ctx.fillStyle=i%2===0?'#2a7a20':'#3a9a30';
    ctx.strokeStyle='#1a5010'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(seg.x-cam.x,seg.y-cam.y,r,0,Math.PI*2);
    ctx.fill(); ctx.stroke();
    // Belly
    ctx.fillStyle='rgba(180,210,100,0.4)';
    ctx.beginPath(); ctx.arc(seg.x-cam.x,seg.y-cam.y+r*.3,r*.5,0,Math.PI*2); ctx.fill();
  }

  // Head
  const hx=b.x+15-cam.x, hy=b.y+15-cam.y;
  ctx.fillStyle=b.phase===2?'#1a6010':'#2a8020';
  ctx.strokeStyle='#0f4008'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.ellipse(hx,hy,25,18,b.facingR?-0.3:0.3,0,Math.PI*2);
  ctx.fill(); ctx.stroke();
  // Eyes
  const ex=b.facingR?8:-8;
  ctx.fillStyle='#ffee00'; ctx.beginPath(); ctx.ellipse(hx+ex,hy-5,5,3,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(hx+ex,hy-5,2,0,Math.PI*2); ctx.fill();
  // Tongue
  const tDir=b.facingR?1:-1;
  ctx.strokeStyle='#ff2244'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(hx+tDir*22,hy+4);
  ctx.lineTo(hx+tDir*30,hy+2);
  ctx.moveTo(hx+tDir*30,hy+2); ctx.lineTo(hx+tDir*34,hy-1);
  ctx.moveTo(hx+tDir*30,hy+2); ctx.lineTo(hx+tDir*34,hy+5); ctx.stroke();

  // Venom projectiles
  for(const sw of b.shockwaves){
    ctx.fillStyle='rgba(100,255,80,0.8)';
    ctx.beginPath(); ctx.arc(sw.x-cam.x,sw.y-cam.y,9,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(180,255,150,0.5)';
    ctx.beginPath(); ctx.arc(sw.x-cam.x,sw.y-cam.y,5,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawLizard(){
  const b=boss;
  if(b.dead&&b.deathTimer<=0) return;
  const bx=b.x-cam.x, by=b.y-cam.y;
  const dir=b.facingR?1:-1;
  ctx.save();
  if(b.dead) ctx.globalAlpha=Math.max(0,b.deathTimer/3);
  if(b.invTimer>0) ctx.globalAlpha=Math.sin(b.invTimer*20)>.0?1:0.5;

  const baseCol=b.phase===2?'#888a00':'#447700';
  const darkCol=b.phase===2?'#555500':'#224400';

  // Body
  ctx.fillStyle=baseCol; ctx.strokeStyle=darkCol; ctx.lineWidth=2;
  ctx.fillRect(bx,by+20,b.w,50); ctx.strokeRect(bx,by+20,b.w,50);
  // Panel lines
  ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.lineWidth=1;
  for(let i=1;i<4;i++) ctx.strokeRect(bx+i*22,by+22,20,46);

  // Head
  const headX=b.facingR?bx+b.w-10:bx-20;
  ctx.fillStyle=baseCol; ctx.beginPath();
  const hx2=headX-5, hy2=by+10, hr=8;
  ctx.moveTo(hx2+hr,hy2); ctx.lineTo(hx2+40-hr,hy2); ctx.quadraticCurveTo(hx2+40,hy2,hx2+40,hy2+hr);
  ctx.lineTo(hx2+40,hy2+35-hr); ctx.quadraticCurveTo(hx2+40,hy2+35,hx2+40-hr,hy2+35);
  ctx.lineTo(hx2+hr,hy2+35); ctx.quadraticCurveTo(hx2,hy2+35,hx2,hy2+35-hr);
  ctx.lineTo(hx2,hy2+hr); ctx.quadraticCurveTo(hx2,hy2,hx2+hr,hy2);
  ctx.closePath(); ctx.fill(); ctx.strokeStyle=darkCol; ctx.lineWidth=2; ctx.stroke();
  // Eyes (glowing)
  const eyeOff=b.facingR?20:14;
  ctx.fillStyle=b.laserActive?'#ff0000':'#ff8800';
  ctx.beginPath(); ctx.ellipse(headX+eyeOff,by+22,7,5,0,0,Math.PI*2); ctx.fill();
  // Jaw
  ctx.fillStyle='#223300'; ctx.beginPath();
  if(b.aiState==='LASER_FIRE') ctx.fillRect(headX+5,by+38,25,12);
  // Mechanical legs
  [[b.w*.25,65],[b.w*.75,65]].forEach(([lx,ly])=>{
    ctx.fillStyle=darkCol; ctx.fillRect(bx+lx-8,by+ly,16,18); ctx.fillRect(bx+lx-12,by+ly+14,24,8);
  });
  // Tail
  const tailStart=b.facingR?bx-20:bx+b.w+20;
  const tailAng=b.aiState==='TAIL'?-b.tailAngle*dir:0;
  ctx.save(); ctx.translate(b.facingR?bx:bx+b.w,by+50);
  ctx.rotate(tailAng); ctx.fillStyle=baseCol;
  ctx.fillRect(-dir*60,-8,60,14); ctx.fillRect(-dir*100,-5,45,10); ctx.fillRect(-dir*130,-3,35,7); ctx.restore();

  // Laser beam
  if(b.laserActive){
    const lsX=b.facingR?bx+b.w+30:headX+5;
    const lsY=by+22;
    ctx.strokeStyle='rgba(255,255,0,0.9)'; ctx.lineWidth=4;
    const endX=lsX+Math.cos(b.laserAngle)*700, endY=lsY+Math.sin(b.laserAngle)*700;
    ctx.beginPath(); ctx.moveTo(lsX,lsY); ctx.lineTo(endX,endY); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,200,0.4)'; ctx.lineWidth=12;
    ctx.beginPath(); ctx.moveTo(lsX,lsY); ctx.lineTo(endX,endY); ctx.stroke();
    // Glow at mouth
    const grd=ctx.createRadialGradient(lsX,lsY,0,lsX,lsY,25);
    grd.addColorStop(0,'rgba(255,255,100,0.7)'); grd.addColorStop(1,'rgba(255,255,0,0)');
    ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(lsX,lsY,25,0,Math.PI*2); ctx.fill();
  }

  // Shockwaves
  for(const sw of b.shockwaves){
    const sx=sw.x-cam.x;
    ctx.fillStyle=`rgba(200,200,40,${Math.min(1,sw.life*.8)})`; ctx.fillRect(sx,GROUND_Y-18-cam.y,sw.w,18);
  }
  ctx.restore();
}

function drawMech(){
  const b=boss;
  if(b.dead&&b.deathTimer<=0) return;
  ctx.save();
  if(b.dead) ctx.globalAlpha=Math.max(0,b.deathTimer/3);
  if(b.invTimer>0) ctx.globalAlpha=Math.sin(b.invTimer*20)>.0?1:0.4;

  // The body below is laid out in absolute pixels for a MECH_W x MECH_H box, so
  // it is drawn at design size and scaled about the feet. Anchoring at the feet
  // is what keeps a shrunken Mech standing on the floor instead of hovering.
  const s=b.shrink;
  const fx=b.x+b.w/2-cam.x, fy=b.y+b.h-cam.y;
  const bx=fx-MECH_W/2, by=fy-MECH_H;

  const p3=b.phase===3;
  const mc=p3?'#4d2a63':(b.phase===2?'#880000':'#334455');
  const lc=p3?'#c07dff':(b.phase===2?'#cc2200':'#4466aa');
  const ac=p3?'#301a3f':(b.phase===2?'#660000':'#223344');
  const hot=p3?'#c07dff':(b.phase===2?'#ff2222':'#44aaff');

  ctx.save();
  if(s!==1){ ctx.translate(fx,fy); ctx.scale(s,s); ctx.translate(-fx,-fy); }

  // Legs
  [[MECH_W*.25,130],[MECH_W*.75,130]].forEach(([lx,lh])=>{
    ctx.fillStyle=ac; ctx.fillRect(bx+lx-14,by+lh,28,30);
    ctx.fillRect(bx+lx-18,by+lh+26,36,12);
    // Piston detail
    ctx.fillStyle=lc; ctx.fillRect(bx+lx-5,by+lh-10,10,15);
  });

  // Torso
  ctx.fillStyle=mc; ctx.strokeStyle=lc; ctx.lineWidth=2;
  ctx.fillRect(bx+10,by+60,MECH_W-20,80); ctx.strokeRect(bx+10,by+60,MECH_W-20,80);
  // Panel lines
  ctx.strokeStyle='rgba(0,0,0,0.4)'; ctx.lineWidth=1;
  [20,40,60].forEach(ly=>ctx.strokeRect(bx+15,by+65+ly,MECH_W-30,18));
  // Energy core
  const coreGlow=p3?`rgba(190,120,255,${.45+Math.sin(frameN*.13)*.3})`:(b.phase===2?`rgba(255,50,50,${.4+Math.sin(frameN*.1)*.3})`:`rgba(0,150,255,${.3+Math.sin(frameN*.08)*.2})`);
  const coreGrd=ctx.createRadialGradient(bx+MECH_W/2,by+100,0,bx+MECH_W/2,by+100,28);
  coreGrd.addColorStop(0,p3?'#e0baff':(b.phase===2?'#ff8888':'#88ddff')); coreGrd.addColorStop(1,'transparent');
  ctx.fillStyle=coreGrd; ctx.beginPath(); ctx.arc(bx+MECH_W/2,by+100,28,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=hot; ctx.beginPath(); ctx.arc(bx+MECH_W/2,by+100,14,0,Math.PI*2); ctx.fill();

  // Arms
  const walk=Math.sin(b.walkCycle)*12;
  [[MECH_W+8,75,MECH_W+48,95+walk],[-30,75,-70,95-walk]].forEach(([ax1,ay1,ax2,ay2])=>{
    ctx.fillStyle=ac; ctx.strokeStyle=lc; ctx.lineWidth=2;
    const realAx1=bx+ax1, realAy1=by+ay1, realAx2=bx+ax2, realAy2=by+ay2;
    ctx.fillRect(realAx1-12,realAy1,24,45); ctx.strokeRect(realAx1-12,realAy1,24,45);
    ctx.fillRect(realAx2-10,realAy2,20,35); ctx.strokeRect(realAx2-10,realAy2,20,35);
    // Claw
    const clawY=realAy2+35;
    [[-12,0],[0,-5],[12,0]].forEach(([cx2,cy2])=>{ ctx.fillStyle=lc; ctx.fillRect(realAx2+cx2-3,clawY+cy2,6,10); });
  });

  // Neck + head
  ctx.fillStyle=ac; ctx.fillRect(bx+MECH_W/2-10,by+20,20,42);
  // Head (round)
  ctx.fillStyle=mc; ctx.strokeStyle=lc; ctx.lineWidth=2;
  ctx.beginPath(); ctx.ellipse(bx+MECH_W/2,by+20,38,32,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  // Visor
  const vGrd=ctx.createLinearGradient(bx+MECH_W/2-28,by+10,bx+MECH_W/2+28,by+30);
  vGrd.addColorStop(0,p3?'rgba(190,120,255,0.9)':(b.phase===2?'rgba(255,0,0,0.9)':'rgba(80,180,255,0.9)'));
  vGrd.addColorStop(1,p3?'rgba(120,60,190,0.9)':(b.phase===2?'rgba(180,0,0,0.9)':'rgba(0,80,200,0.9)'));
  ctx.fillStyle=vGrd; ctx.beginPath(); ctx.ellipse(bx+MECH_W/2,by+18,26,12,0,0,Math.PI*2); ctx.fill();
  // Visor reflection
  ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.beginPath(); ctx.ellipse(bx+MECH_W/2-8,by+14,10,4,-.3,0,Math.PI*2); ctx.fill();

  ctx.restore();   // end scaled body

  // Laser eyes. Drawn outside the scale so the beam keeps its full reach — under
  // the transform a 700px beam would shrink along with the Mech.
  if(b.laserActive){
    const eyeX=b.x+b.w/2-cam.x, eyeY=mechAnchorY(b,18)-cam.y;
    ctx.strokeStyle='rgba(255,50,50,0.9)'; ctx.lineWidth=3;
    const endX=eyeX+Math.cos(b.laserAngle)*700, endY=eyeY+Math.sin(b.laserAngle)*700;
    ctx.beginPath(); ctx.moveTo(eyeX,eyeY); ctx.lineTo(endX,endY); ctx.stroke();
    ctx.strokeStyle='rgba(255,150,150,0.3)'; ctx.lineWidth=10;
    ctx.beginPath(); ctx.moveTo(eyeX,eyeY); ctx.lineTo(endX,endY); ctx.stroke();
  }

  // Rocket fists
  for(const f of b.fists){
    const fx=f.x-cam.x, fy2=f.y-cam.y;
    ctx.fillStyle=ac; ctx.strokeStyle=lc; ctx.lineWidth=2;
    ctx.fillRect(fx-15,fy2-15,30,25); ctx.strokeRect(fx-15,fy2-15,30,25);
    // Exhaust
    ctx.fillStyle='rgba(255,150,0,.5)'; ctx.beginPath(); ctx.ellipse(fx,fy2+12,10,6,0,0,Math.PI*2); ctx.fill();
  }

  // Shockwaves, and the stomp column which carries its own height
  for(const sw of b.shockwaves){
    const sx=sw.x-cam.x;
    if(sw.column){
      const cg=ctx.createLinearGradient(0,sw.y-cam.y,0,sw.y+sw.h-cam.y);
      cg.addColorStop(0,'rgba(255,180,60,0)');
      cg.addColorStop(1,`rgba(255,120,0,${Math.min(0.75,sw.life*1.6)})`);
      ctx.fillStyle=cg; ctx.fillRect(sx,sw.y-cam.y,sw.w,sw.h);
      continue;
    }
    ctx.fillStyle=`rgba(255,80,0,${Math.min(1,sw.life*.7)})`; ctx.fillRect(sx,GROUND_Y-18-cam.y,sw.w,18);
    ctx.fillStyle=`rgba(255,200,100,${Math.min(1,sw.life*.5)})`; ctx.fillRect(sx,GROUND_Y-18-cam.y,sw.w,4);
  }

  // Phase 2+ floor sweep
  if(b.aiState==='SWEEP'){
    const swx=b.sweepX-cam.x;
    ctx.strokeStyle='rgba(255,90,90,0.9)'; ctx.lineWidth=5;
    ctx.beginPath(); ctx.moveTo(swx,mechAnchorY(b,18)-cam.y); ctx.lineTo(swx,GROUND_Y-cam.y); ctx.stroke();
    ctx.fillStyle='rgba(255,160,120,0.5)';
    ctx.fillRect(swx-16,GROUND_Y-10-cam.y,32,10);
  }
  ctx.restore();
}

function drawFrostWarden(){
  const b=boss;
  const opts={facingR:b.facingR,walkCycle:b.walkCycle,attacking:b.aiState==='DASH',atkTimer:0.2,atkDur:1,
    shielding:false,color:b.phase===2?'#59b8ff':'#4477aa',swordColor:'#eaffff',shieldColor:'#99d8ff',
    invTimer:b.invTimer,dead:b.dead,isPlayer:false,scale:1.7,isArcher:false,health:b.health,maxHealth:b.maxHealth,type:'soldier'};
  ctx.save();
  if(b.dead) ctx.globalAlpha=Math.max(0,b.deathTimer/3);
  drawStickman(b.x,b.y,b.w,b.h,opts);
  const hx=b.x+b.w/2-cam.x, hy=b.y+8-cam.y;
  ctx.fillStyle='#eaffff';
  ctx.beginPath(); ctx.moveTo(hx-16,hy+8); ctx.lineTo(hx-6,hy-12); ctx.lineTo(hx+2,hy+8); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(hx+16,hy+8); ctx.lineTo(hx+6,hy-12); ctx.lineTo(hx-2,hy+8); ctx.closePath(); ctx.fill();
  for(const ic of b.icicles){
    ctx.fillStyle='rgba(210,245,255,0.85)';
    ctx.beginPath(); ctx.moveTo(ic.x-cam.x,ic.y-cam.y-18); ctx.lineTo(ic.x-cam.x+8,ic.y-cam.y+18); ctx.lineTo(ic.x-cam.x-8,ic.y-cam.y+18); ctx.closePath(); ctx.fill();
  }
  for(const sw of b.shockwaves){
    ctx.fillStyle=`rgba(180,240,255,${Math.min(1,sw.life*.8)})`;
    ctx.fillRect(sw.x-cam.x,sw.y-cam.y,sw.w,sw.h);
  }
  ctx.restore();
}

function drawYeti(){
  const b=boss, bx=b.x-cam.x, by=b.y-cam.y;
  ctx.save();
  if(b.dead) ctx.globalAlpha=Math.max(0,b.deathTimer/3);
  if(b.invTimer>0) ctx.globalAlpha=Math.sin(b.invTimer*22)>0?1:0.45;
  ctx.fillStyle=b.phase===2?'#d7f6ff':'#f4fbff';
  ctx.beginPath(); ctx.ellipse(bx+b.w/2,by+62,44,42,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#c8dced';
  ctx.beginPath(); ctx.ellipse(bx+b.w/2,by+28,30,24,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#8ad5ff';
  ctx.beginPath(); ctx.arc(bx+b.w/2-10,by+26,4,0,Math.PI*2); ctx.arc(bx+b.w/2+10,by+26,4,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#6ba7c8'; ctx.lineWidth=6;
  ctx.beginPath(); ctx.moveTo(bx+22,by+48); ctx.lineTo(bx+2,by+88); ctx.moveTo(bx+b.w-22,by+48); ctx.lineTo(bx+b.w-2,by+88); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx+30,by+b.h); ctx.lineTo(bx+20,by+b.h+18); ctx.moveTo(bx+b.w-30,by+b.h); ctx.lineTo(bx+b.w-20,by+b.h+18); ctx.stroke();
  ctx.fillStyle='#ffffff';
  ctx.beginPath(); ctx.moveTo(bx+b.w/2-18,by+6); ctx.lineTo(bx+b.w/2-8,by-14); ctx.lineTo(bx+b.w/2-2,by+4); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(bx+b.w/2+18,by+6); ctx.lineTo(bx+b.w/2+8,by-14); ctx.lineTo(bx+b.w/2+2,by+4); ctx.closePath(); ctx.fill();
  for(const s of b.snowballs){
    ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(s.x-cam.x,s.y-cam.y,s.r||10,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(160,210,255,0.8)'; ctx.lineWidth=2; ctx.stroke();
  }
  for(const ic of b.icicles){
    ctx.fillStyle='rgba(210,245,255,0.9)';
    ctx.beginPath(); ctx.moveTo(ic.x-cam.x,ic.y-cam.y-16); ctx.lineTo(ic.x-cam.x+7,ic.y-cam.y+18); ctx.lineTo(ic.x-cam.x-7,ic.y-cam.y+18); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawForeman(){
  const b=boss;
  const opts={facingR:b.facingR,walkCycle:b.walkCycle,attacking:b.aiState==='CHARGE',atkTimer:0.2,atkDur:1,
    shielding:false,color:b.phase===2?'#ff7a2a':'#b45822',swordColor:'#dddddd',shieldColor:'#999999',
    invTimer:b.invTimer,dead:b.dead,isPlayer:false,scale:1.75,isArcher:false,health:b.health,maxHealth:b.maxHealth,type:'soldier'};
  ctx.save();
  if(b.dead) ctx.globalAlpha=Math.max(0,b.deathTimer/3);
  drawStickman(b.x,b.y,b.w,b.h,opts);
  const bx=b.x+b.w/2-cam.x, by=b.y+32-cam.y;
  ctx.fillStyle='#ffd24a'; ctx.fillRect(bx-14,by-10,28,18);
  ctx.fillStyle='#444'; ctx.fillRect(bx-18,by-16,36,6);
  for(const s of b.saws){
    ctx.save();
    ctx.translate(s.x-cam.x,s.y-cam.y); ctx.rotate(s.rot||0);
    ctx.strokeStyle='#cfd4db'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(0,0,12,0,Math.PI*2); ctx.stroke();
    for(let i=0;i<8;i++){ ctx.rotate(Math.PI/4); ctx.fillStyle='#cfd4db'; ctx.fillRect(8,-2,6,4); }
    ctx.restore();
  }
  ctx.restore();
}

function drawMole(){
  const b=boss;
  const bx=b.x-cam.x, by=b.y-cam.y;
  ctx.save();
  if(b.dead) ctx.globalAlpha=Math.max(0,b.deathTimer/3);
  if(b.hidden){
    ctx.fillStyle='rgba(120,88,58,0.85)';
    ctx.beginPath(); ctx.ellipse(bx+b.w/2,GROUND_Y-cam.y-8,34+Math.sin(b.moundPulse)*4,14,0,0,Math.PI*2); ctx.fill();
  } else {
    ctx.fillStyle=b.phase===2?'#7d6b61':'#6c5e56';
    ctx.beginPath(); ctx.ellipse(bx+b.w/2,by+44,34,28,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#444';
    ctx.beginPath(); ctx.ellipse(bx+b.w/2,by+30,26,18,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#c7d0d9';
    ctx.beginPath(); ctx.moveTo(bx+b.w/2+18,by+30); ctx.lineTo(bx+b.w/2+38,by+24); ctx.lineTo(bx+b.w/2+20,by+40); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#ff4444'; ctx.beginPath(); ctx.arc(bx+b.w/2+8,by+24,4,0,Math.PI*2); ctx.fill();
  }
  for(const d of b.dirt){
    ctx.fillStyle='#b78652'; ctx.beginPath(); ctx.arc(d.x-cam.x,d.y-cam.y,d.r||8,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawTunnelFiend(){
  const b=boss;
  const bx=b.x-cam.x, by=b.y-cam.y;
  ctx.save();
  if(b.dead) ctx.globalAlpha=Math.max(0,b.deathTimer/3);
  ctx.fillStyle=b.phase===2?'#8d6e55':'#675446';
  ctx.beginPath(); ctx.ellipse(bx+b.w/2,by+48,30,40,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#b9976a';
  ctx.fillRect(bx+18,by+16,32,24);
  ctx.fillStyle='#ffcc66'; ctx.beginPath(); ctx.arc(bx+b.w/2-8,by+26,4,0,Math.PI*2); ctx.arc(bx+b.w/2+8,by+26,4,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#4b3a2d'; ctx.lineWidth=6;
  ctx.beginPath(); ctx.moveTo(bx+20,by+70); ctx.lineTo(bx+10,by+b.h+12); ctx.moveTo(bx+b.w-20,by+70); ctx.lineTo(bx+b.w-10,by+b.h+12); ctx.stroke();
  for(let i=0;i<5;i++){ ctx.fillStyle='rgba(190,170,150,0.8)'; ctx.fillRect(bx+8+i*12,by+4+(i%2)*2,8,6); }
  for(const r of b.rocks){ ctx.fillStyle='#b9976a'; ctx.beginPath(); ctx.arc(r.x-cam.x,r.y-cam.y,r.r||10,0,Math.PI*2); ctx.fill(); }
  ctx.restore();
}

function drawRevenantBody(body, variant='hybrid'){
  const bx=body.x-cam.x, by=body.y-cam.y;
  const leftBone=variant!=='brain', rightZombie=variant!=='bone';
  ctx.fillStyle=leftBone?'#d8d8cf':'#4d7d4d';
  ctx.fillRect(bx,by+10,body.w/2,body.h-10);
  ctx.fillStyle=rightZombie?'#5f8f52':'#d8d8cf';
  ctx.fillRect(bx+body.w/2,by+10,body.w/2,body.h-10);
  ctx.fillStyle='#2a2a2a'; ctx.fillRect(bx+body.w/2-10,by+18,20,22);
  ctx.fillStyle='#ff5555'; ctx.beginPath(); ctx.arc(bx+body.w/2-8,by+28,4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#88ff88'; ctx.beginPath(); ctx.arc(bx+body.w/2+8,by+28,4,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#48392b'; ctx.lineWidth=6;
  ctx.beginPath(); ctx.moveTo(bx+18,by+52); ctx.lineTo(bx+8,by+body.h+14); ctx.moveTo(bx+body.w-18,by+52); ctx.lineTo(bx+body.w-8,by+body.h+14); ctx.stroke();
  ctx.strokeStyle='#aab2b6'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(bx+10,by+16); ctx.lineTo(bx+2,by+34); ctx.moveTo(bx+body.w-10,by+16); ctx.lineTo(bx+body.w+8,by+34); ctx.stroke();
}

function drawRevenant(){
  const b=boss;
  ctx.save();
  if(b.dead) ctx.globalAlpha=Math.max(0,b.deathTimer/3);
  if(b.twins?.length) b.twins.forEach(t=>drawRevenantBody(t,t.variant));
  else drawRevenantBody(b,'hybrid');
  for(const bone of b.bones){
    ctx.fillStyle='#e8e4da';
    ctx.fillRect(bone.x-cam.x-(bone.w||28)/2,bone.y-cam.y-(bone.h||10)/2,bone.w||28,bone.h||10);
  }
  for(const brain of b.brains){
    ctx.fillStyle='#7fd68a'; ctx.beginPath(); ctx.arc(brain.x-cam.x,brain.y-cam.y,brain.r||12,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawCaptain(){
  const b=boss;
  const opts={facingR:b.facingR,walkCycle:b.walkCycle,attacking:b.aiState==='DASH',atkTimer:0.2,atkDur:1,
    shielding:true,color:b.phase===2?'#3d5ea8':'#27457f',swordColor:'#99d8ff',shieldColor:'#1f2a3f',
    invTimer:b.invTimer,dead:b.dead,isPlayer:false,scale:1.7,isArcher:false,health:b.health,maxHealth:b.maxHealth,type:'heavy'};
  ctx.save();
  if(b.dead) ctx.globalAlpha=Math.max(0,b.deathTimer/3);
  drawStickman(b.x,b.y,b.w,b.h,opts);
  for(const f of b.flashes){
    ctx.fillStyle=f.exploded?`rgba(255,255,220,${Math.min(0.7,f.life*2)})`:'#dde3ef';
    ctx.beginPath(); ctx.arc(f.x-cam.x,f.y-cam.y,f.exploded?(f.r||70):(6),0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawAgent(){
  const b=boss;
  const opts={facingR:b.facingR,walkCycle:b.walkCycle,attacking:b.aiState==='TASER',atkTimer:0.2,atkDur:1,
    shielding:false,color:b.phase===2?'#1d1f30':'#2c3142',swordColor:'#88ddff',shieldColor:'#777',
    invTimer:b.invTimer,dead:b.dead,isPlayer:false,scale:1.75,isArcher:false,health:b.health,maxHealth:b.maxHealth,type:'soldier'};
  ctx.save();
  if(b.dead) ctx.globalAlpha=Math.max(0,b.deathTimer/3);
  drawStickman(b.x,b.y,b.w,b.h,opts);
  const bx=b.x+b.w/2-cam.x, by=b.y+24-cam.y;
  ctx.fillStyle='#f4d7a5'; ctx.fillRect(bx-10,by-10,20,10);
  ctx.fillStyle='#f7d94c'; ctx.fillRect(bx+12,by+8,18,5);
  for(const t of b.tasers){
    ctx.strokeStyle='rgba(100,210,255,0.95)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(t.x-cam.x-(t.w||26)/2,t.y-cam.y); ctx.lineTo(t.x-cam.x+(t.w||26)/2,t.y-cam.y); ctx.stroke();
  }
  for(const f of b.flashes){
    ctx.fillStyle=f.exploded?`rgba(255,255,220,${Math.min(0.75,f.life*2)})`:'#f6f1d5';
    ctx.beginPath(); ctx.arc(f.x-cam.x,f.y-cam.y,f.exploded?(f.r||78):6,0,Math.PI*2); ctx.fill();
  }
  for(const hs of b.heliShots){
    ctx.fillStyle='#ffdd66'; ctx.fillRect(hs.x-cam.x-4,hs.y-cam.y-10,8,20);
  }
  if(b.heli){
    const hx=b.heli.x-cam.x, hy=b.heli.y-cam.y;
    ctx.fillStyle='#1d232e'; ctx.fillRect(hx-26,hy-8,52,16);
    ctx.fillRect(hx-8,hy+8,16,8);
    ctx.strokeStyle='#8894a1'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(hx-34,hy-14); ctx.lineTo(hx+34,hy-14); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(hx,hy-18); ctx.lineTo(hx,hy+18); ctx.stroke();
  }
  ctx.restore();
}

function drawBoss(){
  if(!boss) return;
  switch(boss.type){
    case 'giant':    drawGiant(); break;
    case 'anaconda': drawAnaconda(); break;
    case 'lizard':   drawLizard(); break;
    case 'frostwarden': drawFrostWarden(); break;
    case 'yeti':     drawYeti(); break;
    case 'foreman':  drawForeman(); break;
    case 'mole':     drawMole(); break;
    case 'tunnelfiend': drawTunnelFiend(); break;
    case 'revenant': drawRevenant(); break;
    case 'captain':  drawCaptain(); break;
    case 'agent':    drawAgent(); break;
    case 'mech':     drawMech(); break;
  }
}

function drawProjectiles(){
  for(const p of projs){
    if(p.dead) continue;
    const px=p.x-cam.x, py=p.y-cam.y;
    if(p.type==='bomb'){
      ctx.save();
      ctx.translate(px,py); ctx.rotate(p.rot||0);
      ctx.fillStyle='rgba(255,180,80,0.2)';
      ctx.beginPath(); ctx.arc(0,0,9,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#222'; ctx.strokeStyle='#555'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(0,0,6,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.strokeStyle='#ffcc66'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(2,-4); ctx.lineTo(7,-10); ctx.stroke();
      ctx.fillStyle='#ff8833';
      ctx.beginPath(); ctx.arc(8,-11,2.4,0,Math.PI*2); ctx.fill();
      ctx.restore();
      continue;
    }
    if(p.type==='rocket'){
      ctx.save();
      ctx.translate(px,py); ctx.rotate(Math.atan2(p.vy,p.vx));
      ctx.fillStyle='#ffd9a0';                       // exhaust flare
      ctx.beginPath(); ctx.moveTo(-10,0); ctx.lineTo(-20-Math.random()*8,-3); ctx.lineTo(-20-Math.random()*8,3); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#5a5f6a'; ctx.fillRect(-10,-4,16,8);
      ctx.fillStyle='#ff5a2a';                       // nose cone
      ctx.beginPath(); ctx.moveTo(6,-4); ctx.lineTo(13,0); ctx.lineTo(6,4); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#e8ecf2'; ctx.fillRect(-2,-4,3,8);
      ctx.fillStyle='#3a3f48';                       // tail fins
      ctx.beginPath(); ctx.moveTo(-10,-4); ctx.lineTo(-14,-8); ctx.lineTo(-8,-4); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-10,4); ctx.lineTo(-14,8); ctx.lineTo(-8,4); ctx.closePath(); ctx.fill();
      ctx.restore();
      continue;
    }
    if(p.type==='boomerang'){
      ctx.save();
      ctx.translate(px+8,py+8); ctx.rotate(p.spin);
      ctx.strokeStyle='rgba(143,224,138,0.35)'; ctx.lineWidth=9; ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.beginPath(); ctx.moveTo(-9,7); ctx.lineTo(0,-8); ctx.lineTo(9,7); ctx.stroke();
      ctx.strokeStyle='#8fe08a'; ctx.lineWidth=5;
      ctx.beginPath(); ctx.moveTo(-9,7); ctx.lineTo(0,-8); ctx.lineTo(9,7); ctx.stroke();
      ctx.strokeStyle='#d8ffd0'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(-7,5); ctx.lineTo(0,-6); ctx.lineTo(7,5); ctx.stroke();
      ctx.restore();
      continue;
    }
    const ang=Math.atan2(p.vy,p.vx);
    ctx.save(); ctx.translate(px,py); ctx.rotate(ang);
    ctx.fillStyle='#c89030'; ctx.strokeStyle='#8B6914'; ctx.lineWidth=1;
    ctx.fillRect(-9,-2,18,4);
    ctx.fillStyle='#888'; ctx.fillRect(9,-2,4,4);
    ctx.fillStyle='#4a2800'; ctx.beginPath(); ctx.moveTo(-9,0); ctx.lineTo(-13,-4); ctx.lineTo(-13,4); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

// Active-power-up effects drawn behind Phil. Deliberately not the invTimer
// blink: spawn invincibility flickers Phil himself, while the star wraps him in
// a gold aura, so the two never read as the same state.
function drawPhilAura(){
  const cx=phil.x+phil.w/2-cam.x, cy=phil.y+phil.h/2-cam.y;
  ctx.save();
  if(phil.speedT>0){
    // Motion streaks trailing the direction of travel
    const dir=phil.facingR?-1:1;
    for(let i=1;i<=3;i++){
      ctx.globalAlpha=(0.26/i)*Math.min(1,Math.abs(phil.vx)/160);
      ctx.fillStyle=POWERUPS.speed.color;
      ctx.fillRect(phil.x-cam.x+dir*i*9,phil.y-cam.y+4,phil.w,phil.h-6);
    }
    ctx.globalAlpha=1;
  }
  if(phil.starT>0){
    const t=phil.auraPhase;
    // Flashing ring, and a fade-out warning over the last second
    const fade=Math.min(1,phil.starT);
    ctx.globalAlpha=(0.3+Math.sin(t*9)*0.12)*fade;
    ctx.fillStyle=POWERUPS.star.color;
    ctx.beginPath(); ctx.ellipse(cx,cy,phil.w*0.95,phil.h*0.68,0,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=fade;
    for(let i=0;i<4;i++){
      const a=t*3+i*Math.PI/2;
      starPath(cx+Math.cos(a)*24,cy+Math.sin(a)*20,4,1.7,a*2);
      ctx.fillStyle=i%2?'#fff3b0':POWERUPS.star.color;
      ctx.fill();
    }
  }
  ctx.restore();
}

function starPath(cx,cy,outer,inner,rot){
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const r=i%2?inner:outer, a=rot-Math.PI/2+i*Math.PI/5;
    const x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r;
